services:
  # Web Service - FastAPI Backend + Frontend
  - type: web
    name: astrobot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    # build.sh applies pending DB migrations (see the migration step there) so
    # schema and code can't drift. When this service moves off the free plan,
    # prefer moving that step to a paid-only `preDeployCommand:` here — it runs
    # after build, just before the new version serves, which is the cleaner phase.
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      # Database Configuration (Supabase PostgreSQL)
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      # D4 (Фаза 4): sync-эндпоинты держат соединение на всё время swisseph-расчёта;
      # при N активных слоях × шаг даты + вторая вкладка пул 2+2 исчерпывался
      # (pool_timeout). 3+5 даёт запас без риска для лимитов Supabase.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "300"
      
      # Supabase Configuration
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      
      # Application Configuration
      - key: APP_ENV
        value: production
      - key: ASSISTANT_JUDGE_ENABLED
        value: "true"
      # Narrative Analyst (spec §16): the writing stage, isolated from tool
      # selection. Off in code, on here — quality first, tuning once the beta
      # reacts. Costs about +16s on a broad turn (13.5s -> 29.2s); gunicorn
      # allows 120s and the browser sets no fetch timeout, so the headroom is
      # real. Model and effort defaults were picked by measurement, not by tier
      # name (see model_config). Flip to "false" to fall back to the
      # master-prompt answer with no code change.
      - key: ASSISTANT_NARRATIVE_ENABLED
        value: "true"
      # Owner-only ops view (routes/ops.py): comma-separated emails allowed to
      # read cross-tenant signups and beta feedback. Unset => the route 404s for
      # everyone, which is the intended default. Set it in the Render dashboard,
      # not here: as of 2026-08 this service does not pick up blueprint envVars
      # (ASSISTANT_NARRATIVE_ENABLED above reads "true" and arrives unset at
      # runtime — proved by narrative_diag={"status":"disabled"} on live turns).
      - key: OPS_OWNER_EMAILS
        sync: false
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # LiveKit is a separate, publicly reachable signaling service. These
      # values must point to the same LiveKit project and must not be checked in.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Comma-separated exact hostnames that expose the invite-only Solo flow.
      - key: SOLO_REGISTRATION_HOSTS
        sync: false
      # Canonical origin used in password-reset/auth emails for Solo users.
      - key: SOLO_FRONTEND_BASE_URL
        sync: false
      
      # Swiss Ephemeris Configuration
      # SWISSEPH_EPHE_PATH не задаём - код сам вычислит правильный путь
      
      # API Server Configuration
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      
      # Logging
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: /tmp/astrobot.log
      
      # Python
      - key: PYTHON_VERSION
        value: "3.11"

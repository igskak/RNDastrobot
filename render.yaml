services:
  # Web Service - FastAPI Backend + Frontend
  - type: web
    name: astrobot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    # build.sh applies pending DB migrations (see the migration step there) so
    # schema and code can't drift. When this service moves off the free plan,
    # prefer moving that step to a paid-only `preDeployCommand:` here — it runs
    # after build, just before the new version serves, which is the cleaner phase.
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      # Database Configuration (Supabase PostgreSQL)
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "300"
      
      # Supabase Configuration
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      
      # Application Configuration
      - key: APP_ENV
        value: production
      - key: ASSISTANT_JUDGE_ENABLED
        value: "true"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      
      # Swiss Ephemeris Configuration
      # SWISSEPH_EPHE_PATH не задаём - код сам вычислит правильный путь
      
      # API Server Configuration
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      
      # Logging
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: /tmp/astrobot.log
      
      # Python
      - key: PYTHON_VERSION
        value: "3.11"

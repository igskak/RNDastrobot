name: CI

on:
  push:
  pull_request:
  # So the suite can be re-run against a branch without an empty commit, which is what
  # you want the first few times after a workflow has been off for two months.
  workflow_dispatch:

jobs:
  # Split out of the main job on 2026-09-18. `make test` runs the vendored Swiss
  # Ephemeris suite (setest), which aborts on the Linux runner with "stack smashing
  # detected" in suite_09_rise.c — a crash in the vendored C, not in our code, and it
  # reproduces on a clean checkout. It sat third in the job, so every push went red
  # before a single useful gate ran, and the whole CI workflow was switched off
  # manually on 2026-07-14 and stayed off for two months.
  #
  # Keeping it visible and non-blocking is the honest middle: the crash is still
  # reported, and the gates that do work can gate again. Deleting the step would hide a
  # real bug; leaving it blocking has already cost more than it caught.
  swisseph-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native binaries
        run: make all

      - name: Run Swiss Ephemeris regression tests
        run: make test

  i18n-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci --prefix app

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # `make all` stays here: the Python suite calls the compiled binaries. `make test`
      # does not — it is the vendored suite, and it runs in swisseph-regression above.
      - name: Build native binaries
        run: make all

      - name: Build frontend bundles and verify committed assets
        run: npm --prefix app run check:frontend-build

      - name: Prerender localized pages and verify committed output
        run: npm --prefix app run check:localized-pages

      - name: Python syntax smoke checks
        run: python -m compileall -q app/api app/database app/services app/models app/utils app/i18n

      - name: Python lint (scoped baseline)
        run: flake8 app/utils/ephemeris.py app/i18n/context.py app/i18n/errors.py --count

      - name: Python typecheck (scoped baseline)
        run: mypy --follow-imports=skip app/utils/ephemeris.py app/i18n/context.py app/i18n/errors.py

      - name: I18N missing-key checker (fail-fast)
        run: node app/scripts/check-i18n-missing-keys.cjs

      - name: I18N used-key checker (fail-fast)
        run: node app/scripts/check-i18n-used-keys.cjs

      - name: I18N hardcoded-string checker (fail-fast)
        run: node app/scripts/check-i18n-hardcoded-strings.cjs

      - name: I18N untranslated-value checker (fail-fast)
        run: node app/scripts/check-i18n-untranslated-values.cjs

      - name: Checker unit tests
        run: |
          node --test \
            app/tests/test_i18n_missing_keys_checker.test.cjs \
            app/tests/test_i18n_used_keys_checker.test.cjs \
            app/tests/test_i18n_hardcoded_strings_checker.test.cjs \
            app/tests/test_i18n_untranslated_values_checker.test.cjs \
            app/tests/test_i18n_ci_wiring.test.cjs

      - name: Frontend i18n regressions
        run: |
          node --test \
            app/tests/test_frontend_i18n.test.cjs \
            app/tests/test_frontend_i18n_ui.test.cjs \
            app/tests/test_locale_switcher_navigation.test.cjs \
            app/tests/test_localized_pages_build.test.cjs \
            app/tests/test_frontend_api_client.test.cjs \
            app/tests/test_frontend_timezones.test.cjs \
            app/tests/test_forecast_timeline_utils.test.cjs

      # Forecast workspace tests are self-running scripts (process.exit on failure),
      # not `node --test` suites — invoke each directly so a red assertion fails CI.
      - name: Forecast workspace frontend tests
        run: |
          node app/frontend/js/forecast-new-card-identity.test.js
          node app/frontend/js/forecast-new-multi-layer.test.js
          node app/frontend/js/forecast-new-panel-layout.test.js
          node app/frontend/js/forecast-new-panel-render.test.js
          node app/frontend/js/forecast-new-panel-editor.test.cjs
          node app/frontend/js/forecast-new-swap-invariants.test.cjs
          node app/frontend/js/forecast-new-swap-roles.test.js
          node app/frontend/js/chat-visuals.test.js
          node app/frontend/js/forecast-new-composite-wheel.test.js
          node app/frontend/js/forecast-commands.test.js

      - name: Python regression suite (incl e2e smoke)
        run: python -m pytest -q app/tests

      # Serves the branch and crawls it the way a search engine would. The unit tests
      # cover the routing contract; this covers what the bytes actually say — a page
      # whose copy only appears after JavaScript runs passes every other gate here.
      - name: Organic surface audit (against this branch, served)
        env:
          DATABASE_URL: sqlite+pysqlite:///./_seo_ci.db
          FRONTEND_BASE_URL: http://127.0.0.1:8099
        run: |
          nohup python -m uvicorn app.api.main:app --host 127.0.0.1 --port 8099 \
            --log-level warning > /tmp/seo-ci-api.log 2>&1 &
          for _ in $(seq 1 40); do
            sleep 1
            curl -sf -o /dev/null http://127.0.0.1:8099/robots.txt && break
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/robots.txt \
            || { echo "app did not come up"; cat /tmp/seo-ci-api.log; exit 1; }
          python app/scripts/seo_audit.py \
            --base http://127.0.0.1:8099 \
            --canonical-base https://www.steliara.com

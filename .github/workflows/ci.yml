name: CI

on:
  push:
  pull_request:

jobs:
  i18n-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci --prefix app

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Build native binaries
        run: make all

      - name: Run Swiss Ephemeris regression tests
        run: make test

      - name: Build frontend bundles
        run: npm --prefix app run build:frontend

      - name: Python syntax smoke checks
        run: python -m compileall -q app/api app/services app/models app/utils app/i18n

      - name: Python lint (scoped baseline)
        run: flake8 app/utils/ephemeris.py app/i18n/context.py app/i18n/errors.py --count

      - name: Python typecheck (scoped baseline)
        run: mypy --follow-imports=skip app/utils/ephemeris.py app/i18n/context.py app/i18n/errors.py

      - name: I18N missing-key checker (fail-fast)
        run: node app/scripts/check-i18n-missing-keys.cjs

      - name: I18N hardcoded-string checker (fail-fast)
        run: node app/scripts/check-i18n-hardcoded-strings.cjs

      - name: I18N untranslated-value checker (fail-fast)
        run: node app/scripts/check-i18n-untranslated-values.cjs

      - name: Checker unit tests
        run: |
          node --test \
            app/tests/test_i18n_missing_keys_checker.test.cjs \
            app/tests/test_i18n_hardcoded_strings_checker.test.cjs \
            app/tests/test_i18n_untranslated_values_checker.test.cjs \
            app/tests/test_i18n_ci_wiring.test.cjs

      - name: Frontend i18n regressions
        run: |
          node --test \
            app/tests/test_frontend_i18n.test.cjs \
            app/tests/test_frontend_i18n_ui.test.cjs \
            app/tests/test_frontend_api_client.test.cjs \
            app/tests/test_frontend_timezones.test.cjs \
            app/tests/test_forecast_timeline_utils.test.cjs

      - name: Python regression suite (incl e2e smoke)
        run: python -m pytest -q app/tests

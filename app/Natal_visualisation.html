<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Натальная карта — интерактив 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #05070b;
      --bg-elevated: #0d1117;
      --bg-soft: #111827;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.35);
      --accent-strong: rgba(129, 140, 248, 0.9);
      --accent-warning: #f97316;
      --accent-soft-warning: rgba(249, 115, 22, 0.25);
      --border-subtle: rgba(148, 163, 184, 0.25);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --text-soft: #6b7280;
      --danger: #f97373;
      --radius-xl: 18px;
      --radius-lg: 14px;
      --shadow-soft: 0 22px 60px rgba(15, 23, 42, 0.65);
      --shadow-subtle: 0 10px 30px rgba(15, 23, 42, 0.45);
      --transition-fast: 160ms ease-out;
      --transition-med: 220ms ease-out;
      --font-primary: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at top, #020617 0, #020617 30%, #020617 60%, #020617 100%);
      color: var(--text-main);
      font-family: var(--font-primary);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.16) 0, transparent 55%),
        radial-gradient(circle at 90% 15%, rgba(129, 140, 248, 0.18) 0, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(248, 250, 252, 0.05) 0, transparent 55%);
      opacity: 0.7;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: -1;
    }

    .app-shell {
      min-height: 100vh;
      padding: 18px 14px;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    @media (min-width: 1024px) {
      .app-shell {
        padding: 24px 28px;
      }
    }

    .app {
      width: 100%;
      max-width: 1260px;
      border-radius: 26px;
      background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.98), #020617 65%, #020617);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 18px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(26px) saturate(140%);
    }

    @media (min-width: 1024px) {
      .app {
        padding: 20px 20px 22px;
        gap: 18px;
      }
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      justify-content: space-between;
    }

    .title-block {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .badge {
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(to right, rgba(56, 189, 248, 0.12), rgba(129, 140, 248, 0.18));
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: var(--text-muted);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #facc15, #22c55e);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
    }

    h1 {
      font-size: 20px;
      margin: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      letter-spacing: 0.02em;
    }

    h1 span.sub {
      font-size: 13px;
      color: var(--text-soft);
      font-weight: 500;
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 24px;
      }
      h1 span.sub {
        font-size: 14px;
      }
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .meta-chip {
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .meta-chip strong {
      color: #e5e7eb;
      font-weight: 500;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .panel {
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.39);
      box-shadow: var(--shadow-subtle);
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .panel {
        padding: 16px 15px 15px;
        gap: 12px;
      }
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 10% -10%, rgba(56, 189, 248, 0.06) 0, transparent 40%),
        radial-gradient(circle at 100% 20%, rgba(129, 140, 248, 0.08) 0, transparent 50%),
        radial-gradient(circle at 50% 120%, rgba(15, 118, 110, 0.06) 0, transparent 50%);
      opacity: 0.9;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .panel-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .panel-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-title-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 2px solid rgba(148, 163, 184, 0.6);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 1);
    }

    .panel-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .segmented button {
      border: 0;
      background: transparent;
      color: var(--text-soft);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background var(--transition-fast), color var(--transition-fast),
        box-shadow var(--transition-fast), transform var(--transition-fast);
      white-space: nowrap;
    }

    .segmented button[data-active="true"] {
      background: radial-gradient(circle at top, rgba(129, 140, 248, 0.2), rgba(79, 70, 229, 0.9));
      color: #e5e7eb;
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.7), 0 10px 22px rgba(15, 23, 42, 0.9);
      transform: translateY(-0.5px);
    }

    .segmented button span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.8);
    }

    .segmented button[data-active="true"] span.dot {
      background: #22c55e;
      box-shadow: 0 0 7px rgba(34, 197, 94, 0.9);
    }

    .icon-btn {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      padding: 4px 7px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-soft);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition-fast), border-color var(--transition-fast),
        transform var(--transition-fast), box-shadow var(--transition-fast), color var(--transition-fast);
    }

    .icon-btn:hover {
      background: rgba(15, 23, 42, 1);
      border-color: rgba(129, 140, 248, 0.8);
      color: #e5e7eb;
      transform: translateY(-0.5px);
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.9);
    }

    .icon-btn span.icon {
      font-size: 13px;
    }

    .chart-wrapper {
      position: relative;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 5%, rgba(148, 163, 184, 0.22), #020617);
      padding: 10px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      box-shadow: inset 0 0 40px rgba(15, 23, 42, 0.9);
      aspect-ratio: 1;
    }

    @media (min-width: 768px) {
      .chart-wrapper {
        padding: 14px;
      }
    }

    .chart-inner {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: radial-gradient(circle at center, #020617, #020617 50%, #020617 100%);
      box-shadow: inset 0 0 40px rgba(15, 23, 42, 0.95);
      position: relative;
      overflow: hidden;
    }

    svg#natal-wheel {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chart-overlay-label {
      position: absolute;
      inset: auto 18px 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-soft);
      pointer-events: none;
      mix-blend-mode: screen;
      text-shadow: 0 6px 18px rgba(15, 23, 42, 1);
    }

    .chart-overlay-label span strong {
      color: #e5e7eb;
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 10px;
      color: var(--text-soft);
      margin-top: 4px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 3px 7px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .legend-swatch {
      width: 12px;
      height: 4px;
      border-radius: 999px;
    }

    .legend-swatch.signs {
      background: rgba(129, 140, 248, 0.9);
    }

    .legend-swatch.houses {
      background: rgba(56, 189, 248, 0.9);
    }

    .legend-swatch.planets {
      background: rgba(248, 250, 252, 0.95);
    }

    .legend-swatch.aspects {
      background: rgba(248, 113, 113, 0.9);
    }

    .side-panel-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      height: 100%;
    }

    .tabs {
      display: inline-flex;
      border-radius: 999px;
      padding: 3px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.45);
      align-self: flex-start;
    }

    .tabs button {
      border: 0;
      padding: 5px 10px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 999px;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition-fast), color var(--transition-fast),
        transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .tabs button[data-active="true"] {
      background: radial-gradient(circle at top, rgba(148, 163, 184, 0.3), rgba(15, 23, 42, 0.98));
      color: #e5e7eb;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.95);
      transform: translateY(-0.5px);
    }

    .tabs button span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.7);
    }

    .tabs button[data-active="true"] span.dot {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 1);
    }

    .scroll-area {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
      padding-bottom: 4px;
      margin-right: -4px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }

    .info-card {
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 8px 9px 8px;
      position: relative;
      overflow: hidden;
      transition: transform var(--transition-med), box-shadow var(--transition-med),
        border-color var(--transition-med), background var(--transition-med);
    }

    .info-card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0 0, rgba(129, 140, 248, 0.22) 0, transparent 50%),
        radial-gradient(circle at 120% 120%, rgba(56, 189, 248, 0.2) 0, transparent 55%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-med);
    }

    .info-card:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.95);
      border-color: rgba(129, 140, 248, 0.85);
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 1));
    }

    .info-card:hover::before {
      opacity: 1;
    }

    .info-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 4px;
    }

    .info-main {
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
    }

    .info-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-soft);
    }

    .info-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-bottom: 3px;
    }

    .pill {
      border-radius: 999px;
      padding: 2px 7px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 10px;
      color: var(--text-soft);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.9);
    }

    .pill-dot.good {
      background: #22c55e;
    }

    .pill-dot.hard {
      background: #f97373;
    }

    .info-footer {
      font-size: 10px;
      color: var(--text-soft);
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: center;
    }

    .info-footer span.label {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 500;
    }

    .info-footer span.value {
      font-variant-numeric: tabular-nums;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .soft-tag {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px dashed rgba(148, 163, 184, 0.5);
      color: var(--text-soft);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .soft-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.8);
    }

    .soft-tag-dot.fire {
      background: #f97316;
    }
    .soft-tag-dot.earth {
      background: #22c55e;
    }
    .soft-tag-dot.air {
      background: #38bdf8;
    }
    .soft-tag-dot.water {
      background: #6366f1;
    }

    .tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      padding: 7px 9px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.95);
      font-size: 11px;
      color: var(--text-main);
      display: none;
      max-width: min(260px, 70vw);
      backdrop-filter: blur(18px) saturate(140%);
      white-space: normal;
    }

    .tooltip-title {
      font-weight: 500;
      margin-bottom: 3px;
    }

    .tooltip-body {
      color: var(--text-soft);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-soft);
      margin: 10px 2px 6px;
    }

    .pattern-block {
      border-radius: 12px;
      border: 1px dashed rgba(148, 163, 184, 0.55);
      padding: 6px 8px;
      background: rgba(15, 23, 42, 0.9);
      margin-bottom: 6px;
    }

    .pattern-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .pattern-main {
      font-size: 12px;
      color: #e5e7eb;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .pattern-chip {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.6);
      color: var(--text-soft);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .meter {
      margin-top: 4px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(30, 64, 175, 0.8);
      padding: 2px;
      overflow: hidden;
    }

    .meter-bar {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(59,130,246,0.8), rgba(96,165,250,0.95));
      width: 0%;
      transition: width 220ms ease-out;
    }

    .meter-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-soft);
      margin-top: 3px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.9);
      border-radius: 999px;
    }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="app">
    <header>
      <div class="title-block">
        <div class="badge">
          <span class="badge-dot"></span>
          <span>натальная карта · интерактив</span>
        </div>
        <h1 id="chartTitle">
          <span id="personName">Натальная карта</span>
          <span class="sub" id="chartMetaShort"></span>
        </h1>
      </div>
      <div class="meta-row" id="metaRow">
        <!-- meta chips via JS -->
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-inner">
          <div class="panel-header">
            <div class="panel-title">
              <span class="panel-title-dot"></span>
              Колесо
            </div>
            <div class="panel-actions">
              <div class="segmented" id="wheelMode">
                <button type="button" data-mode="all" data-active="true">
                  <span class="dot"></span> всё
                </button>
                <button type="button" data-mode="planets">
                  <span class="dot"></span> планеты
                </button>
                <button type="button" data-mode="aspects">
                  <span class="dot"></span> аспекты
                </button>
              </div>
              <button class="icon-btn" type="button" id="toggleLabels">
                <span class="icon">◎</span>
                подписи
              </button>
            </div>
          </div>

          <div class="chart-wrapper">
            <div class="chart-inner">
              <svg id="natal-wheel" viewBox="-150 -150 300 300" role="img" aria-labelledby="chartTitle"></svg>
              <div class="chart-overlay-label">
                <span><strong id="ascLabel">ASC</strong> · <span id="dominantElement"></span></span>
                <span id="dominantMode"></span>
              </div>
            </div>
          </div>

          <div class="legend-row">
            <div class="legend-item">
              <span class="legend-swatch signs"></span>
              знаки
            </div>
            <div class="legend-item">
              <span class="legend-swatch houses"></span>
              дома
            </div>
            <div class="legend-item">
              <span class="legend-swatch planets"></span>
              планеты и точки
            </div>
            <div class="legend-item">
              <span class="legend-swatch aspects"></span>
              аспекты
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-inner side-panel-content">
          <div class="panel-header">
            <div class="panel-title">
              <span class="panel-title-dot"></span>
              Структура карты
            </div>
            <div class="panel-actions">
              <div class="tabs" id="infoTabs">
                <button type="button" data-tab="planets" data-active="true">
                  <span class="dot"></span> планеты
                </button>
                <button type="button" data-tab="houses">
                  <span class="dot"></span> дома
                </button>
                <button type="button" data-tab="aspects">
                  <span class="dot"></span> аспекты
                </button>
              </div>
            </div>
          </div>

          <div class="scroll-area">
            <div id="tab-planets" class="tab-content"></div>
            <div id="tab-houses" class="tab-content" hidden></div>
            <div id="tab-aspects" class="tab-content" hidden></div>
          </div>
        </div>
      </section>
    </main>

    <div class="tooltip" id="tooltip"></div>
  </div>
</div>

<script>
  // ===============================

  function normalizeDegree(deg) {
    let d = deg % 360;
    if (d < 0) d += 360;
    return d;
  }

  function polarToCartesian(deg, radius) {
    const rad = (deg - 90) * Math.PI / 180;
    return {
      x: radius * Math.cos(rad),
      y: radius * Math.sin(rad)
    };
  }

  function dominantFromBalance(balanceObj) {
    if (!balanceObj) return null;
    let bestKey = null;
    let bestVal = -Infinity;
    for (const [k, v] of Object.entries(balanceObj)) {
      if (v > bestVal) {
        bestVal = v;
        bestKey = k;
      }
    }
    return bestKey;
  }

  function getObjectDegree(name) {
    const planets = natalData.planets || [];
    const angles = natalData.angles || {};
    const special = natalData.special_points || {};
    const p = planets.find(p => p.name === name);
    if (p) return normalizeDegree(p.longitude);
    if (angles[name]) return normalizeDegree(angles[name].longitude);
    if (special[name]) return normalizeDegree(special[name].longitude);
    return null;
  }

  function getObjectMeta(name) {
    const planets = natalData.planets || [];
    const angles = natalData.angles || {};
    const special = natalData.special_points || {};
    const p = planets.find(p => p.name === name);
    if (p) return { type: "planet", ...p };
    if (angles[name]) return { type: "angle", ...angles[name] };
    if (special[name]) return { type: "point", ...special[name] };
    return { type: "other", name };
  }

  function renderMeta() {
    const birth = natalData.birth_data || {};
    const angles = natalData.angles || {};
    const balances = natalData.balances || {};

    const personNameEl = document.getElementById("personName");
    const metaShortEl = document.getElementById("chartMetaShort");
    const metaRow = document.getElementById("metaRow");

    personNameEl.textContent = "Натальная карта";

    const pieces = [];
    if (birth.date) pieces.push(birth.date);
    if (birth.time) pieces.push(birth.time.slice(0,5));
    if (birth.timezone) pieces.push(birth.timezone.replace("Europe/", ""));
    if (angles.ASC?.sign) {
      const ascSign = angles.ASC.sign;
      pieces.push(`ASC ${SIGN_GLYPHS[ascSign] || ""} ${ascSign}`);
    }
    metaShortEl.textContent = pieces.join(" · ");

    metaRow.innerHTML = "";

    if (birth.place) {
      metaRow.appendChild(metaChip("Место", birth.place));
    } else if (birth.latitude != null && birth.longitude != null) {
      metaRow.appendChild(metaChip("Координаты", `${birth.latitude.toFixed(2)}, ${birth.longitude.toFixed(2)}`));
    }

    if (natalData.planets?.length) {
      metaRow.appendChild(metaChip("Планет", natalData.planets.length.toString()));
    }

    if (natalData.stelliums?.length) {
      metaRow.appendChild(metaChip("Стеллиумы", natalData.stelliums.length.toString()));
    }

    if (natalData.cosmogram_pattern?.pattern_type) {
      metaRow.appendChild(metaChip("Космограмма", natalData.cosmogram_pattern.pattern_type));
    }

    const elementKey = dominantFromBalance(balances.element_balance);
    const modeKey = dominantFromBalance(balances.mode_balance);

    const dominantElementEl = document.getElementById("dominantElement");
    const dominantModeEl = document.getElementById("dominantMode");

    dominantElementEl.textContent = elementKey ? `стихия: ${ELEMENT_LABELS[elementKey] || elementKey}` : "";
    dominantModeEl.textContent = modeKey ? `тип: ${(MODE_LABELS[modeKey] || modeKey).toLowerCase()}` : "";

    const ascLabel = document.getElementById("ascLabel");
    if (angles.ASC?.sign) {
      ascLabel.textContent = `ASC ${SIGN_GLYPHS[angles.ASC.sign] || ""} ${angles.ASC.sign}`;
    } else {
      ascLabel.textContent = "ASC";
    }
  }

  function metaChip(label, value) {
    const el = document.createElement("div");
    el.className = "meta-chip";
    el.innerHTML = `<span>${label}</span><strong>${value}</strong>`;
    return el;
  }

  function renderWheel(mode = "all", showLabels = true) {
    const svg = document.getElementById("natal-wheel");
    svg.innerHTML = "";

    const baseRadius = 140;
    const signOuter = baseRadius;
    const signInner = 100;
    const houseOuter = 92;
    const houseInner = 68;
    const planetRadius = 60;
    const pointRadius = 52;
    const centerRadius = 30;

    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    const glow = document.createElementNS("http://www.w3.org/2000/svg", "filter");
    glow.setAttribute("id", "glow");
    glow.innerHTML = `
      <feGaussianBlur stdDeviation="1.7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    `;
    defs.appendChild(glow);
    svg.appendChild(defs);

    const bgCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    bgCircle.setAttribute("cx", "0");
    bgCircle.setAttribute("cy", "0");
    bgCircle.setAttribute("r", signOuter);
    bgCircle.setAttribute("fill", "#020617");
    bgCircle.setAttribute("stroke", "rgba(148,163,184,0.6)");
    bgCircle.setAttribute("stroke-width", "0.6");
    svg.appendChild(bgCircle);

    SIGNS.forEach((sign, idx) => {
      const startDeg = idx * 30;
      const endDeg = startDeg + 30;
      const largeArc = endDeg - startDeg <= 180 ? 0 : 1;

      const p1 = polarToCartesian(startDeg, signOuter);
      const p2 = polarToCartesian(endDeg, signOuter);
      const p3 = polarToCartesian(endDeg, signInner);
      const p4 = polarToCartesian(startDeg, signInner);

      const pathD = [
        "M", p1.x, p1.y,
        "A", signOuter, signOuter, 0, largeArc, 1, p2.x, p2.y,
        "L", p3.x, p3.y,
        "A", signInner, signInner, 0, largeArc, 0, p4.x, p4.y,
        "Z"
      ].join(" ");

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", pathD);
      path.setAttribute("fill", idx % 2 === 0 ? "rgba(129,140,248,0.09)" : "rgba(15,23,42,0.96)");
      path.setAttribute("stroke", "rgba(148,163,184,0.6)");
      path.setAttribute("stroke-width", "0.3");
      svg.appendChild(path);

      if (showLabels) {
        const midDeg = startDeg + 15;
        const labelPos = polarToCartesian(midDeg, (signOuter + signInner) / 2);
        const signText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        signText.setAttribute("x", labelPos.x);
        signText.setAttribute("y", labelPos.y + 2);
        signText.setAttribute("text-anchor", "middle");
        signText.setAttribute("font-size", "10");
        signText.setAttribute("fill", "rgba(226,232,240,0.9)");
        signText.textContent = SIGN_GLYPHS[sign] || sign[0];
        svg.appendChild(signText);
      }
    });

    const houses = natalData.houses || [];
    if (houses.length) {
      houses.forEach(h => {
        const deg = normalizeDegree(h.longitude);
        const outer = polarToCartesian(deg, houseOuter);
        const inner = polarToCartesian(deg, houseInner);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", outer.x);
        line.setAttribute("y1", outer.y);
        line.setAttribute("x2", inner.x);
        line.setAttribute("y2", inner.y);
        line.setAttribute("stroke", "rgba(56,189,248,0.65)");
        line.setAttribute("stroke-width", "0.8");
        svg.appendChild(line);

        if (showLabels) {
          const mid = polarToCartesian(deg, (houseOuter + houseInner) / 2);
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", mid.x);
          label.setAttribute("y", mid.y - 2);
          label.setAttribute("text-anchor", "middle");
          label.setAttribute("font-size", "7.5");
          label.setAttribute("fill", "rgba(148,163,184,0.95)");
          label.textContent = h.number.toString();
          svg.appendChild(label);
        }
      });
    }

    const angles = natalData.angles || {};

    function drawAxis(aName, bName, color) {
      if (!angles[aName] || !angles[bName]) return;
      const da = normalizeDegree(angles[aName].longitude);
      const db = normalizeDegree(angles[bName].longitude);
      const pa = polarToCartesian(da, signOuter);
      const pb = polarToCartesian(db, signOuter);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", pa.x);
      line.setAttribute("y1", pa.y);
      line.setAttribute("x2", pb.x);
      line.setAttribute("y2", pb.y);
      line.setAttribute("stroke", color);
      line.setAttribute("stroke-width", "1.4");
      line.setAttribute("stroke-opacity", "0.9");
      line.setAttribute("stroke-dasharray", "2 2");
      svg.appendChild(line);
    }

    drawAxis("ASC", "DSC", "rgba(248,250,252,0.85)");
    drawAxis("MC", "IC", "rgba(129,140,248,0.85)");

    const centerCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    centerCircle.setAttribute("cx", "0");
    centerCircle.setAttribute("cy", "0");
    centerCircle.setAttribute("r", centerRadius);
    centerCircle.setAttribute("fill", "rgba(15,23,42,0.98)");
    centerCircle.setAttribute("stroke", "rgba(148,163,184,0.7)");
    centerCircle.setAttribute("stroke-width", "0.8");
    svg.appendChild(centerCircle);

    const centerRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    centerRing.setAttribute("cx", "0");
    centerRing.setAttribute("cy", "0");
    centerRing.setAttribute("r", centerRadius + 6);

    const planets = natalData.planets || [];
    const specialPoints = natalData.special_points || {};

    if (mode !== "aspects") {
      planets.forEach((p, index) => {
        const degree = normalizeDegree(p.longitude);

        const pos = polarToCartesian(degree, offsetRadius);

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");

        circle.setAttribute("cy", pos.y);
        circle.setAttribute("r", 4.5);
        circle.setAttribute("fill", "rgba(248,250,252,0.95)");
        circle.setAttribute("stroke", "rgba(15,23,42,1)");
        circle.setAttribute("stroke-width", "0.7");
        circle.setAttribute("filter", "url(#glow)");
        circle.dataset.tooltip = planetTooltipContent(p);
        circle.dataset.tooltipTitle = `${p.name} ${p.sign ? "(" + p.sign + ")" : ""}`;

        if (showLabels) {
          const labelPos = polarToCartesian(degree, offsetRadius + 9);
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", labelPos.x);
          label.setAttribute("y", labelPos.y + 3);
          label.setAttribute("text-anchor", "middle");
          label.setAttribute("font-size", "7.5");
          label.setAttribute("fill", "rgba(226,232,240,0.95)");
          label.textContent = p.name[0];
          svg.appendChild(label);
        }
      });

      Object.values(specialPoints).forEach(pt => {
        const degree = normalizeDegree(pt.longitude);
        const pos = polarToCartesian(degree, pointRadius);
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", pos.x - 3);
        rect.setAttribute("y", pos.y - 3);
        rect.setAttribute("width", 6);
        rect.setAttribute("height", 6);
        rect.setAttribute("rx", 1.5);
        rect.setAttribute("fill", "rgba(96,165,250,0.9)");
        rect.setAttribute("stroke", "rgba(15,23,42,1)");
        rect.setAttribute("stroke-width", "0.6");
        rect.dataset.tooltipTitle = pt.name;
        rect.dataset.tooltip =
          `Знак: ${SIGN_GLYPHS[pt.sign] || ""} ${pt.sign}<br/>` +
          `Долгота: ${normalizeDegree(pt.longitude).toFixed(2)}°` +
          (pt.house != null ? `<br/>Дом: ${pt.house}` : "");
        svg.appendChild(rect);
      });
    }

    if (mode !== "planets") {
      const aspects = natalData.aspects || [];
      aspects.forEach(a => {
        const d1 = getObjectDegree(a.planet_1);
        const d2 = getObjectDegree(a.planet_2);
        if (d1 == null || d2 == null) return;

        const pos1 = polarToCartesian(d1, planetRadius);
        const pos2 = polarToCartesian(d2, planetRadius);

        const harm = a.harmonic_type || "neutral";
        const isMajor = !!a.is_major;

        let stroke;
        if (harm === "harmonious") stroke = "rgba(52,211,153,0.9)";
        else if (harm === "tense") stroke = "rgba(248,113,113,0.95)";
        else stroke = "rgba(148,163,184,0.9)";

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", pos1.x);
        line.setAttribute("y1", pos1.y);
        line.setAttribute("x2", pos2.x);
        line.setAttribute("y2", pos2.y);
        line.setAttribute("stroke", stroke);
        line.setAttribute("stroke-width", isMajor ? "1.1" : "0.7");
        line.setAttribute("stroke-dasharray", harm === "harmonious" ? "1.5 3" : "3 2");
        line.setAttribute("opacity", isMajor ? "0.95" : "0.6");

        const label = ASPECT_LABELS[a.aspect_type] || a.aspect_type;
        const tone =
          harm === "harmonious" ? "гармоничный" :
          harm === "tense" ? "напряжённый" :
          "нейтральный";

        line.dataset.tooltipTitle = `${a.planet_1} – ${a.planet_2}`;
        line.dataset.tooltip =
          `Аспект: ${label}<br/>Орб: ${a.orb.toFixed(3)}°<br/>` +
          `Тип: ${tone}<br/>${isMajor ? "Главный аспект" : "Минорный аспект"}`;
        svg.appendChild(line);
      });
    }

    attachTooltipHandlers(svg);
  }

  function planetTooltipContent(p) {
    const pieces = [];
    if (p.sign) pieces.push(`Знак: ${SIGN_GLYPHS[p.sign] || ""} ${p.sign}`);
    if (p.degree_in_sign_formatted) pieces.push(`Позиция: ${p.degree_in_sign_formatted}`);
    if (p.house != null) pieces.push(`Дом: ${p.house}`);
    if (p.dignity && p.dignity !== "neutral") {
      const label = {
        domicile: "управитель",
        exaltation: "экзальтация",
        detriment: "изгнание",
        fall: "падение"
      }[p.dignity] || p.dignity;
      pieces.push(`Статус: ${label}`);
    }
    if (p.retrograde) pieces.push("Ретроградная");
    pieces.push(`Баллы силы: ${p.strength_score}`);
    if (p.special_roles?.length) {
      pieces.push(`Роли: ${p.special_roles.join(", ")}`);
    }
    return pieces.join("<br/>");
  }

  // ===============================
  //      РЕНДЕР КАРТОЧЕК
  // ===============================

  function renderTabPlanets() {
    const container = document.getElementById("tab-planets");
    const planets = natalData.planets || [];
    if (!planets.length) {
      container.innerHTML = `<div class="no-data">Нет данных о планетах в карте.</div>`;
      return;
    }

    const grid = document.createElement("div");
    grid.className = "card-grid";

    planets.forEach(p => {
      const el = document.createElement("article");
      el.className = "info-card";

      const signElement = SIGN_ELEMENT[p.sign] || "—";
      const signMode = SIGN_MODE[p.sign] || "—";
      const glyph = p.name[0];
      const dignityLabel = {
        domicile: "управитель",
        exaltation: "экзальтация",
        detriment: "изгнание",
        fall: "падение",
        neutral: "нейтрально"
      }[p.dignity || "neutral"];

      const roles = (p.special_roles || []).map(r => {
        if (r === "almuten") return "альмутен";
        if (r === "aspect_king") return "центр аспектов";
        return r;
      });

      el.innerHTML = `
        <div class="info-card-header">
          <div class="info-main">${glyph} ${p.name}</div>
          <div class="info-tag">${p.sign ? (SIGN_GLYPHS[p.sign] || "") + " " + p.sign : ""}</div>
        </div>
        <div class="info-sub">
          <span class="pill">
            <span class="pill-dot"></span>
            дом ${p.house ?? "—"}
          </span>
          <span class="pill">
            <span class="pill-dot"></span>
            ${signElement.toLowerCase()}
          </span>
          <span class="pill">
            <span class="pill-dot"></span>
            ${signMode.toLowerCase()}
          </span>
        </div>
        <div class="info-footer">
          <span class="label">позиция</span>
          <span class="value">
            ${p.degree_in_sign_formatted || normalizeDegree(p.longitude).toFixed(2) + "°"}
          </span>
        </div>
        <div class="tag-row">
          <span class="soft-tag">
            <span class="soft-tag-dot"></span>
            статус: ${dignityLabel}
          </span>
          <span class="soft-tag">
            <span class="soft-tag-dot"></span>
            сила: ${p.strength_score}
          </span>
          ${p.retrograde ? `
            <span class="soft-tag">
              <span class="soft-tag-dot"></span>
              ретроградная
            </span>` : ""}
          ${roles.map(r => `
            <span class="soft-tag">
              <span class="soft-tag-dot"></span>
              ${r}
            </span>`).join("")}
        </div>
      `;
      grid.appendChild(el);
    });

    container.innerHTML = "";
    container.appendChild(grid);
  }

  function renderTabHouses() {
    const container = document.getElementById("tab-houses");
    const houses = natalData.houses || [];
    if (!houses.length) {
      container.innerHTML = `<div class="no-data">Нет данных о домах.</div>`;
      return;
    }
    const grid = document.createElement("div");
    grid.className = "card-grid";

    houses.forEach(h => {
      const el = document.createElement("article");
      el.className = "info-card";
      const signElement = SIGN_ELEMENT[h.sign] || "—";
      const elementClass = {
        "Огонь": "fire",
        "Земля": "earth",
        "Воздух": "air",
        "Вода": "water"
      }[signElement] || "";

      const houseGroupLabel = {
        angular: "угловой",
        succedent: "последующий",
        cadent: "падающий"
      }[h.house_group] || h.house_group || "—";

      el.innerHTML = `
        <div class="info-card-header">
          <div class="info-main">Дом ${h.number}</div>
          <div class="info-tag">${h.sign ? (SIGN_GLYPHS[h.sign] || "") + " " + h.sign : ""}</div>
        </div>
        <div class="info-sub">
          <span class="pill">
            <span class="pill-dot"></span>
            куспид ${h.degree_in_sign_formatted || normalizeDegree(h.longitude).toFixed(2) + "°"}
          </span>
          <span class="pill">
            <span class="pill-dot"></span>
            тип: ${houseGroupLabel}
          </span>
          <span class="pill">
            <span class="pill-dot"></span>
            управитель: ${h.ruler_planet || "—"}
          </span>
        </div>
        <div class="tag-row">
          <span class="soft-tag">
            <span class="soft-tag-dot ${elementClass}"></span>
            стихия: ${signElement.toLowerCase()}
          </span>
        </div>
        <div class="info-footer">
          <span class="label">ось</span>
          <span class="value">${h.number} / ${(h.number + 6 - 1) % 12 + 1}</span>
        </div>
      `;
      grid.appendChild(el);
    });

    container.innerHTML = "";
    container.appendChild(grid);
  }

  function renderTabAspects() {
    const container = document.getElementById("tab-aspects");
    const aspects = natalData.aspects || [];
    if (!aspects.length) {
      container.innerHTML = `<div class="no-data">Аспектов в карте не найдено.</div>`;
      return;
    }
    const grid = document.createElement("div");
    grid.className = "card-grid";

    const sorted = aspects.slice().sort((a, b) => {
      if (!!a.is_major === !!b.is_major) {
        return Math.abs(a.orb) - Math.abs(b.orb);
      }
      return a.is_major ? -1 : 1;
    });

    sorted.forEach(a => {
      const el = document.createElement("article");
      el.className = "info-card";

      const meta1 = getObjectMeta(a.planet_1);
      const meta2 = getObjectMeta(a.planet_2);

      const label = ASPECT_LABELS[a.aspect_type] || a.aspect_type;
      const harm = a.harmonic_type || "neutral";
      const tone =
        harm === "harmonious" ? "гармоничный" :
        harm === "tense" ? "напряжённый" :
        "нейтральный";
      const toneDotClass =
        harm === "harmonious" ? "good" :
        harm === "tense" ? "hard" : "";

      const signStr1 = meta1.sign ? (SIGN_GLYPHS[meta1.sign] || "") + " " + meta1.sign : "";
      const signStr2 = meta2.sign ? (SIGN_GLYPHS[meta2.sign] || "") + " " + meta2.sign : "";

      el.innerHTML = `
        <div class="info-card-header">
          <div class="info-main">${a.planet_1} · ${a.planet_2}</div>
          <div class="info-tag">${label}</div>
        </div>
        <div class="info-sub">
          <span class="pill">
            <span class="pill-dot ${toneDotClass}"></span>
            ${tone}
          </span>
          <span class="pill">
            <span class="pill-dot"></span>
            орб: ${a.orb.toFixed(3)}°
          </span>
          <span class="pill">
            <span class="pill-dot"></span>
            ${a.is_major ? "главный аспект" : "минорный"}
          </span>
        </div>
        <div class="info-footer">
          <span class="label">фон</span>
          <span class="value">
            ${signStr1} · ${signStr2}
          </span>
        </div>
      `;
      grid.appendChild(el);
    });

    const patternsBlock = document.createElement("div");
    patternsBlock.innerHTML = buildPatternsHtml();
    container.innerHTML = "";
    container.appendChild(grid);
    container.appendChild(patternsBlock);
  }

  function buildPatternsHtml() {
    const cosm = natalData.cosmogram_pattern || {};
    const stelliums = natalData.stelliums || [];
    const balances = natalData.balances || {};
    const yods = (natalData.aspect_configurations || []).filter(c => c.type === "Yod");

    let html = "";

    if (cosm.pattern_type) {
      html += `
        <div class="section-title">космограмма & распределение</div>
        <div class="pattern-block">
          <div class="pattern-label">Тип космограммы</div>
          <div class="pattern-main">
            <span>${cosm.pattern_type}</span>
            ${cosm.anchor_planet ? `<span class="pattern-chip">опорная: ${cosm.anchor_planet}</span>` : ""}
            ${cosm.empty_arc_degree ? `<span class="pattern-chip">пустой сектор: ${cosm.empty_arc_degree}°</span>` : ""}
          </div>
        </div>
      `;
    }

    if (yods.length) {
      const y = yods[0];
      html += `
        <div class="section-title">фигуры аспектов</div>
        <div class="pattern-block">
          <div class="pattern-label">Йод</div>
          <div class="pattern-main">
            <span class="pattern-chip">планеты: ${y.planets_involved.join(", ")}</span>
            <span class="pattern-chip">апекс: ${y.apex_planet}</span>
            <span class="pattern-chip">балл: ${y.strength_score}</span>
          </div>
        </div>
      `;
    }

    if (stelliums.length) {
      html += `<div class="section-title">стеллиумы</div>`;
      stelliums.forEach(s => {
        const where = s.type === "sign"
          ? `в знаке ${SIGN_GLYPHS[s.sign] || ""} ${s.sign}`
          : `в доме ${s.house_number}`;
        html += `
          <div class="pattern-block">
            <div class="pattern-label">${where}</div>
            <div class="pattern-main">
              <span>планеты: ${s.planets.join(", ")}</span>
              <span class="pattern-chip">кол-во: ${s.count}</span>
              <span class="pattern-chip">балл: ${s.strength_score}</span>
            </div>
          </div>
        `;
      });
    }

    if (balances.element_balance || balances.mode_balance) {
      html += `<div class="section-title">баланс стихий и модусов</div>`;

      if (balances.element_balance) {
        const eb = balances.element_balance;
        const total = Object.values(eb).reduce((a, b) => a + b, 0) || 1;
        html += `
          <div class="pattern-block">
            <div class="pattern-label">Стихии</div>
            ${Object.entries(eb).map(([k, v]) => {
              const percent = Math.round(v / total * 100);
              return `
                <div class="meter">
                  <div class="meter-bar" style="width:${percent}%"></div>
                </div>
                <div class="meter-row">
                  <span>${ELEMENT_LABELS[k] || k}</span>
                  <span>${v} (${percent}%)</span>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      if (balances.mode_balance) {
        const mb = balances.mode_balance;
        const total = Object.values(mb).reduce((a, b) => a + b, 0) || 1;
        html += `
          <div class="pattern-block">
            <div class="pattern-label">Кресты (модусы)</div>
            ${Object.entries(mb).map(([k, v]) => {
              const percent = Math.round(v / total * 100);
              return `
                <div class="meter">
                  <div class="meter-bar" style="width:${percent}%"></div>
                </div>
                <div class="meter-row">
                  <span>${MODE_LABELS[k] || k}</span>
                  <span>${v} (${percent}%)</span>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }
    }

    return html;
  }

  // ===============================
  //          ТАБЫ / КНОПКИ
  // ===============================

  function setupTabs() {
    const tabsRoot = document.getElementById("infoTabs");
    tabsRoot.addEventListener("click", e => {
      const btn = e.target.closest("button[data-tab]");
      if (!btn) return;
      const tab = btn.dataset.tab;

      tabsRoot.querySelectorAll("button[data-tab]").forEach(b => {
        b.dataset.active = (b.dataset.tab === tab).toString();
      });

      document.querySelectorAll(".tab-content").forEach(el => {
        el.hidden = el.id !== "tab-" + tab;
      });
    });
  }

  function setupWheelControls() {
    const wheelMode = document.getElementById("wheelMode");
    const toggleLabelsBtn = document.getElementById("toggleLabels");
    let currentMode = "all";
    let showLabels = true;

    wheelMode.addEventListener("click", e => {
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      const mode = btn.dataset.mode;
      currentMode = mode;
      wheelMode.querySelectorAll("button[data-mode]").forEach(b => {
        b.dataset.active = (b.dataset.mode === mode).toString();
      });
      renderWheel(currentMode, showLabels);
    });

    toggleLabelsBtn.addEventListener("click", () => {
      showLabels = !showLabels;
      toggleLabelsBtn.classList.toggle("active", showLabels);
      toggleLabelsBtn.style.borderColor = showLabels
        ? "rgba(129,140,248,0.85)"
        : "rgba(148,163,184,0.5)";
      renderWheel(currentMode, showLabels);
    });
  }

  // ===============================
  //          TOOLTIP SYSTEM
  // ===============================

  function attachTooltipHandlers(root) {
    const tooltip = document.getElementById("tooltip");

    function showTooltip(evt, title, body) {
      if (!title && !body) return;
      tooltip.style.display = "block";
      tooltip.innerHTML = `
        ${title ? `<div class="tooltip-title">${title}</div>` : ""}
        ${body ? `<div class="tooltip-body">${body}</div>` : ""}
      `;
      const rect = tooltip.getBoundingClientRect();
      let x = evt.clientX + 12;
      let y = evt.clientY + 12;
      if (x + rect.width > window.innerWidth - 8) {
        x = evt.clientX - rect.width - 12;
      }
      if (y + rect.height > window.innerHeight - 8) {
        y = evt.clientY - rect.height - 12;
      }
      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    root.addEventListener("pointermove", evt => {
      const target = evt.target;
      if (target && (target.dataset.tooltip || target.dataset.tooltipTitle)) {
        showTooltip(evt, target.dataset.tooltipTitle, target.dataset.tooltip);
      } else {
        hideTooltip();
      }
    });

    root.addEventListener("pointerleave", hideTooltip);
  }

  // ===============================
  //         ИНИЦИАЛИЗАЦИЯ
  // ===============================

  function init() {
    renderMeta();
    renderWheel("all", true);
    renderTabPlanets();
    renderTabHouses();
    renderTabAspects();
    setupTabs();
    setupWheelControls();
  }

  document.addEventListener("DOMContentLoaded", init);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.forecast.tabs.timeline"></title>
    <link rel="stylesheet" href="bundles/forecast-timeline.bundle.css?v=10cf0fbd708f">
    <link rel="stylesheet" href="css/app-nav.css?v=10cf0fbd708f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '10cf0fbd708f';</script>
</head>
<body class="chart-page forecast-range-page workspace-compact">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="common.loading"></div>
    </div>

    <header class="chart-header-compact">
        <span class="app-nav-slot" data-app-nav-slot></span>
        <a href="forecast-new.html" class="ui-btn ui-btn--ghost ui-btn--sm" id="forecastBackBtn" data-i18n-aria-label="common.back" data-i18n-title="common.back">←</a>
        <div class="birth-info-compact">
            <h2 id="pageTitle" data-i18n="page.forecast.tabs.timeline"></h2>
            <p id="pageSubtitle"></p>
        </div>
        <div class="header-nav-buttons">
            <div class="forecast-view-tabs ui-segmented">
                <a href="forecast-new.html" class="forecast-view-tab ui-segmented__item" data-i18n="page.chart.nav.forecast"><i class="forecast-view-tab-icon" aria-hidden="true">◯</i></a>
                <a href="forecast-tables.html" class="forecast-view-tab ui-segmented__item" data-i18n="page.forecast.tabs.table"></a>
                <a href="forecast-timeline.html" class="forecast-view-tab ui-segmented__item is-selected" aria-current="page" data-i18n="page.forecast.tabs.timeline"></a>
            </div>
            <a href="forecast-new.html?layer=solar_return" class="ui-btn ui-btn--ghost ui-btn--sm"><span data-i18n="page.chart.nav.solar"></span></a>
        </div>
    </header>

    <div class="profile-error hidden" id="pageError">
        <p id="pageErrorMsg"></p>
        <a href="/" class="ui-btn ui-btn--secondary" data-i18n="common.back"></a>
    </div>

    <div class="forecast-controls" id="forecastControls">
        <div class="control-group">
            <label data-i18n="common.from"></label>
            <input type="date" id="startDate">
            <label data-i18n="common.to"></label>
            <input type="date" id="endDate">
            <div class="ui-segmented" id="datePresets">
                <button type="button" class="ui-segmented__item" data-days="1" data-i18n="page.forecast.presets.oneDay"></button>
                <button type="button" class="ui-segmented__item" data-months="1" data-i18n="page.forecast.presets.oneMonth"></button>
                <button type="button" class="ui-segmented__item" data-months="3" data-i18n="page.forecast.presets.threeMonths"></button>
                <button type="button" class="ui-segmented__item is-selected" data-months="6" data-i18n="page.forecast.presets.sixMonths"></button>
                <button type="button" class="ui-segmented__item" data-months="12" data-i18n="page.forecast.presets.oneYear"></button>
            </div>
        </div>
        <button type="button" class="ui-btn ui-btn--primary" id="btnCalculate" data-i18n="common.calculate"></button>
    </div>

    <div class="forecast-content">
        <div class="forecast-empty" id="timelineEmpty">
            <div class="empty-icon"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="4" y1="9" x2="20" y2="9"/><line x1="8" y1="16" x2="26" y2="16"/><line x1="4" y1="23" x2="17" y2="23"/></svg></div>
            <div data-i18n="page.forecast.timeline.empty"></div>
        </div>
        <div class="forecast-loading" id="timelineLoading" style="display:none">
            <div class="spinner"></div>
            <div data-i18n="page.forecast.timeline.loading"></div>
        </div>
        <div class="timeline-container" id="timelineContainer" style="display:none">
            <div class="active-events-summary" id="activeEventsSummary"></div>
            <div class="timeline-filters">
                <label class="tl-filter"><input type="checkbox" id="filterMajor" checked> <span data-i18n="common.major"></span></label>
                <span class="tl-event-count" id="tlEventCount"></span>
            </div>
            <div class="timeline-canvas-wrapper">
                <canvas id="timelineCanvas"></canvas>
            </div>
            <div class="timeline-legend" id="timelineLegend"></div>
        </div>
    </div>

    <div class="timeline-tooltip" id="timelineTooltip"></div>

    <script type="module" src="js/bundles/forecast-timeline.bundle.js?v=10cf0fbd708f"></script>
    <script src="/runtime-config.js"></script>
    <script src="js/analytics.js?v=10cf0fbd708f"></script>
    <script src="js/app-nav.js?v=10cf0fbd708f"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steliara — Workspace</title>
    <link rel="stylesheet" href="/bundles/workspace.bundle.css">
</head>
<body class="workspace-page">
    <header class="workspace-header">
        <a href="/" class="workspace-back" aria-label="Назад">←</a>
        <h1>Workspace</h1>
        <div class="workspace-view-switch" role="radiogroup" aria-label="Вид">
            <label><input type="radio" name="wsView" value="single" checked> Одно колесо</label>
            <label><input type="radio" name="wsView" value="multi"> Мульти-колесо</label>
        </div>
    </header>

    <main class="workspace-main">
        <aside class="workspace-side">
            <section class="ws-card" id="wsBaseCard">
                <h2>Базовая карта</h2>
                <div class="ws-source-mode" role="radiogroup" aria-label="Источник">
                    <label><input type="radio" name="wsBaseMode" value="saved" checked> Из базы</label>
                    <label><input type="radio" name="wsBaseMode" value="manual"> Вручную</label>
                </div>
                <div class="ws-saved-block" id="wsBaseSavedBlock">
                    <label class="ws-field">Клиент
                        <select id="wsClientSelect"><option value="">— выберите клиента —</option></select>
                    </label>
                </div>
                <div class="ws-manual-block hidden" id="wsBaseManualBlock">
                    <label class="ws-field">Дата <input type="date" id="wsBaseDate"></label>
                    <label class="ws-field">Время <input type="time" id="wsBaseTime" step="1" value="12:00:00"></label>
                    <label class="ws-field">Таймзона <select id="wsBaseTimezone"></select></label>
                    <label class="ws-field">Место <input type="text" id="wsBasePlace" autocomplete="off" placeholder="Город">
                        <div id="wsBasePlaceSuggestions" class="ws-suggestions"></div>
                    </label>
                    <div class="ws-row">
                        <label class="ws-field">Широта <input type="text" id="wsBaseLat" inputmode="decimal"></label>
                        <label class="ws-field">Долгота <input type="text" id="wsBaseLon" inputmode="decimal"></label>
                    </div>
                    <p class="ws-hint" id="wsEphemeralHint">Карта временная — в базу не сохраняется (D3)</p>
                    <div class="ws-save-block">
                        <label class="ws-field">Имя для сохранения <input type="text" id="wsSaveName" placeholder="Клиент / событие"></label>
                        <button id="wsSaveBtn" class="ws-save-btn" type="button">Сохранить в базу клиентов</button>
                    </div>
                </div>
            </section>

            <section class="ws-card hidden" id="wsRingCard">
                <h2>Кольца сравнения</h2>
                <div class="ws-method-checks" id="wsMethodChecks">
                    <label><input type="checkbox" data-ws-method="transit" checked> Транзиты</label>
                    <label><input type="checkbox" data-ws-method="progression"> Прогрессии</label>
                    <label><input type="checkbox" data-ws-method="direction"> Дирекции</label>
                    <label><input type="checkbox" data-ws-method="solar_return"> Соляр</label>
                    <label><input type="checkbox" data-ws-method="synastry"> Синастрия</label>
                </div>
                <div class="hidden ws-partner-block" id="wsPartnerBlock">
                    <h3>Партнёр</h3>
                    <div class="ws-source-mode" role="radiogroup" aria-label="Источник партнёра">
                        <label><input type="radio" name="wsPartnerMode" value="saved" checked> Из базы</label>
                        <label><input type="radio" name="wsPartnerMode" value="manual"> Вручную</label>
                    </div>
                    <div id="wsPartnerSavedBlock">
                        <label class="ws-field">Партнёр
                            <select id="wsPartnerSelect"><option value="">— выберите клиента —</option></select>
                        </label>
                    </div>
                    <div class="hidden" id="wsPartnerManualBlock">
                        <label class="ws-field">Дата <input type="date" id="wsPartnerDate"></label>
                        <label class="ws-field">Время <input type="time" id="wsPartnerTime" step="1" value="12:00:00"></label>
                        <label class="ws-field">Таймзона <select id="wsPartnerTimezone"></select></label>
                        <label class="ws-field">Место <input type="text" id="wsPartnerPlace" autocomplete="off" placeholder="Город">
                            <div id="wsPartnerPlaceSuggestions" class="ws-suggestions"></div>
                        </label>
                        <div class="ws-row">
                            <label class="ws-field">Широта <input type="text" id="wsPartnerLat" inputmode="decimal"></label>
                            <label class="ws-field">Долгота <input type="text" id="wsPartnerLon" inputmode="decimal"></label>
                        </div>
                    </div>
                </div>
                <label class="ws-field hidden" id="wsDirectionTypeField">Тип дирекции
                    <select id="wsDirectionType">
                        <option value="zodiacal" selected>Зодиакальные</option>
                        <option value="solar_arc">Солнечная дуга</option>
                        <option value="equatorial">Найбод</option>
                    </select>
                </label>
                <div id="wsTargetDatetimeBlock">
                    <label class="ws-field">Дата <input type="date" id="wsTargetDate"></label>
                    <label class="ws-field">Время <input type="time" id="wsTargetTime" step="1" value="12:00:00"></label>
                    <label class="ws-field">Таймзона <select id="wsTargetTimezone"></select></label>
                    <label class="ws-field">Место <input type="text" id="wsTargetPlace" autocomplete="off" placeholder="Город">
                        <div id="wsTargetPlaceSuggestions" class="ws-suggestions"></div>
                    </label>
                    <div class="ws-row">
                        <label class="ws-field">Широта <input type="text" id="wsTargetLat" inputmode="decimal"></label>
                        <label class="ws-field">Долгота <input type="text" id="wsTargetLon" inputmode="decimal"></label>
                    </div>
                </div>
                <div class="hidden" id="wsTargetYearBlock">
                    <label class="ws-field">Год соляра <input type="number" id="wsTargetYear" min="1900" max="2100"></label>
                </div>
            </section>

            <button id="wsBuildBtn" class="ws-build-btn">Построить</button>
            <p id="wsStatus" class="ws-status" role="status"></p>
        </aside>

        <section class="workspace-wheel-shell">
            <div class="ws-empty" id="wsEmptyState">
                <p>Выберите клиента или введите данные рождения — и нажмите «Построить».</p>
            </div>
            <svg id="workspaceWheel" viewBox="0 0 600 600" class="hidden" aria-label="Карта"></svg>
        </section>
    </main>

    <script type="module" src="/js/bundles/workspace.bundle.js"></script>
</body>
</html>

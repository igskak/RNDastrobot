<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.clientProfile.title"></title>
    <link rel="stylesheet" href="/bundles/client-profile.bundle.css?v=910562c281c2">
    <link rel="stylesheet" href="/css/locale-switcher.css?v=910562c281c2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '910562c281c2';</script>
</head>
<body class="profile-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="common.loading"></div>
    </div>

    <div class="profile-shell">

        <!-- ── Header ── -->
        <header class="profile-header">
            <a href="/" class="profile-back" data-i18n-aria-label="page.clientProfile.backToClients">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span data-i18n="page.clientProfile.backToClients"></span>
            </a>

            <div class="profile-header-identity">
                <div class="profile-avatar" id="profileAvatar"></div>
                <div class="profile-header-info">
                    <h1 class="profile-name" id="profileName"></h1>
                    <p class="profile-birth" id="profileBirth"></p>
                </div>
            </div>

            <div class="profile-header-tags" id="profileTags"></div>

            <div class="profile-header-actions">
                <button class="btn-new btn-sm" type="button" id="openChartBtn" data-i18n="page.clients.detail.openChart"></button>
                <button class="btn-call btn-sm" type="button" id="startCallBtn">
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><rect x="1" y="3" width="8" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M9 5.5l3-2v6l-3-2V5.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                    <span data-i18n="page.clientProfile.startCall"></span>
                </button>
                <button class="btn-logout btn-sm" type="button" id="editClientBtn" data-i18n="page.clients.actions.edit"></button>
            </div>
        </header>

        <!-- ── Error state ── -->
        <div id="profileError" class="profile-error hidden">
            <p id="profileErrorMsg"></p>
            <a href="/" class="btn-logout" data-i18n="page.clientProfile.backToClients"></a>
        </div>

        <!-- ── Main content ── -->
        <main id="profileMain" class="profile-main hidden">

            <!-- Row 1: Contact + Stats -->
            <div class="profile-row profile-row-2col">

                <!-- Contact & Notes -->
                <section class="profile-card">
                    <h2 class="profile-card-title" data-i18n="page.clientProfile.sections.contact"></h2>
                    <div class="profile-contact-list" id="profileContactList"></div>
                    <div class="profile-notes-wrap" id="profileNotesWrap">
                        <h3 class="profile-notes-label" data-i18n="page.clientProfile.sections.notes"></h3>
                        <p class="profile-notes-text" id="profileNotes"></p>
                    </div>
                </section>

                <!-- Statistics -->
                <section class="profile-card">
                    <h2 class="profile-card-title" data-i18n="page.clientProfile.sections.statistics"></h2>
                    <div class="profile-stats-grid" id="profileStatsGrid"></div>
                </section>

            </div>

            <!-- Row 1b: Linked Charts (person context) -->
            <section class="profile-card hidden" id="linkedChartsCard">
                <div class="profile-card-header">
                    <h2 class="profile-card-title" data-i18n="page.clientProfile.linkedCharts.title"></h2>
                    <button class="btn-new btn-sm" type="button" id="linkChartBtn" data-i18n="page.clientProfile.linkedCharts.linkBtn"></button>
                </div>
                <p class="profile-empty hidden" id="linkedChartsEmpty" data-i18n="page.clientProfile.linkedCharts.empty"></p>
                <div class="profile-linked-charts-list" id="linkedChartsList"></div>
            </section>

            <!-- Row 2: Related People -->
            <section class="profile-card">
                <div class="profile-card-header">
                    <h2 class="profile-card-title" data-i18n="page.clientProfile.sections.relatedPeople"></h2>
                    <div class="profile-related-header-actions">
                        <button class="btn-logout btn-sm" type="button" id="linkExistingPersonBtn" data-i18n="page.clientProfile.related.linkExisting"></button>
                        <button class="btn-new btn-sm" type="button" id="addRelatedPersonBtn" data-i18n="page.clientProfile.related.add"></button>
                    </div>
                </div>
                <p class="profile-empty hidden" id="relatedPeopleEmpty" data-i18n="page.clientProfile.related.empty"></p>
                <div class="profile-related-list" id="relatedPeopleList"></div>
            </section>

            <!-- Row 4: Key Insights -->
            <section class="profile-card profile-card-insights" id="profileInsightsCard">
                <h2 class="profile-card-title">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" style="opacity:.5"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M7 4v3.5l2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    <span data-i18n="page.clientProfile.sections.keyInsights"></span>
                </h2>
                <ul class="profile-insights-list" id="profileInsightsList"></ul>
                <p class="profile-insights-empty hidden" id="profileInsightsEmpty" data-i18n="page.clientProfile.insights.empty"></p>
            </section>

            <!-- Row 5: Consultation History -->
            <section class="profile-card">
                <div class="profile-card-header">
                    <h2 class="profile-card-title" data-i18n="page.clientProfile.sections.consultations"></h2>
                    <button class="btn-new btn-sm" type="button" id="logSessionBtn" data-i18n="page.clients.detail.logSession"></button>
                </div>

                <div class="profile-filter-tabs" id="consultationFilterTabs">
                    <button class="profile-filter-tab active" data-filter="all" data-i18n="page.clientProfile.filter.all"></button>
                    <button class="profile-filter-tab" data-filter="planned" data-i18n="page.clients.consultation.statuses.planned"></button>
                    <button class="profile-filter-tab" data-filter="completed" data-i18n="page.clients.consultation.statuses.completed"></button>
                    <button class="profile-filter-tab" data-filter="cancelled" data-i18n="page.clients.consultation.statuses.cancelled"></button>
                </div>

                <div id="consultationsWrap">
                    <p class="profile-empty" id="consultationsEmpty" data-i18n="page.clients.detail.noConsultations"></p>
                    <div class="profile-consultations-list" id="consultationsList"></div>
                </div>
            </section>

            <!-- Row 6: Call Recordings -->
            <section class="profile-card">
                <div class="profile-card-header">
                    <h2 class="profile-card-title">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true" style="opacity:.55;margin-right:4px;vertical-align:-1px"><rect x="1" y="3" width="8" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M9 5.5l3-2v6l-3-2V5.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                        <span data-i18n="page.clientProfile.sections.recordings"></span>
                    </h2>
                </div>
                <p class="profile-empty hidden" id="recordingsEmpty" data-i18n="page.clientProfile.recordings.empty"></p>
                <div class="profile-recordings-list" id="recordingsList"></div>
            </section>

        </main>

        <footer class="footer">
            <p data-i18n="common.footer"></p>
        </footer>
    </div>

    <!-- ── Edit Client Dialog (duplicated from clients.html) ── -->
    <div id="editClientBackdrop" class="clients-dialog-backdrop hidden"></div>
    <section id="editClientDialog" class="clients-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="editClientTitle">
        <form id="editClientForm" class="clients-dialog-card">
            <div class="clients-dialog-header">
                <div>
                    <p class="clients-dialog-kicker" data-i18n="page.clients.edit.kicker"></p>
                    <h3 id="editClientTitle" class="clients-dialog-title" data-i18n="page.clients.edit.title"></h3>
                    <p class="clients-dialog-copy" data-i18n="page.clients.edit.subtitle"></p>
                </div>
                <button id="editClientClose" class="clients-dialog-close" type="button" data-i18n-aria-label="common.close">×</button>
            </div>

            <div class="clients-dialog-grid">
                <div class="form-group">
                    <label class="form-label" for="editFirstName" data-i18n="page.index.form.fullName.label"></label>
                    <div class="name-inputs">
                        <input id="editFirstName" type="text" data-i18n-placeholder="page.index.form.fullName.firstNamePlaceholder" required>
                        <input id="editLastName" type="text" data-i18n-placeholder="page.index.form.fullName.lastNamePlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthDate.label"></label>
                    <div class="date-inputs">
                        <input id="editBirthDay" type="number" min="1" max="31" data-i18n-placeholder="page.index.form.birthDate.dayPlaceholder" required>
                        <select id="editBirthMonth" required>
                            <option value="" data-i18n="page.index.form.birthDate.monthPlaceholder"></option>
                            <option value="01" data-i18n="common.month.long.january"></option>
                            <option value="02" data-i18n="common.month.long.february"></option>
                            <option value="03" data-i18n="common.month.long.march"></option>
                            <option value="04" data-i18n="common.month.long.april"></option>
                            <option value="05" data-i18n="common.month.long.may"></option>
                            <option value="06" data-i18n="common.month.long.june"></option>
                            <option value="07" data-i18n="common.month.long.july"></option>
                            <option value="08" data-i18n="common.month.long.august"></option>
                            <option value="09" data-i18n="common.month.long.september"></option>
                            <option value="10" data-i18n="common.month.long.october"></option>
                            <option value="11" data-i18n="common.month.long.november"></option>
                            <option value="12" data-i18n="common.month.long.december"></option>
                        </select>
                        <input id="editBirthYear" type="number" min="1800" max="2100" data-i18n-placeholder="page.index.form.birthDate.yearPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthTime.label"></label>
                    <div class="time-inputs">
                        <input id="editBirthHour" type="number" min="0" max="23" data-i18n-placeholder="page.index.form.birthTime.hoursPlaceholder" required>
                        <span class="time-separator">:</span>
                        <input id="editBirthMinute" type="number" min="0" max="59" data-i18n-placeholder="page.index.form.birthTime.minutesPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editBirthPlace" data-i18n="page.index.form.birthPlace.label"></label>
                    <div class="place-autocomplete-wrapper">
                        <input id="editBirthPlace" class="place-input" type="text" data-i18n-placeholder="page.index.form.birthPlace.placeholder" autocomplete="off" required>
                        <div id="editBirthPlaceSuggestions" class="place-suggestions"></div>
                    </div>
                    <span id="editPlaceHint" class="hint" data-i18n="page.clients.edit.placeHint"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editTimezone" data-i18n="page.index.form.timezone.label"></label>
                    <select id="editTimezone" required>
                        <option value="" data-i18n="page.index.form.timezone.placeholder"></option>
                    </select>
                    <span id="editTimezoneHint" class="hint"></span>
                </div>

                <div class="form-group-divider">
                    <span class="form-divider-label" data-i18n="page.clients.crm.contactHeader"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editEmail" data-i18n="page.clients.crm.email"></label>
                    <input id="editEmail" type="email" data-i18n-placeholder="page.clients.crm.emailPlaceholder">
                </div>

                <div class="form-group form-group-row">
                    <div class="form-group">
                        <label class="form-label" for="editPhone" data-i18n="page.clients.crm.phone"></label>
                        <input id="editPhone" type="tel" data-i18n-placeholder="page.clients.crm.phonePlaceholder">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editMessenger" data-i18n="page.clients.crm.messenger"></label>
                        <input id="editMessenger" type="text" data-i18n-placeholder="page.clients.crm.messengerPlaceholder">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editTags" data-i18n="page.clients.crm.tags"></label>
                    <input id="editTags" type="text" data-i18n-placeholder="page.clients.crm.tagsPlaceholder">
                    <div id="editTagSuggestionsWrap" class="tag-suggestions hidden">
                        <span class="tag-suggestions-label" data-i18n="page.clients.crm.existingTags"></span>
                        <div id="editTagSuggestions" class="tag-suggestions-list"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editNotes" data-i18n="page.clients.crm.notes"></label>
                    <textarea id="editNotes" rows="3" data-i18n-placeholder="page.clients.crm.notesPlaceholder"></textarea>
                </div>

                <div class="form-group hidden" id="editRelationGroup">
                    <label class="form-label" for="editRelationLabel" data-i18n="page.clientProfile.related.relationLabel"></label>
                    <input id="editRelationLabel" type="text" data-i18n-placeholder="page.clientProfile.related.relationPlaceholder">
                </div>
            </div>

            <div id="editClientError" class="error-message hidden"></div>

            <div class="clients-dialog-actions">
                <button id="editClientCancel" class="btn-logout clients-dialog-cancel" type="button" data-i18n="common.cancel"></button>
                <button id="editClientSubmit" class="btn-new clients-dialog-submit" type="submit">
                    <span class="btn-text" data-i18n="page.clients.edit.submit"></span>
                    <span class="btn-loader hidden" data-i18n="page.clients.edit.submitting"></span>
                </button>
            </div>
        </form>
    </section>

    <!-- ── Log Session Dialog (duplicated from clients.html) ── -->
    <div id="logSessionBackdrop" class="clients-dialog-backdrop hidden"></div>
    <section id="logSessionDialog" class="clients-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="logSessionTitle">
        <form id="logSessionForm" class="clients-dialog-card">
            <div class="clients-dialog-header">
                <div>
                    <p class="clients-dialog-kicker" data-i18n="page.clients.consultation.kicker"></p>
                    <h3 id="logSessionTitle" class="clients-dialog-title" data-i18n="page.clients.consultation.title"></h3>
                    <p class="clients-dialog-copy" data-i18n="page.clients.consultation.subtitle"></p>
                </div>
                <button id="logSessionClose" class="clients-dialog-close" type="button" data-i18n-aria-label="common.close">
                    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M4 4l8 8M12 4 4 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <div class="clients-dialog-grid">
                <div class="form-group">
                    <label class="form-label" for="logSessionType" data-i18n="page.clients.consultation.type"></label>
                    <select id="logSessionType" required>
                        <option value="natal" data-i18n="page.clients.consultation.types.natal"></option>
                        <option value="transit" data-i18n="page.clients.consultation.types.transit"></option>
                        <option value="solar_return" data-i18n="page.clients.consultation.types.solar_return"></option>
                        <option value="progression" data-i18n="page.clients.consultation.types.progression"></option>
                        <option value="direction" data-i18n="page.clients.consultation.types.direction"></option>
                        <option value="synastry" data-i18n="page.clients.consultation.types.synastry"></option>
                        <option value="horary" data-i18n="page.clients.consultation.types.horary"></option>
                        <option value="other" data-i18n="page.clients.consultation.types.other"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="logSessionDate" data-i18n="page.clients.consultation.scheduledAt"></label>
                    <input id="logSessionDate" type="datetime-local">
                </div>

                <div class="form-group form-group-row">
                    <div class="form-group">
                        <label class="form-label" for="logSessionStatus" data-i18n="page.clients.consultation.status"></label>
                        <select id="logSessionStatus" required>
                            <option value="completed" data-i18n="page.clients.consultation.statuses.completed"></option>
                            <option value="planned" data-i18n="page.clients.consultation.statuses.planned"></option>
                            <option value="cancelled" data-i18n="page.clients.consultation.statuses.cancelled"></option>
                            <option value="no_show" data-i18n="page.clients.consultation.statuses.no_show"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="logSessionDuration" data-i18n="page.clients.consultation.duration"></label>
                        <input id="logSessionDuration" type="number" min="0" max="600" data-i18n-placeholder="page.clients.consultation.durationPlaceholder">
                    </div>
                </div>

                <div class="form-group form-group-checkbox">
                    <label class="checkbox-label">
                        <input id="logSessionPaid" type="checkbox">
                        <span data-i18n="page.clients.consultation.isPaid"></span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="form-label" for="logSessionNotes" data-i18n="page.clients.consultation.notes"></label>
                    <textarea id="logSessionNotes" rows="3" data-i18n-placeholder="page.clients.consultation.notesPlaceholder"></textarea>
                </div>
            </div>

            <div id="logSessionError" class="error-message hidden"></div>

            <div class="clients-dialog-actions">
                <button id="logSessionCancel" class="btn-logout clients-dialog-cancel" type="button" data-i18n="common.cancel"></button>
                <button id="logSessionSubmit" class="btn-new clients-dialog-submit" type="submit">
                    <span class="btn-text" data-i18n="page.clients.consultation.submit"></span>
                    <span class="btn-loader hidden" data-i18n="page.clients.consultation.submitting"></span>
                </button>
            </div>
        </form>
    </section>

    <div id="toast" class="toast"></div>

    <div id="relatedPickerBackdrop" class="clients-dialog-backdrop hidden"></div>
    <section id="relatedPickerDialog" class="clients-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="relatedPickerTitle">
        <div class="clients-dialog-card related-picker-card">
            <div class="clients-dialog-header">
                <div>
                    <p class="clients-dialog-kicker" data-i18n="page.clientProfile.related.linkKicker"></p>
                    <h3 id="relatedPickerTitle" class="clients-dialog-title" data-i18n="page.clientProfile.related.linkTitle"></h3>
                    <p class="clients-dialog-copy" data-i18n="page.clientProfile.related.linkSubtitle"></p>
                </div>
                <button id="relatedPickerClose" class="clients-dialog-close" type="button" data-i18n-aria-label="common.close">×</button>
            </div>

            <div class="form-group">
                <label class="form-label" for="relatedPickerSearch" data-i18n="page.clientProfile.related.searchLabel"></label>
                <input id="relatedPickerSearch" type="search" data-i18n-placeholder="page.clientProfile.related.searchPlaceholder">
            </div>

            <div class="form-group">
                <label class="form-label" for="relatedPickerRelationLabel" data-i18n="page.clientProfile.related.relationLabel"></label>
                <input id="relatedPickerRelationLabel" type="text" data-i18n-placeholder="page.clientProfile.related.relationPlaceholder">
            </div>

            <div id="relatedPickerError" class="error-message hidden"></div>
            <div class="related-picker-list" id="relatedPickerList"></div>
            <p id="relatedPickerEmpty" class="profile-empty hidden" data-i18n="page.clientProfile.related.noCandidates"></p>

            <div class="clients-dialog-actions">
                <button id="relatedPickerCancel" class="btn-logout clients-dialog-cancel" type="button" data-i18n="common.cancel"></button>
                <button id="relatedPickerSubmit" class="btn-new clients-dialog-submit" type="button">
                    <span class="btn-text" data-i18n="page.clientProfile.related.linkSubmit"></span>
                    <span class="btn-loader hidden" data-i18n="common.loading"></span>
                </button>
            </div>
        </div>
    </section>

    <!-- Link chart picker modal -->
    <div id="linkChartBackdrop" class="clients-dialog-backdrop hidden"></div>
    <section id="linkChartDialog" class="clients-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="linkChartDialogTitle">
        <div class="clients-dialog-card">
            <div class="clients-dialog-header">
                <div>
                    <p class="clients-dialog-kicker" data-i18n="page.clientProfile.linkedCharts.pickerKicker"></p>
                    <h3 id="linkChartDialogTitle" class="clients-dialog-title" data-i18n="page.clientProfile.linkedCharts.pickerTitle"></h3>
                </div>
                <button id="linkChartClose" class="clients-dialog-close" type="button" data-i18n-aria-label="common.close">×</button>
            </div>

            <div class="clients-dialog-grid">
                <div class="form-group">
                    <label class="form-label" for="linkChartSearch" data-i18n="page.clients.searchLabel"></label>
                    <input id="linkChartSearch" class="search-input" type="search" data-i18n-placeholder="page.clients.searchPlaceholder" autocomplete="off">
                </div>
            </div>

            <div id="linkChartPickerList" class="profile-picker-list"></div>
            <p id="linkChartPickerEmpty" class="profile-empty hidden" data-i18n="page.clientProfile.linkedCharts.pickerEmpty"></p>
            <p id="linkChartPickerLoading" class="profile-empty hidden" data-i18n="common.loading"></p>
            <p id="linkChartError" class="error-message hidden"></p>

            <div class="clients-dialog-actions">
                <button id="linkChartCancel" class="btn-logout clients-dialog-cancel" type="button" data-i18n="common.cancel"></button>
            </div>
        </div>
    </section>

    <script type="module" src="/js/bundles/client-profile.bundle.js?v=910562c281c2"></script>
    <script src="/js/locale-switcher.js?v=910562c281c2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.interpretations.title"></title>
    <link rel="stylesheet" href="bundles/interpretations.bundle.css?v=20260324-221127">
    <link rel="stylesheet" href="css/locale-switcher.css?v=20260324-221127">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '20260324-221127';</script>
</head>
<body class="interpretations-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="common.loading"></div>
    </div>

    <header class="natal-header">
        <div class="header-content">
            <a href="/" class="back-btn" data-i18n="page.interpretations.backToNew"></a>
            <div class="birth-info">
                <h1 data-i18n="page.interpretations.header"></h1>
                <p id="birthDetails" class="birth-details"></p>
            </div>
            <div class="header-actions">
                <a href="natal-full.html" class="view-chart-btn">📊 <span data-i18n="page.interpretations.nav.tables"></span></a>
                <a href="chart.html" class="view-chart-btn">🔮 <span data-i18n="page.interpretations.nav.chart"></span></a>
            </div>
        </div>
    </header>

    <main class="interpretations-main">
        <div class="loading-container" id="loadingState">
            <div class="loading-spinner"></div>
            <p class="loading-text" data-i18n="page.interpretations.loading.text"></p>
            <p class="loading-hint" data-i18n="page.interpretations.loading.hint"></p>
        </div>

        <div class="error-container hidden" id="errorState">
            <div class="error-icon">⚠️</div>
            <h2 class="error-title" data-i18n="common.error"></h2>
            <p class="error-message" id="errorMessage"></p>
            <button class="retry-btn" id="retryBtn" data-i18n="common.retry"></button>
        </div>

        <div class="content-container hidden" id="contentState">
            <div class="meta-bar">
                <span class="meta-item" id="metaModel"></span>
                <span class="meta-item" id="metaTokens"></span>
                <span class="meta-item" id="metaTime"></span>
                <span class="meta-item cached" id="metaCached"></span>
            </div>

            <div class="profile-content" id="profileContent"></div>

            <div class="actions-bar">
                <button class="action-btn regenerate" id="regenerateBtn">🔄 <span data-i18n="page.interpretations.actions.regenerate"></span></button>
            </div>
        </div>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script type="module" src="js/bundles/interpretations.bundle.js?v=20260324-221127"></script>
    <script src="js/locale-switcher.js?v=20260324-221127"></script>
</body>
</html>

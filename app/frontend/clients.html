<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.clients.title"></title>
    <link rel="stylesheet" href="bundles/clients.bundle.css?v=1">
    <link rel="stylesheet" href="css/locale-switcher.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '2026-02-19-1';</script>
    <style>
        .clients-page .container {
            max-width: 1120px;
            padding: 16px 14px 24px;
        }

        .clients-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 14px;
            box-shadow: var(--shadow-md);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .clients-meta {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 10px;
            margin-bottom: 10px;
        }

        .controls .search-input {
            width: 100%;
        }

        .results-meta {
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            min-height: 20px;
        }

        .table-wrap {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: auto;
        }

        .clients-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
        }

        .clients-table th,
        .clients-table td {
            padding: 12px 14px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid var(--border);
        }

        .clients-table th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--bg-tertiary);
        }

        .clients-table tbody tr:hover {
            background: var(--bg-tertiary);
        }

        .clients-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            white-space: nowrap;
        }

        .btn-open,
        .btn-delete,
        .btn-new,
        .btn-logout {
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            line-height: 1;
            transition: transform var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
        }

        .btn-open {
            background: var(--accent);
            color: #fff;
            padding: 8px 14px;
        }

        .btn-open:hover {
            background: var(--accent-hover);
        }

        .btn-delete {
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
            padding: 7px 14px;
        }

        .btn-delete:hover,
        .btn-delete.confirming {
            background: var(--error);
            color: #fff;
        }

        .btn-new {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            background: var(--success);
            color: #fff;
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-new:hover {
            background: #16a34a;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-logout:hover {
            background: var(--bg-tertiary);
        }

        .btn-open:focus-visible,
        .btn-delete:focus-visible,
        .btn-new:focus-visible,
        .btn-logout:focus-visible {
            outline: 3px solid var(--accent-light);
            outline-offset: 2px;
        }

        .btn-open:active,
        .btn-delete:active,
        .btn-new:active,
        .btn-logout:active {
            transform: scale(0.98);
        }

        .empty-state,
        .loading {
            text-align: center;
            padding: 54px 20px;
            color: var(--text-secondary);
        }

        .empty-state p {
            margin-top: 12px;
            font-size: 15px;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: var(--text-primary);
            color: #fff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            padding: 11px 14px;
            font-size: 13px;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 10001;
            max-width: 340px;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--error);
        }

        @media (max-width: 900px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .clients-table {
                min-width: 0;
            }

            .clients-table thead {
                display: none;
            }

            .clients-table,
            .clients-table tbody,
            .clients-table tr,
            .clients-table td {
                display: block;
                width: 100%;
            }

            .clients-table tr {
                border-bottom: 1px solid var(--border);
                padding: 10px 0;
            }

            .clients-table td {
                border: 0;
                padding: 6px 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                text-align: right;
            }

            .clients-table td::before {
                content: attr(data-label);
                color: var(--text-secondary);
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                text-align: left;
            }

            .clients-actions {
                justify-content: flex-start;
                width: 100%;
            }
        }
    </style>
</head>
<body class="clients-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="common.loading"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1 class="logo">🌟 <span data-i18n="common.brandName"></span></h1>
            <p class="subtitle" data-i18n="page.clients.subtitle"></p>
        </header>

        <main class="form-container">
            <section class="clients-card" data-i18n-aria-label="page.clients.listAriaLabel">
                <div class="top-bar">
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <span id="clientCount" class="clients-meta" aria-live="polite"></span>
                        <span id="welcomeLabel" class="clients-meta"></span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <a href="/new" class="btn-new">➕ <span data-i18n="page.clients.newCard"></span></a>
                        <button id="logoutBtn" class="btn-logout" type="button">Logout</button>
                    </div>
                </div>

                <div class="controls">
                    <input id="searchInput" class="search-input" type="search" data-i18n-placeholder="page.clients.searchPlaceholder" data-i18n-aria-label="page.clients.searchAriaLabel">
                    <select id="sortSelect" data-i18n-aria-label="page.clients.sortAriaLabel">
                        <option value="created_desc" data-i18n="page.clients.sort.createdDesc"></option>
                        <option value="created_asc" data-i18n="page.clients.sort.createdAsc"></option>
                        <option value="name_asc" data-i18n="page.clients.sort.nameAsc"></option>
                        <option value="name_desc" data-i18n="page.clients.sort.nameDesc"></option>
                        <option value="birth_asc" data-i18n="page.clients.sort.birthAsc"></option>
                        <option value="birth_desc" data-i18n="page.clients.sort.birthDesc"></option>
                    </select>
                </div>

                <div id="resultsMeta" class="results-meta" aria-live="polite"></div>

                <div id="loading" class="loading" data-i18n="common.loading"></div>

                <div id="emptyState" class="empty-state hidden">
                    <div style="font-size: 44px;">📋</div>
                    <p data-i18n="page.clients.empty"></p>
                    <a href="/new" class="btn-new" style="margin-top: 18px;">➕ <span data-i18n="page.clients.createFirstCard"></span></a>
                </div>

                <div id="noResultsState" class="empty-state hidden">
                    <div style="font-size: 44px;">🔎</div>
                    <p data-i18n="page.clients.noResults"></p>
                </div>

                <div id="tableWrap" class="table-wrap hidden">
                    <table id="clientsTable" class="clients-table">
                        <thead>
                            <tr>
                                <th data-i18n="page.clients.table.name"></th>
                                <th data-i18n="page.clients.table.birthDate"></th>
                                <th data-i18n="page.clients.table.place"></th>
                                <th data-i18n="page.clients.table.created"></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="clientsBody"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p data-i18n="common.footer"></p>
        </footer>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="js/bundles/clients.bundle.js?v=2"></script>
    <script src="js/locale-switcher.js?v=3"></script>
</body>
</html>

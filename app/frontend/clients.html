    <style>
        /* Chip multi-select for linking people to a chart (edit dialog) */
        #editChartPersonWrap { position: relative; }
        #editChartPersonWrap > input { width: 100%; }
        .scm-person-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .scm-person-chips:empty { display: none; }
        .scm-person-chips .scm-tag-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 6px 4px 10px;
            border: 1px solid rgba(184, 147, 90, 0.32);
            border-radius: 999px;
            background: rgba(184, 147, 90, 0.07);
            font-size: 13px; font-weight: 500; color: var(--text-primary, #1a1614);
        }
        .scm-person-chips .scm-tag-chip-del {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; padding: 0; border: none;
            border-radius: 999px; background: transparent;
            color: var(--text-secondary, #6b6259); font-size: 15px; line-height: 1; cursor: pointer;
        }
        .scm-person-chips .scm-tag-chip-del:hover {
            background: rgba(184, 147, 90, 0.24); color: var(--text-primary, #1a1614);
        }
    </style>

    <div id="logSessionBackdrop" class="clients-dialog-backdrop hidden"></div>

                    </div>
                    <div class="form-group">
                        <label class="form-label" for="logSessionDuration" data-i18n="page.clients.consultation.duration"></label>
                        <input id="logSessionDuration" type="number" min="0" max="600" data-i18n-placeholder="page.clients.consultation.durationPlaceholder">
                    </div>
                </div>

                <div class="form-group form-group-checkbox">
                    <label class="checkbox-label">
                        <input id="logSessionPaid" type="checkbox">
                        <span data-i18n="page.clients.consultation.isPaid"></span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="form-label" for="logSessionNotes" data-i18n="page.clients.consultation.notes"></label>
                    <textarea id="logSessionNotes" rows="3" data-i18n-placeholder="page.clients.consultation.notesPlaceholder"></textarea>
                </div>
            </div>

            <div id="logSessionError" class="error-message hidden"></div>

            <div class="clients-dialog-actions">
                <button id="logSessionCancel" class="btn-logout clients-dialog-cancel" type="button" data-i18n="common.cancel"></button>
                <button id="logSessionSubmit" class="btn-new clients-dialog-submit" type="submit">
                    <span class="btn-text" data-i18n="page.clients.consultation.submit"></span>
                    <span class="btn-loader hidden" data-i18n="page.clients.consultation.submitting"></span>
                </button>
            </div>
        </form>
    </section>

    <!-- Create standalone chart modal -->
    <div id="newChartBackdrop" class="clients-dialog-backdrop hidden"></div>
    <section id="newChartDialog" class="clients-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="newChartDialogTitle">
        <form id="newChartForm" class="clients-dialog-card">
            <div class="clients-dialog-header">
                <div>
                    <p class="clients-dialog-kicker" data-i18n="page.clients.newChart.kicker"></p>
                    <h3 id="newChartDialogTitle" class="clients-dialog-title" data-i18n="page.clients.newChart.title"></h3>
                </div>
                <button id="newChartClose" class="clients-dialog-close" type="button" data-i18n-aria-label="common.close">×</button>
            </div>

            <div class="clients-dialog-grid">
                <div class="form-group">
                    <label class="form-label" for="newChartTitle" data-i18n="page.clients.newChart.chartTitle"></label>
                    <input id="newChartTitle" type="text" data-i18n-placeholder="page.clients.newChart.chartTitlePlaceholder">
                </div>

                <fieldset class="new-chart-profile-fieldset">
                    <legend class="form-label" data-i18n="page.clients.newChart.profile.heading"></legend>
                    <p class="new-chart-profile-intro" data-i18n="page.clients.newChart.profile.intro"></p>
                    <div class="new-chart-profile-options">
                        <label class="new-chart-profile-option">
                            <input type="radio" name="newChartProfileMode" value="new" checked>
                            <span class="new-chart-profile-option-icon" aria-hidden="true">＋</span>
                            <span class="new-chart-profile-option-copy">
                                <strong data-i18n="page.clients.newChart.profile.newTitle"></strong>
                                <small data-i18n="page.clients.newChart.profile.newHint"></small>
                            </span>
                        </label>
                        <label class="new-chart-profile-option">
                            <input type="radio" name="newChartProfileMode" value="existing">
                            <span class="new-chart-profile-option-icon" aria-hidden="true">⌕</span>
                            <span class="new-chart-profile-option-copy">
                                <strong data-i18n="page.clients.newChart.profile.existingTitle"></strong>
                                <small data-i18n="page.clients.newChart.profile.existingHint"></small>
                            </span>
                        </label>
                        <label class="new-chart-profile-option">
                            <input type="radio" name="newChartProfileMode" value="none">
                            <span class="new-chart-profile-option-icon" aria-hidden="true">○</span>
                            <span class="new-chart-profile-option-copy">
                                <strong data-i18n="page.clients.newChart.profile.noneTitle"></strong>
                                <small data-i18n="page.clients.newChart.profile.noneHint"></small>
                            </span>
                        </label>
                    </div>

                    <div id="newChartNewProfileFields" class="new-chart-profile-details">
                        <label class="form-label" for="newChartProfileName" data-i18n="page.clients.newChart.profile.nameLabel"></label>
                        <input id="newChartProfileName" type="text" data-i18n-placeholder="page.clients.newChart.profile.namePlaceholder">
                    </div>

                    <div id="newChartExistingProfileFields" class="new-chart-profile-details hidden">
                        <label class="form-label" for="newChartProfileSearch" data-i18n="page.clients.newChart.profile.searchLabel"></label>
                        <div class="new-chart-profile-search-wrap">
                            <input id="newChartProfileSearch" type="search" autocomplete="off" data-i18n-placeholder="page.clients.newChart.profile.searchPlaceholder">
                            <div id="newChartProfileResults" class="new-chart-profile-results" role="listbox"></div>
                        </div>
                        <div id="newChartSelectedProfile" class="new-chart-selected-profile hidden"></div>
                    </div>

                    <p id="newChartNoProfileNote" class="new-chart-profile-note hidden" data-i18n="page.clients.newChart.profile.noneNote"></p>
                </fieldset>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthDate.label"></label>
                    <div class="date-inputs">
                        <input id="newChartDay" type="number" min="1" max="31" data-i18n-placeholder="page.index.form.birthDate.dayPlaceholder" required>
                        <select id="newChartMonth" required>
                            <option value="" data-i18n="page.index.form.birthDate.monthPlaceholder"></option>
                            <option value="01" data-i18n="common.month.long.january"></option>
                            <option value="02" data-i18n="common.month.long.february"></option>
                            <option value="03" data-i18n="common.month.long.march"></option>
                            <option value="04" data-i18n="common.month.long.april"></option>
                            <option value="05" data-i18n="common.month.long.may"></option>
                            <option value="06" data-i18n="common.month.long.june"></option>
                            <option value="07" data-i18n="common.month.long.july"></option>
                            <option value="08" data-i18n="common.month.long.august"></option>
                            <option value="09" data-i18n="common.month.long.september"></option>
                            <option value="10" data-i18n="common.month.long.october"></option>
                            <option value="11" data-i18n="common.month.long.november"></option>
                            <option value="12" data-i18n="common.month.long.december"></option>
                        </select>
                        <input id="newChartYear" type="number" min="1800" max="2100" data-i18n-placeholder="page.index.form.birthDate.yearPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthTime.label"></label>
                    <div class="time-inputs">
                        <input id="newChartHour" type="number" min="0" max="23" data-i18n-placeholder="page.index.form.birthTime.hoursPlaceholder" required>
                        <span class="time-separator">:</span>
                        <input id="newChartMinute" type="number" min="0" max="59" data-i18n-placeholder="page.index.form.birthTime.minutesPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="newChartPlace" data-i18n="page.index.form.birthPlace.label"></label>
                    <div class="place-autocomplete-wrapper">
                        <input id="newChartPlace" class="place-input" type="text" data-i18n-placeholder="page.index.form.birthPlace.placeholder" autocomplete="off" required>
                        <div id="newChartPlaceSuggestions" class="place-suggestions"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="newChartTimezone" data-i18n="page.index.form.timezone.label"></label>
                    <select id="newChartTimezone" required>
                        <option value="" data-i18n="page.index.form.timezone.placeholder"></option>
                    </select>
                </div>
            </div>

            <div id="newChartError" class="error-message hidden"></div>

            <div class="clients-dialog-actions">
                <button id="newChartCancel" class="btn-logout clients-dialog-cancel" type="button" data-i18n="common.cancel"></button>
                <button id="newChartSubmit" class="btn-new clients-dialog-submit" type="submit">
                    <span class="btn-text" data-i18n="page.clients.newChart.submit"></span>
                    <span class="btn-loader hidden" data-i18n="common.loading"></span>
                </button>
            </div>
        </form>
    </section>

    <div id="toast" class="toast"></div>

    <script type="module" src="js/bundles/clients.bundle.js?v=60e221ed9c70"></script>
    <script src="/runtime-config.js"></script>
    <script src="js/analytics.js?v=60e221ed9c70"></script>
    <script src="js/locale-switcher.js?v=60e221ed9c70"></script>
</body>

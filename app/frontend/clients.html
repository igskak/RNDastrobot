<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.clients.title"></title>
    <link rel="stylesheet" href="bundles/clients.bundle.css?v=20260319-2">
    <link rel="stylesheet" href="css/locale-switcher.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '2026-03-19-2';</script>
</head>
<body class="clients-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="common.loading"></div>
    </div>

    <div class="clients-shell">
        <header class="clients-header">
            <div class="clients-brand-block">
                <h1 class="logo">
                    <svg class="logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="14" cy="14" r="12.5" stroke="#1E3A5F" stroke-width="1.25"/>
                        <circle cx="14" cy="14" r="7.5" stroke="#B8935A" stroke-width="0.8" stroke-dasharray="2.5 3"/>
                        <circle cx="14" cy="14" r="2.2" fill="#1E3A5F"/>
                        <circle cx="14" cy="2.2" r="1.3" fill="#B8935A"/>
                        <circle cx="24.1" cy="8" r="1.3" fill="#B8935A" opacity="0.65"/>
                        <circle cx="24.1" cy="20" r="1.3" fill="#B8935A" opacity="0.45"/>
                        <circle cx="14" cy="25.8" r="1.3" fill="#B8935A" opacity="0.8"/>
                        <circle cx="3.9" cy="20" r="1.3" fill="#B8935A" opacity="0.55"/>
                        <circle cx="3.9" cy="8" r="1.3" fill="#B8935A" opacity="0.7"/>
                    </svg>
                    <span data-i18n="common.brandName"></span>
                </h1>
                <p class="clients-brand-subtitle" data-i18n="page.clients.hero.eyebrow"></p>
            </div>

            <div class="clients-header-actions">
                <div class="header-account-pill">
                    <span class="header-account-label" data-i18n="page.clients.profile.label"></span>
                    <span id="welcomeLabel" class="header-account-value"></span>
                </div>
                <button id="logoutBtn" class="btn-logout" type="button" data-i18n="page.clients.actions.logout"></button>
            </div>
        </header>

        <section id="workspaceHero" class="workspace-hero">
            <div class="workspace-hero-copy">
                <p class="workspace-eyebrow" data-i18n="page.clients.hero.kicker"></p>
                <h2 class="workspace-title" data-i18n="page.clients.hero.title"></h2>
                <p class="workspace-subtitle" data-i18n="page.clients.hero.subtitle"></p>

                <div class="workspace-badges" data-i18n-aria-label="page.clients.hero.badgesAriaLabel">
                    <span class="workspace-badge" data-i18n="page.clients.hero.badges.private"></span>
                    <span class="workspace-badge" data-i18n="page.clients.hero.badges.history"></span>
                    <span class="workspace-badge" data-i18n="page.clients.hero.badges.reports"></span>
                </div>
            </div>

            <aside class="workspace-aside">
                <p class="workspace-aside-label" data-i18n="page.clients.hero.aside.label"></p>
                <h3 class="workspace-aside-title" data-i18n="page.clients.hero.aside.title"></h3>
                <p class="workspace-aside-copy" data-i18n="page.clients.hero.aside.subtitle"></p>

                <div class="workspace-points">
                    <div class="workspace-point">
                        <span class="workspace-point-icon" aria-hidden="true"></span>
                        <span data-i18n="page.clients.hero.aside.point1"></span>
                    </div>
                    <div class="workspace-point">
                        <span class="workspace-point-icon" aria-hidden="true"></span>
                        <span data-i18n="page.clients.hero.aside.point2"></span>
                    </div>
                    <div class="workspace-point">
                        <span class="workspace-point-icon" aria-hidden="true"></span>
                        <span data-i18n="page.clients.hero.aside.point3"></span>
                    </div>
                </div>
            </aside>
        </section>

        <main class="workspace-main">
            <section class="clients-card" data-i18n-aria-label="page.clients.listAriaLabel">
                <div class="clients-card-top">
                    <div class="clients-card-heading">
                        <p class="section-kicker" data-i18n="page.clients.workspace.kicker"></p>
                        <h2 class="section-title" data-i18n="page.clients.workspace.title"></h2>
                        <p class="section-subtitle" data-i18n="page.clients.workspace.subtitle"></p>
                        <p id="clientCount" class="clients-meta" aria-live="polite"></p>
                    </div>

                    <div class="clients-card-actions">
                        <a href="/new" class="btn-new">
                            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                            <span data-i18n="page.clients.newCard"></span>
                        </a>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-label" data-i18n="page.clients.stats.total"></span>
                            <strong id="statTotal" class="stat-value"></strong>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label" data-i18n="page.clients.stats.latest"></span>
                            <strong id="statLatest" class="stat-value stat-value-small"></strong>
                        </div>
                    </div>
                </div>

                <div class="toolbar-card">
                    <div class="toolbar-field toolbar-field-search">
                        <label class="toolbar-label" for="searchInput" data-i18n="page.clients.searchLabel"></label>
                        <div class="search-input-wrap">
                            <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                            <input id="searchInput" class="search-input" type="search" data-i18n-placeholder="page.clients.searchPlaceholder" data-i18n-aria-label="page.clients.searchAriaLabel">
                        </div>
                    </div>

                    <div class="toolbar-field toolbar-field-sort">
                        <label class="toolbar-label" for="sortSelect" data-i18n="page.clients.sortLabel"></label>
                        <select id="sortSelect" data-i18n-aria-label="page.clients.sortAriaLabel">
                            <option value="created_desc" data-i18n="page.clients.sort.createdDesc"></option>
                            <option value="created_asc" data-i18n="page.clients.sort.createdAsc"></option>
                            <option value="name_asc" data-i18n="page.clients.sort.nameAsc"></option>
                            <option value="name_desc" data-i18n="page.clients.sort.nameDesc"></option>
                            <option value="birth_asc" data-i18n="page.clients.sort.birthAsc"></option>
                            <option value="birth_desc" data-i18n="page.clients.sort.birthDesc"></option>
                        </select>
                    </div>
                </div>

                <div id="resultsMeta" class="results-meta" aria-live="polite"></div>

                <div id="loading" class="loading" data-i18n="common.loading"></div>

                <div id="emptyState" class="empty-state hidden">
                    <svg class="empty-state-icon" width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true"><rect x="10" y="12" width="36" height="32" rx="4" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="20" x2="46" y2="20" stroke="currentColor" stroke-width="1.5"/><line x1="18" y1="12" x2="18" y2="20" stroke="currentColor" stroke-width="1.5"/><line x1="38" y1="12" x2="38" y2="20" stroke="currentColor" stroke-width="1.5"/><line x1="18" y1="29" x2="38" y2="29" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="18" y1="36" x2="31" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <h3 class="state-title" data-i18n="page.clients.empty"></h3>
                    <p class="state-copy" data-i18n="page.clients.emptyHint"></p>
                    <a href="/new" class="btn-new state-cta">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <span data-i18n="page.clients.createFirstCard"></span>
                    </a>
                </div>

                <div id="noResultsState" class="empty-state hidden">
                    <svg class="empty-state-icon" width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="1.5"/><path d="M35 35L46 46" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <h3 class="state-title" data-i18n="page.clients.noResults"></h3>
                    <p class="state-copy" data-i18n="page.clients.noResultsHint"></p>
                </div>

                <div id="tableWrap" class="table-wrap hidden">
                    <table id="clientsTable" class="clients-table">
                        <thead>
                            <tr>
                                <th data-i18n="page.clients.table.name"></th>
                                <th data-i18n="page.clients.table.birthDate"></th>
                                <th data-i18n="page.clients.table.place"></th>
                                <th data-i18n="page.clients.table.created"></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="clientsBody"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p data-i18n="common.footer"></p>
        </footer>
    </div>

    <div id="editClientBackdrop" class="clients-dialog-backdrop hidden"></div>
    <section id="editClientDialog" class="clients-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="editClientTitle">
        <form id="editClientForm" class="clients-dialog-card">
            <div class="clients-dialog-header">
                <div>
                    <p class="clients-dialog-kicker" data-i18n="page.clients.edit.kicker"></p>
                    <h3 id="editClientTitle" class="clients-dialog-title" data-i18n="page.clients.edit.title"></h3>
                    <p class="clients-dialog-copy" data-i18n="page.clients.edit.subtitle"></p>
                </div>
                <button id="editClientClose" class="clients-dialog-close" type="button" data-i18n-aria-label="common.close">×</button>
            </div>

            <div class="clients-dialog-grid">
                <div class="form-group">
                    <label class="form-label" for="editFirstName" data-i18n="page.index.form.fullName.label"></label>
                    <div class="name-inputs">
                        <input id="editFirstName" type="text" data-i18n-placeholder="page.index.form.fullName.firstNamePlaceholder" required>
                        <input id="editLastName" type="text" data-i18n-placeholder="page.index.form.fullName.lastNamePlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthDate.label"></label>
                    <div class="date-inputs">
                        <input id="editBirthDay" type="number" min="1" max="31" data-i18n-placeholder="page.index.form.birthDate.dayPlaceholder" required>
                        <select id="editBirthMonth" required>
                            <option value="" data-i18n="page.index.form.birthDate.monthPlaceholder"></option>
                            <option value="01" data-i18n="common.month.long.january"></option>
                            <option value="02" data-i18n="common.month.long.february"></option>
                            <option value="03" data-i18n="common.month.long.march"></option>
                            <option value="04" data-i18n="common.month.long.april"></option>
                            <option value="05" data-i18n="common.month.long.may"></option>
                            <option value="06" data-i18n="common.month.long.june"></option>
                            <option value="07" data-i18n="common.month.long.july"></option>
                            <option value="08" data-i18n="common.month.long.august"></option>
                            <option value="09" data-i18n="common.month.long.september"></option>
                            <option value="10" data-i18n="common.month.long.october"></option>
                            <option value="11" data-i18n="common.month.long.november"></option>
                            <option value="12" data-i18n="common.month.long.december"></option>
                        </select>
                        <input id="editBirthYear" type="number" min="1800" max="2100" data-i18n-placeholder="page.index.form.birthDate.yearPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthTime.label"></label>
                    <div class="time-inputs">
                        <input id="editBirthHour" type="number" min="0" max="23" data-i18n-placeholder="page.index.form.birthTime.hoursPlaceholder" required>
                        <span class="time-separator">:</span>
                        <input id="editBirthMinute" type="number" min="0" max="59" data-i18n-placeholder="page.index.form.birthTime.minutesPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editBirthPlace" data-i18n="page.index.form.birthPlace.label"></label>
                    <div class="place-autocomplete-wrapper">
                        <input id="editBirthPlace" class="place-input" type="text" data-i18n-placeholder="page.index.form.birthPlace.placeholder" autocomplete="off" required>
                        <div id="editBirthPlaceSuggestions" class="place-suggestions"></div>
                    </div>
                    <span id="editPlaceHint" class="hint" data-i18n="page.clients.edit.placeHint"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editTimezone" data-i18n="page.index.form.timezone.label"></label>
                    <select id="editTimezone" required>
                        <option value="" data-i18n="page.index.form.timezone.placeholder"></option>
                    </select>
                    <span id="editTimezoneHint" class="hint"></span>
                </div>
            </div>

            <div id="editClientError" class="error-message hidden"></div>

            <div class="clients-dialog-actions">
                <button id="editClientCancel" class="btn-logout clients-dialog-cancel" type="button" data-i18n="common.cancel"></button>
                <button id="editClientSubmit" class="btn-new clients-dialog-submit" type="submit">
                    <span class="btn-text" data-i18n="page.clients.edit.submit"></span>
                    <span class="btn-loader hidden" data-i18n="page.clients.edit.submitting"></span>
                </button>
            </div>
        </form>
    </section>

    <div id="toast" class="toast"></div>

    <script type="module" src="js/bundles/clients.bundle.js?v=20260319-2"></script>
    <script src="js/locale-switcher.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.natalFull.title"></title>
    <link rel="stylesheet" href="bundles/natal-full.bundle.css?v=20260425-201708">
    <link rel="stylesheet" href="css/locale-switcher.css?v=20260425-201708">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '20260425-201708';</script>
</head>
<body class="natal-full-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="page.natalFull.loading"></div>
    </div>

    <header class="natal-header">
        <div class="header-content">
            <a href="/" class="back-btn" data-i18n="common.back"></a>
            <div class="birth-info">
                <h1 id="chartTitle" data-i18n="page.natalFull.header.defaultTitle"></h1>
                <p id="birthDetails" class="birth-details"></p>
            </div>
            <div class="header-actions">
                <a href="chart.html" class="view-chart-btn">
                    <svg class="header-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <circle cx="7" cy="7" r="6"></circle>
                        <circle cx="7" cy="7" r="3"></circle>
                        <line x1="7" y1="1" x2="7" y2="2.5"></line>
                        <line x1="7" y1="11.5" x2="7" y2="13"></line>
                        <line x1="1" y1="7" x2="2.5" y2="7"></line>
                        <line x1="11.5" y1="7" x2="13" y2="7"></line>
                    </svg>
                    <span data-i18n="page.natalFull.nav.wheel"></span>
                </a>
                <a href="account-settings.html" class="view-chart-btn" data-i18n-title="page.accountSettings.title" data-i18n-aria-label="page.accountSettings.title">
                    <svg class="header-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                        <line x1="3" y1="3" x2="11" y2="3"></line>
                        <circle cx="5" cy="3" r="1.2" fill="currentColor" stroke="none"></circle>
                        <line x1="3" y1="7" x2="11" y2="7"></line>
                        <circle cx="9" cy="7" r="1.2" fill="currentColor" stroke="none"></circle>
                        <line x1="3" y1="11" x2="11" y2="11"></line>
                        <circle cx="6.5" cy="11" r="1.2" fill="currentColor" stroke="none"></circle>
                    </svg>
                    <span data-i18n="page.accountSettings.title"></span>
                </a>
                <a href="forecast-new.html" class="view-chart-btn">
                    <svg class="header-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <circle cx="7" cy="7" r="6"></circle>
                        <circle cx="7" cy="7" r="3"></circle>
                        <line x1="7" y1="1" x2="7" y2="2.5"></line>
                        <line x1="7" y1="11.5" x2="7" y2="13"></line>
                        <line x1="1" y1="7" x2="2.5" y2="7"></line>
                        <line x1="11.5" y1="7" x2="13" y2="7"></line>
                    </svg>
                    <span data-i18n="page.chart.nav.forecast"></span>
                </a>
                <button class="legend-toggle-btn" id="legendToggle">
                    <svg class="header-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <rect x="1" y="1" width="12" height="12" rx="1"></rect>
                        <line x1="4.5" y1="4.5" x2="11" y2="4.5"></line>
                        <line x1="4.5" y1="7" x2="11" y2="7"></line>
                        <line x1="4.5" y1="9.5" x2="11" y2="9.5"></line>
                        <circle cx="3" cy="4.5" r="0.75" fill="currentColor" stroke="none"></circle>
                        <circle cx="3" cy="7" r="0.75" fill="currentColor" stroke="none"></circle>
                        <circle cx="3" cy="9.5" r="0.75" fill="currentColor" stroke="none"></circle>
                    </svg>
                    <span data-i18n="page.natalFull.nav.legend"></span>
                </button>
            </div>
        </div>
    </header>

    <div class="summary-bar" id="summaryBar">
        <div class="summary-content">
            <div class="summary-item">
                <span class="summary-label">ASC</span>
                <span class="summary-value" id="summaryAsc"></span>
            </div>
            <div class="summary-item">
                <span class="summary-label">MC</span>
                <span class="summary-value" id="summaryMc"></span>
            </div>
            <div class="summary-item">
                <span class="summary-label summary-label-glyph">☉</span>
                <span class="summary-value" id="summarySun"></span>
            </div>
            <div class="summary-item">
                <span class="summary-label summary-label-glyph">☽</span>
                <span class="summary-value" id="summaryMoon"></span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-item">
                <span class="summary-label" data-i18n="page.natalFull.summary.figure"></span>
                <span class="summary-value" id="summaryPattern"></span>
            </div>
            <div class="summary-item dominants" id="summaryDominants"></div>
        </div>
    </div>

    <section class="report-intro" id="reportIntro">
        <div class="report-intro-copy">
            <p class="report-kicker" data-i18n="page.natalFull.report.kicker"></p>
            <h2 class="report-title" data-i18n="page.natalFull.report.title"></h2>
            <p class="report-subtitle" data-i18n="page.natalFull.report.subtitle"></p>
        </div>
        <div class="report-glance-grid">
            <article class="report-glance-card">
                <span class="report-glance-label" data-i18n="page.natalFull.report.cards.axis"></span>
                <strong class="report-glance-value" id="reportAxisValue"></strong>
            </article>
            <article class="report-glance-card">
                <span class="report-glance-label" data-i18n="page.natalFull.report.cards.luminaries"></span>
                <strong class="report-glance-value" id="reportLuminariesValue"></strong>
            </article>
            <article class="report-glance-card">
                <span class="report-glance-label" data-i18n="page.natalFull.summary.figure"></span>
                <strong class="report-glance-value" id="reportPatternValue"></strong>
            </article>
            <article class="report-glance-card">
                <span class="report-glance-label" data-i18n="page.natalFull.report.cards.dominants"></span>
                <strong class="report-glance-value" id="reportDominantsValue"></strong>
            </article>
        </div>
        <div class="report-shortcuts">
            <a href="#balancesSection" class="report-shortcut" data-i18n="page.natalFull.sections.balances"></a>
            <a href="#configurationsSection" class="report-shortcut" data-i18n="page.natalFull.sections.configurations"></a>
            <a href="#aspectsSection" class="report-shortcut" data-i18n="page.natalFull.sections.aspects"></a>
            <a href="#planetsSection" class="report-shortcut" data-i18n="page.natalFull.sections.planets"></a>
            <a href="#housesSection" class="report-shortcut" data-i18n="page.natalFull.sections.houses"></a>
        </div>
    </section>

    <div class="legend-panel hidden" id="legendPanel">
        <div class="legend-content">
            <div class="legend-group">
                <div class="legend-title" data-i18n="page.natalFull.legend.dignity.title"></div>
                <div class="legend-items">
                    <span class="legend-item"><span class="dignity-badge dignity-domicile">H</span> <span data-i18n="page.natalFull.legend.dignity.domicile"></span></span>
                    <span class="legend-item"><span class="dignity-badge dignity-exaltation">X</span> <span data-i18n="page.natalFull.legend.dignity.exaltation"></span></span>
                    <span class="legend-item"><span class="dignity-badge dignity-detriment">D</span> <span data-i18n="page.natalFull.legend.dignity.detriment"></span></span>
                    <span class="legend-item"><span class="dignity-badge dignity-fall">F</span> <span data-i18n="page.natalFull.legend.dignity.fall"></span></span>
                </div>
            </div>
            <div class="legend-group">
                <div class="legend-title" data-i18n="page.natalFull.legend.motion.title"></div>
                <div class="legend-items">
                    <span class="legend-item"><span class="move-badge move-d">D</span> <span data-i18n="page.natalFull.legend.motion.direct"></span></span>
                    <span class="legend-item"><span class="move-badge move-r">R</span> <span data-i18n="page.natalFull.legend.motion.retrograde"></span></span>
                    <span class="legend-item"><span class="move-badge move-s">S</span> <span data-i18n="page.natalFull.legend.motion.stationary"></span></span>
                </div>
            </div>
            <div class="legend-group">
                <div class="legend-title" data-i18n="page.natalFull.legend.harmony.title"></div>
                <div class="legend-items">
                    <span class="legend-item"><span class="harmony-badge harmony-good">✓</span> <span data-i18n="page.natalFull.legend.harmony.good"></span></span>
                    <span class="legend-item"><span class="harmony-badge harmony-bad">✗</span> <span data-i18n="page.natalFull.legend.harmony.bad"></span></span>
                    <span class="legend-item"><span class="harmony-badge harmony-mixed">~</span> <span data-i18n="page.natalFull.legend.harmony.mixed"></span></span>
                </div>
            </div>
            <div class="legend-group">
                <div class="legend-title" data-i18n="page.natalFull.legend.features.title"></div>
                <div class="legend-items legend-text">
                    <span class="legend-item"><b data-i18n="astro.feature.short.combust"></b> <span data-i18n="page.natalFull.legend.features.combust"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.cazimi"></b> <span data-i18n="page.natalFull.legend.features.cazimi"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.under_rays"></b> <span data-i18n="page.natalFull.legend.features.underRays"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.elevated"></b> <span data-i18n="page.natalFull.legend.features.elevated"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.peregrine"></b> <span data-i18n="page.natalFull.legend.features.peregrine"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.intercepted"></b> <span data-i18n="page.natalFull.legend.features.intercepted"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.aspect_king"></b> <span data-i18n="page.natalFull.legend.features.aspectKing"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.almuten"></b> <span data-i18n="page.natalFull.legend.features.almuten"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.handle"></b> <span data-i18n="page.natalFull.legend.features.handle"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.doryphoros"></b> <span data-i18n="page.natalFull.legend.features.doryphoros"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.charioteer"></b> <span data-i18n="page.natalFull.legend.features.charioteer"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.anareta"></b> <span data-i18n="page.natalFull.legend.features.anareta"></span></span>
                    <span class="legend-item"><b data-i18n="astro.feature.short.royal"></b> <span data-i18n="page.natalFull.legend.features.royal"></span></span>
                </div>
            </div>
        </div>
    </div>

    <main class="natal-content">
        <div class="report-priority-grid">
            <details class="section report-section balances-section" id="balancesSection" open>
                <summary class="section-summary">
                    <span class="section-summary-copy">
                        <span class="section-title"><span data-i18n="page.natalFull.sections.balances"></span></span>
                    </span>
                    <span class="section-summary-meta">
                        <span class="section-count" id="balancesCount"></span>
                        <span class="section-summary-chevron" aria-hidden="true">+</span>
                    </span>
                </summary>
                <div class="section-body">
                    <div class="balances-compact" id="balancesContainer"></div>
                </div>
            </details>

            <details class="section report-section" id="configurationsSection" open>
                <summary class="section-summary">
                    <span class="section-summary-copy">
                        <span class="section-title"><span data-i18n="page.natalFull.sections.configurations"></span></span>
                    </span>
                    <span class="section-summary-meta">
                        <span class="section-count" id="configurationsCount"></span>
                        <span class="section-summary-chevron" aria-hidden="true">+</span>
                    </span>
                </summary>
                <div class="section-body">
                    <div class="configs-row" id="configurationsContainer"></div>
                </div>
            </details>
        </div>

        <details class="section report-section" id="aspectsSection" open>
            <summary class="section-summary">
                <span class="section-summary-copy">
                    <span class="section-title"><span data-i18n="page.natalFull.sections.aspects"></span></span>
                </span>
                <span class="section-summary-meta">
                    <span class="section-count" id="aspectsCount"></span>
                    <span class="section-summary-chevron" aria-hidden="true">+</span>
                </span>
            </summary>
            <div class="section-body">
                <div class="table-wrapper">
                    <table class="data-table aspects-table compact-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="type" data-i18n="page.natalFull.table.aspects.typeSort"></th>
                                <th data-i18n="page.natalFull.table.aspects.aspect"></th>
                                <th class="sortable" data-sort="orb" data-i18n="page.natalFull.table.aspects.orbSort"></th>
                            </tr>
                        </thead>
                        <tbody id="aspectsTableBody"></tbody>
                    </table>
                </div>
                <details class="minor-aspects-toggle">
                    <summary data-i18n="page.natalFull.sections.minorAspects"></summary>
                    <div class="table-wrapper">
                        <table class="data-table aspects-table compact-table">
                            <tbody id="minorAspectsTableBody"></tbody>
                        </table>
                    </div>
                </details>
            </div>
        </details>

        <div class="report-data-grid">
            <details class="section report-section" id="planetsSection">
                <summary class="section-summary">
                    <span class="section-summary-copy">
                        <span class="section-title"><span data-i18n="page.natalFull.sections.planets"></span></span>
                    </span>
                    <span class="section-summary-meta">
                        <span class="section-count" id="planetsCount"></span>
                        <span class="section-summary-chevron" aria-hidden="true">+</span>
                    </span>
                </summary>
                <div class="section-body">
                    <div class="table-wrapper">
                        <table class="data-table planets-table compact-table">
                            <thead>
                                <tr>
                                    <th data-i18n="page.natalFull.table.planets.planet"></th>
                                    <th data-i18n="page.natalFull.table.planets.position"></th>
                                    <th data-i18n="page.natalFull.table.planets.house"></th>
                                    <th data-i18n="page.natalFull.table.planets.dignity"></th>
                                    <th data-i18n="page.natalFull.table.planets.aspects"></th>
                                    <th data-i18n="page.natalFull.table.planets.motion"></th>
                                    <th data-i18n="page.natalFull.table.planets.speed"></th>
                                    <th data-i18n="page.natalFull.table.planets.karma"></th>
                                    <th data-i18n="page.natalFull.table.planets.features"></th>
                                    <th data-i18n="page.natalFull.table.planets.ruler"></th>
                                </tr>
                            </thead>
                            <tbody id="planetsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </details>

            <details class="section report-section" id="housesSection">
                <summary class="section-summary">
                    <span class="section-summary-copy">
                        <span class="section-title"><span data-i18n="page.natalFull.sections.houses"></span></span>
                    </span>
                    <span class="section-summary-meta">
                        <span class="section-count" id="housesCount"></span>
                        <span class="section-summary-chevron" aria-hidden="true">+</span>
                    </span>
                </summary>
                <div class="section-body">
                    <div class="table-wrapper">
                        <table class="data-table houses-table compact-table">
                            <thead>
                                <tr>
                                    <th data-i18n="page.natalFull.table.houses.house"></th>
                                    <th data-i18n="page.natalFull.table.houses.sign"></th>
                                    <th data-i18n="page.natalFull.table.houses.ruler"></th>
                                    <th data-i18n="page.natalFull.table.houses.rulerIn"></th>
                                    <th data-i18n="page.natalFull.table.houses.included"></th>
                                    <th data-i18n="page.natalFull.table.houses.planets"></th>
                                </tr>
                            </thead>
                            <tbody id="housesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </details>
        </div>

        <details class="section report-section collapsible-section" id="specialPointsSection">
            <summary class="section-summary">
                <span class="section-summary-copy">
                    <span class="section-title"><span data-i18n="page.natalFull.sections.specialPoints"></span></span>
                </span>
                <span class="section-summary-meta">
                    <span class="section-count" id="specialPointsCount"></span>
                    <span class="section-summary-chevron" aria-hidden="true">+</span>
                </span>
            </summary>
            <div class="section-body">
                <div class="table-wrapper">
                    <table class="data-table special-points-table compact-table">
                        <thead>
                            <tr>
                                <th data-i18n="page.natalFull.table.specialPoints.point"></th>
                                <th data-i18n="page.natalFull.table.specialPoints.position"></th>
                                <th data-i18n="page.natalFull.table.specialPoints.house"></th>
                            </tr>
                        </thead>
                        <tbody id="specialPointsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </details>
    </main>

    <script type="module" src="js/bundles/natal-full.bundle.js?v=20260425-201708"></script>
    <script src="js/locale-switcher.js?v=20260425-201708"></script>
</body>
</html>

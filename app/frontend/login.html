<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.login.meta.title"></title>
    <link rel="stylesheet" href="bundles/login.bundle.css?v=20260501-113732">
    <script>window.__APP_BUILD_ID__ = '20260501-113732';</script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-story" aria-labelledby="loginStoryTitle">
            <div class="login-story-art" aria-hidden="true">
                <div class="orbit orbit-lg"></div>
                <div class="orbit orbit-md"></div>
                <div class="orbit orbit-sm"></div>
                <div class="orbit-dot orbit-dot-top"></div>
                <div class="orbit-dot orbit-dot-right"></div>
                <div class="orbit-dot orbit-dot-bottom"></div>
            </div>

            <div class="login-story-copy">
                <p class="story-eyebrow" data-i18n="page.login.hero.eyebrow"></p>
                <h2 id="loginStoryTitle" class="story-title" data-i18n="page.login.hero.title"></h2>
                <p class="story-subtitle" data-i18n="page.login.hero.subtitle"></p>

                <div class="story-badges" data-i18n-aria-label="page.login.hero.badgesAriaLabel">
                    <span class="story-badge" data-i18n="page.login.hero.badges.private"></span>
                    <span class="story-badge" data-i18n="page.login.hero.badges.premium"></span>
                    <span class="story-badge" data-i18n="page.login.hero.badges.multilingual"></span>
                </div>

                <section class="story-panel">
                    <p class="story-panel-label" data-i18n="page.login.hero.panel.label"></p>
                    <ul class="story-points">
                        <li data-i18n="page.login.hero.panel.point1"></li>
                        <li data-i18n="page.login.hero.panel.point2"></li>
                        <li data-i18n="page.login.hero.panel.point3"></li>
                        <li data-i18n="page.login.hero.panel.point4"></li>
                    </ul>
                </section>

                <p class="story-footnote" data-i18n="page.login.hero.footnote"></p>
            </div>
        </section>

        <section class="login-card" aria-labelledby="authTitle">
            <div class="login-card-frame">
                <div class="login-card-orbit" aria-hidden="true"></div>
                <div class="login-card-glow" aria-hidden="true"></div>
            </div>
            <header class="login-header">
                <p class="login-brand" data-i18n="common.brandName"></p>
                <p class="login-kicker" data-i18n="page.login.hero.cardKicker"></p>
                <h1 id="authTitle" class="login-title"></h1>
                <p id="authSubtitle" class="login-subtitle"></p>
            </header>

            <section class="login-mobile-trust" aria-labelledby="loginMobileTrustTitle">
                <p class="login-mobile-trust-kicker" data-i18n="page.login.hero.eyebrow"></p>
                <h2 id="loginMobileTrustTitle" class="login-mobile-trust-title" data-i18n="page.login.mobileTrust.title"></h2>
                <p class="login-mobile-trust-copy" data-i18n="page.login.mobileTrust.copy"></p>
                <div class="login-mobile-trust-badges" data-i18n-aria-label="page.login.hero.badgesAriaLabel">
                    <span class="login-mobile-trust-badge" data-i18n="page.login.hero.badges.private"></span>
                    <span class="login-mobile-trust-badge" data-i18n="page.login.hero.badges.premium"></span>
                    <span class="login-mobile-trust-badge" data-i18n="page.login.hero.badges.multilingual"></span>
                </div>
            </section>

            <div id="statusBanner" class="status-banner" role="alert" hidden></div>

            <section class="auth-view auth-view--form" data-view="login">
                <form id="passwordLoginForm" novalidate>
                    <div class="field">
                        <label for="email" data-i18n="page.login.fields.email.label"></label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            autocomplete="email"
                            data-i18n-placeholder="page.login.fields.email.placeholder"
                            aria-describedby="loginEmailError"
                        >
                        <p id="loginEmailError" class="field-error" role="alert" hidden></p>
                    </div>

                    <div class="field">
                        <div class="field-label-row">
                            <label for="password" data-i18n="page.login.fields.password.label"></label>
                            <button id="showForgotBtn" class="link-btn" type="button" data-i18n="page.login.actions.forgotPassword"></button>
                        </div>
                        <div class="password-input-wrap">
                            <input
                                id="password"
                                name="password"
                                type="password"
                                required
                                autocomplete="current-password"
                                data-i18n-placeholder="page.login.fields.password.placeholder"
                                aria-describedby="loginPasswordError loginCapsHint"
                            >
                            <button id="toggleLoginPasswordBtn" class="ghost-icon-btn" type="button"></button>
                        </div>
                        <p id="loginPasswordError" class="field-error" role="alert" hidden></p>
                        <p id="loginCapsHint" class="field-hint" data-i18n="page.login.hints.capsLock" hidden></p>
                    </div>

                    <button id="passwordLoginSubmit" class="btn btn-primary" type="submit"></button>
                </form>

                <div class="login-secondary-auth">
                    <div class="login-divider" aria-hidden="true">
                        <span data-i18n="page.login.divider"></span>
                    </div>
                    <button id="googleLoginBtn" class="btn btn-google" type="button"></button>
                </div>

                <div class="switch-auth-cta">
                    <span data-i18n="page.login.actions.noAccount"></span>
                    <button id="showRegisterBtn" class="link-btn" type="button" data-i18n="page.login.actions.goToRegister"></button>
                </div>
            </section>

            <section class="auth-view auth-view--form" data-view="register" hidden>
                <form id="registerForm" novalidate>
                    <div class="field-grid field-grid-2">
                        <div class="field">
                            <label for="registerFirstName" data-i18n="page.login.fields.firstName.label"></label>
                            <input
                                id="registerFirstName"
                                name="registerFirstName"
                                type="text"
                                autocomplete="given-name"
                                data-i18n-placeholder="page.login.fields.firstName.placeholder"
                                aria-describedby="registerFirstNameError"
                            >
                            <p id="registerFirstNameError" class="field-error" role="alert" hidden></p>
                        </div>
                        <div class="field">
                            <label for="registerLastName" data-i18n="page.login.fields.lastName.label"></label>
                            <input
                                id="registerLastName"
                                name="registerLastName"
                                type="text"
                                autocomplete="family-name"
                                data-i18n-placeholder="page.login.fields.lastName.placeholder"
                                aria-describedby="registerLastNameError"
                            >
                            <p id="registerLastNameError" class="field-error" role="alert" hidden></p>
                        </div>
                    </div>

                    <div class="field">
                        <label for="registerEmail" data-i18n="page.login.fields.email.label"></label>
                        <input
                            id="registerEmail"
                            name="registerEmail"
                            type="email"
                            required
                            autocomplete="email"
                            data-i18n-placeholder="page.login.fields.email.placeholder"
                            aria-describedby="registerEmailError"
                        >
                        <p id="registerEmailError" class="field-error" role="alert" hidden></p>
                    </div>

                    <div class="field">
                        <label for="registerPassword" data-i18n="page.login.fields.password.label"></label>
                        <div class="password-input-wrap">
                            <input
                                id="registerPassword"
                                name="registerPassword"
                                type="password"
                                required
                                autocomplete="new-password"
                                data-i18n-placeholder="page.login.fields.registerPassword.placeholder"
                                aria-describedby="registerPasswordError registerCapsHint"
                            >
                            <button id="toggleRegisterPasswordBtn" class="ghost-icon-btn" type="button"></button>
                        </div>
                        <p id="registerPasswordError" class="field-error" role="alert" hidden></p>
                        <p id="registerCapsHint" class="field-hint" data-i18n="page.login.hints.capsLock" hidden></p>
                    </div>

                    <div class="field">
                        <label for="registerPasswordConfirm" data-i18n="page.login.fields.confirmPassword.label"></label>
                        <div class="password-input-wrap">
                            <input
                                id="registerPasswordConfirm"
                                name="registerPasswordConfirm"
                                type="password"
                                required
                                autocomplete="new-password"
                                data-i18n-placeholder="page.login.fields.confirmPassword.placeholder"
                                aria-describedby="registerPasswordConfirmError"
                            >
                            <button id="toggleRegisterPasswordConfirmBtn" class="ghost-icon-btn" type="button"></button>
                        </div>
                        <p id="registerPasswordConfirmError" class="field-error" role="alert" hidden></p>
                    </div>

                    <button id="registerSubmit" class="btn btn-primary" type="submit"></button>
                </form>

                <button class="link-btn auth-back-link" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
            </section>

            <section class="auth-view auth-view--status" data-view="verify-check-email" hidden>
                <p id="verifyCheckEmailBody" class="view-message"></p>
                <div class="delivery-warning" role="note" aria-live="polite">
                    <p class="delivery-warning-title" data-i18n="page.login.hints.emailDeliverySpamTitle"></p>
                    <p class="delivery-warning-text" data-i18n="page.login.hints.emailDeliverySpam"></p>
                </div>
                <div class="stack-actions">
                    <button id="resendVerificationBtn" class="btn btn-secondary" type="button"></button>
                    <button class="link-btn auth-back-link" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
                </div>
            </section>

            <section class="auth-view auth-view--status" data-view="verify-loading" hidden>
                <p class="view-message" data-i18n="page.login.views.verifyLoading.body"></p>
            </section>

            <section class="auth-view auth-view--status" data-view="verify-success" hidden>
                <p class="view-message" data-i18n="page.login.views.verifySuccess.body"></p>
                <button class="btn btn-primary" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
            </section>

            <section class="auth-view auth-view--warning" data-view="verify-invalid" hidden>
                <p id="verifyInvalidBody" class="view-message"></p>
                <form id="verifyResendForm" novalidate>
                    <div class="field">
                        <label for="verifyResendEmail" data-i18n="page.login.fields.email.label"></label>
                        <input
                            id="verifyResendEmail"
                            name="verifyResendEmail"
                            type="email"
                            required
                            autocomplete="email"
                            data-i18n-placeholder="page.login.fields.email.placeholder"
                            aria-describedby="verifyResendEmailError"
                        >
                        <p id="verifyResendEmailError" class="field-error" role="alert" hidden></p>
                    </div>
                    <button id="verifyResendSubmit" class="btn btn-secondary" type="submit"></button>
                </form>
                <div class="stack-actions compact">
                    <button class="link-btn" id="openRegisterFromVerifyBtn" type="button" data-i18n="page.login.actions.goToRegister"></button>
                    <button class="link-btn auth-back-link" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
                </div>
            </section>

            <section class="auth-view auth-view--form" data-view="forgot" hidden>
                <form id="forgotPasswordForm" novalidate>
                    <div class="field">
                        <label for="forgotEmail" data-i18n="page.login.fields.email.label"></label>
                        <input
                            id="forgotEmail"
                            name="forgotEmail"
                            type="email"
                            required
                            autocomplete="email"
                            data-i18n-placeholder="page.login.fields.email.placeholder"
                            aria-describedby="forgotEmailError"
                        >
                        <p id="forgotEmailError" class="field-error" role="alert" hidden></p>
                    </div>

                    <button id="forgotPasswordSubmit" class="btn btn-primary" type="submit"></button>
                </form>

                <button class="link-btn auth-back-link" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
            </section>

            <section class="auth-view auth-view--status" data-view="check-email" hidden>
                <p id="checkEmailBody" class="view-message"></p>
                <div class="delivery-warning" role="note" aria-live="polite">
                    <p class="delivery-warning-title" data-i18n="page.login.hints.emailDeliverySpamTitle"></p>
                    <p class="delivery-warning-text" data-i18n="page.login.hints.emailDeliverySpam"></p>
                </div>
                <div class="stack-actions">
                    <button id="resendResetLinkBtn" class="btn btn-secondary" type="button"></button>
                    <button class="link-btn auth-back-link" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
                </div>
            </section>

            <section class="auth-view auth-view--form" data-view="reset" hidden>
                <form id="resetPasswordForm" novalidate>
                    <div class="field">
                        <label for="resetPassword" data-i18n="page.login.fields.newPassword.label"></label>
                        <div class="password-input-wrap">
                            <input
                                id="resetPassword"
                                name="resetPassword"
                                type="password"
                                required
                                autocomplete="new-password"
                                data-i18n-placeholder="page.login.fields.newPassword.placeholder"
                                aria-describedby="resetPasswordError resetCapsHint"
                            >
                            <button id="toggleResetPasswordBtn" class="ghost-icon-btn" type="button"></button>
                        </div>
                        <p id="resetPasswordError" class="field-error" role="alert" hidden></p>
                        <p id="resetCapsHint" class="field-hint" data-i18n="page.login.hints.capsLock" hidden></p>
                    </div>

                    <div class="field">
                        <label for="resetPasswordConfirm" data-i18n="page.login.fields.confirmPassword.label"></label>
                        <div class="password-input-wrap">
                            <input
                                id="resetPasswordConfirm"
                                name="resetPasswordConfirm"
                                type="password"
                                required
                                autocomplete="new-password"
                                data-i18n-placeholder="page.login.fields.confirmPassword.placeholder"
                                aria-describedby="resetPasswordConfirmError"
                            >
                            <button id="toggleResetPasswordConfirmBtn" class="ghost-icon-btn" type="button"></button>
                        </div>
                        <p id="resetPasswordConfirmError" class="field-error" role="alert" hidden></p>
                    </div>

                    <button id="resetPasswordSubmit" class="btn btn-primary" type="submit"></button>
                </form>

                <button class="link-btn auth-back-link" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
            </section>

            <section class="auth-view auth-view--status" data-view="reset-success" hidden>
                <p class="view-message" data-i18n="page.login.views.success.body"></p>
                <button class="btn btn-primary" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
            </section>

            <section class="auth-view auth-view--warning" data-view="reset-invalid" hidden>
                <p id="resetInvalidBody" class="view-message"></p>
                <div class="stack-actions">
                    <button class="btn btn-secondary" type="button" data-action="open-forgot" data-i18n="page.login.actions.requestNewLink"></button>
                    <button class="link-btn auth-back-link" type="button" data-action="back-login" data-i18n="page.login.actions.backToSignIn"></button>
                </div>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/bundles/login.bundle.js?v=20260501-113732"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.index.title"></title>
    <link rel="stylesheet" href="bundles/index.bundle.css?v=286eabad484e">
    <link rel="stylesheet" href="css/locale-switcher.css?v=286eabad484e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '286eabad484e';</script>
</head>
<body class="index-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="common.loading"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1 class="logo">
                <svg class="logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="14" cy="14" r="12.5" stroke="#1E3A5F" stroke-width="1.25"/>
                    <circle cx="14" cy="14" r="7.5" stroke="#B8935A" stroke-width="0.8" stroke-dasharray="2.5 3"/>
                    <circle cx="14" cy="14" r="2.2" fill="#1E3A5F"/>
                    <circle cx="14" cy="2.2" r="1.3" fill="#B8935A"/>
                    <circle cx="24.1" cy="8" r="1.3" fill="#B8935A" opacity="0.65"/>
                    <circle cx="24.1" cy="20" r="1.3" fill="#B8935A" opacity="0.45"/>
                    <circle cx="14" cy="25.8" r="1.3" fill="#B8935A" opacity="0.8"/>
                    <circle cx="3.9" cy="20" r="1.3" fill="#B8935A" opacity="0.55"/>
                    <circle cx="3.9" cy="8" r="1.3" fill="#B8935A" opacity="0.7"/>
                </svg>
                <span data-i18n="common.brandName"></span>
            </h1>
            <p class="subtitle" data-i18n="page.index.subtitle"></p>
            <div class="index-header-links">
                <a href="account-settings.html" class="index-header-link" data-i18n="page.accountSettings.title"></a>
                <a href="/" class="index-header-link" data-i18n="page.chart.nav.home"></a>
            </div>
        </header>

        <main class="form-container">
            <form id="birthDataForm" class="birth-form">
                <section class="form-section" aria-labelledby="identitySectionTitle">
                    <div class="form-section-heading">
                        <h2 id="identitySectionTitle" class="form-section-title" data-i18n="page.index.form.sections.identity.title"></h2>
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-i18n="page.index.form.fullName.label"></label>
                        <div class="name-inputs">
                            <input type="text" id="firstName" data-i18n-placeholder="page.index.form.fullName.firstNamePlaceholder" required>
                            <input type="text" id="lastName" data-i18n-placeholder="page.index.form.fullName.lastNamePlaceholder" required>
                        </div>
                    </div>
                </section>

                <section class="form-section" aria-labelledby="birthSectionTitle">
                    <div class="form-section-heading">
                        <h2 id="birthSectionTitle" class="form-section-title" data-i18n="page.index.form.sections.birth.title"></h2>
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-i18n="page.index.form.birthDate.label"></label>
                        <div class="date-inputs">
                            <input type="number" id="birthDay" min="1" max="31" data-i18n-placeholder="page.index.form.birthDate.dayPlaceholder" required>
                            <select id="birthMonth" required>
                                <option value="" data-i18n="page.index.form.birthDate.monthPlaceholder"></option>
                                <option value="01" data-i18n="common.month.long.january"></option>
                                <option value="02" data-i18n="common.month.long.february"></option>
                                <option value="03" data-i18n="common.month.long.march"></option>
                                <option value="04" data-i18n="common.month.long.april"></option>
                                <option value="05" data-i18n="common.month.long.may"></option>
                                <option value="06" data-i18n="common.month.long.june"></option>
                                <option value="07" data-i18n="common.month.long.july"></option>
                                <option value="08" data-i18n="common.month.long.august"></option>
                                <option value="09" data-i18n="common.month.long.september"></option>
                                <option value="10" data-i18n="common.month.long.october"></option>
                                <option value="11" data-i18n="common.month.long.november"></option>
                                <option value="12" data-i18n="common.month.long.december"></option>
                            </select>
                            <input type="number" id="birthYear" min="1900" max="2100" data-i18n-placeholder="page.index.form.birthDate.yearPlaceholder" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-i18n="page.index.form.birthTime.label"></label>
                        <div class="time-inputs">
                            <input type="number" id="birthHour" min="0" max="23" data-i18n-placeholder="page.index.form.birthTime.hoursPlaceholder" required>
                            <span class="time-separator">:</span>
                            <input type="number" id="birthMinute" min="0" max="59" data-i18n-placeholder="page.index.form.birthTime.minutesPlaceholder" required>
                        </div>
                    </div>
                </section>

                <section class="form-section" aria-labelledby="locationSectionTitle">
                    <div class="form-section-heading">
                        <h2 id="locationSectionTitle" class="form-section-title" data-i18n="page.index.form.sections.location.title"></h2>
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-i18n="page.index.form.birthPlace.label"></label>
                        <div class="place-autocomplete-wrapper">
                            <input type="text" id="birthPlace" class="place-input" data-i18n-placeholder="page.index.form.birthPlace.placeholder" required autocomplete="off">
                            <div id="birthPlaceSuggestions" class="place-suggestions"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-i18n="page.index.form.timezone.label"></label>
                        <select id="timezone" required>
                            <option value="" data-i18n="page.index.form.timezone.placeholder"></option>
                        </select>
                        <span id="timezoneHint" class="hint"></span>
                    </div>
                </section>

                <details class="advanced-fields" id="advancedFields">
                    <summary class="advanced-fields-summary">
                        <span class="advanced-fields-summary-copy">
                            <span class="advanced-fields-title" data-i18n="page.index.form.advanced.toggle"></span>
                        </span>
                        <span class="advanced-fields-chevron" aria-hidden="true">+</span>
                    </summary>

                    <div class="advanced-fields-content">
                        <div id="coordsContainer" class="coords-display">
                            <div class="coords-row">
                                <label class="coords-label" data-i18n="page.index.form.coordinates.label"></label>
                                <div class="coords-inputs">
                                    <div class="coord-input-group">
                                        <input type="text" id="latDeg" class="coord-num" placeholder="48" maxlength="3">°
                                        <input type="text" id="latMin" class="coord-num" placeholder="52" maxlength="2">'
                                        <input type="text" id="latSec" class="coord-num coord-sec" placeholder="00.00" maxlength="5">"
                                        <select id="latDir" class="coord-dir">
                                            <option value="N" data-i18n="common.direction.northShort"></option>
                                            <option value="S" data-i18n="common.direction.southShort"></option>
                                        </select>
                                    </div>
                                    <div class="coord-input-group">
                                        <input type="text" id="lonDeg" class="coord-num" placeholder="2" maxlength="3">°
                                        <input type="text" id="lonMin" class="coord-num" placeholder="20" maxlength="2">'
                                        <input type="text" id="lonSec" class="coord-num coord-sec" placeholder="00.00" maxlength="5">"
                                        <select id="lonDir" class="coord-dir">
                                            <option value="E" data-i18n="common.direction.eastShort"></option>
                                            <option value="W" data-i18n="common.direction.westShort"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <span class="hint" id="coordsHint" data-i18n="page.index.form.coordinates.hint"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label" data-i18n="page.index.form.houseSystem.label"></label>
                            <select id="houseSystem">
                                <option value="P" selected data-i18n="astro.houseSystem.placidus"></option>
                                <option value="K" data-i18n="astro.houseSystem.koch"></option>
                                <option value="W" data-i18n="astro.houseSystem.wholeSign"></option>
                                <option value="E" data-i18n="astro.houseSystem.equal"></option>
                                <option value="R" data-i18n="astro.houseSystem.regiomontanus"></option>
                                <option value="C" data-i18n="astro.houseSystem.campanus"></option>
                            </select>
                        </div>
                    </div>
                </details>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text"><span data-i18n="page.index.form.submit.idle"></span></span>
                    <span class="btn-loader hidden" data-i18n="page.index.form.submit.loading"></span>
                </button>

                <div id="errorMessage" class="error-message hidden"></div>
            </form>
        </main>

        <footer class="footer">
            <p data-i18n="common.footer"></p>
        </footer>
    </div>

    <script type="module" src="js/bundles/index.bundle.js?v=286eabad484e"></script>
    <script src="js/locale-switcher.js?v=286eabad484e"></script>
</body>
</html>

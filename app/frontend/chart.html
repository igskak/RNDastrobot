<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.chart.title"></title>
    <link rel="stylesheet" href="bundles/chart.bundle.css?v=20260501-121207">
    <link rel="stylesheet" href="css/locale-switcher.css?v=20260501-121207">
    <script>window.__APP_BUILD_ID__ = '20260501-121207';</script>
</head>
<body class="chart-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="page.chart.loading"></div>
    </div>

    <header class="chart-header-compact">
        <a href="/" class="back-btn-compact" data-i18n-aria-label="common.back" data-i18n-title="common.back">←</a>
        <div class="birth-info-compact">
            <h2 id="birthDate"></h2>
            <p id="birthPlace"></p>
        </div>
        <div class="header-nav-buttons">
            <a href="/" class="header-nav-btn"><span data-i18n="page.chart.nav.home"></span></a>
            <button type="button" class="header-nav-btn" id="openSynastryNavBtn">
                <svg class="nav-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <circle cx="4.5" cy="7" r="2.5"/><circle cx="9.5" cy="7" r="2.5"/><path d="M6.8 7h.4"/>
                </svg>
                <span data-i18n="page.chart.nav.synastry"></span>
            </button>
            <a href="natal-full.html" class="header-nav-btn"><svg class="nav-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="1"/><line x1="1" y1="5" x2="13" y2="5"/><line x1="1" y1="9" x2="13" y2="9"/></svg><span data-i18n="page.chart.nav.tables"></span></a>
            <a href="forecast-new.html" class="header-nav-btn"><svg class="nav-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="6"/><circle cx="7" cy="7" r="3"/><line x1="7" y1="1" x2="7" y2="2.5"/><line x1="7" y1="11.5" x2="7" y2="13"/><line x1="1" y1="7" x2="2.5" y2="7"/><line x1="11.5" y1="7" x2="13" y2="7"/></svg><span data-i18n="page.chart.nav.forecast"></span></a>
            <div class="header-action-menu">
                <button type="button" class="header-nav-btn header-nav-btn--icon" id="chartActionsToggle" aria-haspopup="true" aria-expanded="false" data-i18n-aria-label="page.chart.actions.openMenu">
                    <svg class="nav-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                        <circle cx="7" cy="2.5" r="1"/>
                        <circle cx="7" cy="7" r="1"/>
                        <circle cx="7" cy="11.5" r="1"/>
                    </svg>
                    <span data-i18n="page.chart.actions.label"></span>
                </button>
                <div class="chart-actions-menu hidden" id="chartActionsMenu" role="menu">
                    <button type="button" class="chart-action-item" id="editClientAction" role="menuitem" data-i18n="page.chart.actions.editClient"></button>
                    <button type="button" class="chart-action-item hidden" id="openSynastryAction" role="menuitem" data-i18n="page.chart.actions.openSynastry"></button>
                    <a href="account-settings.html" class="chart-action-item chart-action-item--link" role="menuitem" data-i18n="page.accountSettings.title"></a>
                    <button type="button" class="chart-action-item" id="saveNatalDefaultsAction" role="menuitem" data-i18n="page.chart.actions.saveDefaults"></button>
                    <button type="button" class="chart-action-item" id="resetDefaultsAction" role="menuitem" data-i18n="page.chart.actions.resetDefaults"></button>
                </div>
            </div>
        </div>
    </header>

    <div class="chart-layout">
        <aside class="side-panel left-panel" id="view-planets">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel-tab="planets-list" data-i18n="page.chart.tabs.planets"></button>
                <button class="panel-tab" data-panel-tab="aspects-list" data-i18n="page.chart.tabs.aspects"></button>
                <button class="panel-tab" data-panel-tab="grid-list" data-i18n="page.chart.tabs.grid"></button>
            </div>
            <div class="panel-content">
                <div id="planets-list" class="panel-tab-content active">
                    <table class="data-table compact">
                        <thead>
                            <tr>
                                <th data-i18n="page.chart.table.planets.symbol"></th>
                                <th data-i18n="page.chart.table.planets.position"></th>
                                <th class="planet-speed-col" data-i18n="page.chart.table.planets.speed"></th>
                                <th data-i18n="page.chart.table.planets.house"></th>
                            </tr>
                        </thead>
                        <tbody id="planetsTable"></tbody>
                    </table>
                </div>
                <div id="aspects-list" class="panel-tab-content">
                    <table class="data-table compact">
                        <thead>
                            <tr>
                                <th colspan="2" class="sortable" data-sort="planet" data-i18n="page.chart.table.aspects.aspect"></th>
                                <th class="sortable" data-sort="type" data-i18n="page.chart.table.aspects.type"></th>
                                <th class="sortable" data-sort="orb" data-i18n="page.chart.table.aspects.orb"></th>
                            </tr>
                        </thead>
                        <tbody id="aspectsTable"></tbody>
                    </table>
                </div>
                <div id="grid-list" class="panel-tab-content">
                    <h4 class="subsection-title" data-i18n="page.chart.grid.title"></h4>
                    <div id="aspectGridContainer"></div>
                </div>
            </div>
        </aside>

        <main class="chart-center" id="view-chart">
            <div class="chart-wheel-wrapper" id="chartWheelWrapper">
                <svg id="chartWheel" viewBox="-30 -30 560 560" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <div class="zoom-controls-float">
                <button class="zoom-btn" id="zoomIn" data-i18n-title="common.zoomIn">+</button>
                <button class="zoom-btn" id="zoomOut" data-i18n-title="common.zoomOut">−</button>
                <button class="zoom-btn" id="zoomReset" data-i18n-title="common.resetView">⟲</button>
                <button class="zoom-btn" id="settingsToggle" data-i18n-title="common.settings">⚙</button>
            </div>

            <div id="tooltip" class="chart-tooltip"></div>

            <div id="settingsPanel" class="settings-panel hidden">
                <h4 data-i18n="common.displaySettings"></h4>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.orientation.label"></label>
                    <select id="orientationSelect" class="settings-select">
                        <option value="aries" selected data-i18n="page.chart.settings.orientation.aries"></option>
                        <option value="asc" data-i18n="page.chart.settings.orientation.asc"></option>
                    </select>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.houseSystem.label"></label>
                    <select id="houseSystemSelect" class="settings-select">
                        <option value="P" selected data-i18n="astro.houseSystem.placidus"></option>
                        <option value="K" data-i18n="astro.houseSystem.koch"></option>
                        <option value="W" data-i18n="astro.houseSystem.wholeSign"></option>
                        <option value="E" data-i18n="astro.houseSystem.equal"></option>
                        <option value="C" data-i18n="astro.houseSystem.campanus"></option>
                        <option value="R" data-i18n="astro.houseSystem.regiomontanus"></option>
                    </select>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.iconSize"></label>
                    <div class="settings-size-control">
                        <input type="range" id="iconScaleRange" min="80" max="170" step="5" value="120">
                        <span id="iconScaleValue">120%</span>
                    </div>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.aspectScope.label"></label>
                    <select id="aspectScopeSelect" class="settings-select">
                        <option value="all" data-i18n="common.all"></option>
                        <option value="major" data-i18n="common.major"></option>
                        <option value="minor" data-i18n="common.minor"></option>
                    </select>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.planetsAndPoints"></label>
                    <div class="natal-matrix-editor" id="natalMatrixEditor"></div>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.accountSettings.fields.aspectTypes"></label>
                    <div class="settings-check-grid settings-check-grid--compact" id="aspectTypeToggles"></div>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.aspectOptions"></label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="aspectPhaseApplyingToggle">
                            <span data-i18n="page.chart.settings.aspectPhase.applying"></span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="aspectPhaseSeparatingToggle">
                            <span data-i18n="page.chart.settings.aspectPhase.separating"></span>
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.houseLabels.label"></label>
                    <select id="houseNumberStyleSelect" class="settings-select">
                        <option value="arabic" data-i18n="page.chart.settings.houseLabels.arabic"></option>
                        <option value="roman" data-i18n="page.chart.settings.houseLabels.roman"></option>
                    </select>
                    <label class="settings-check-option">
                        <input type="checkbox" id="houseLabelsOutsideToggle">
                        <span data-i18n="page.chart.settings.houseLabels.outside"></span>
                    </label>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.wheelOptions"></label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="showWheelStationaryToggle">
                            <span data-i18n="page.chart.settings.showPlanetStationary"></span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="showWheelDegreeToggle">
                            <span data-i18n="page.chart.settings.showPlanetDegree"></span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="angleAscDscBoldToggle" checked>
                            <span data-i18n="page.chart.settings.boldAscDsc"></span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="angleMcIcBoldToggle" checked>
                            <span data-i18n="page.chart.settings.boldMcIc"></span>
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.tableOptions"></label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="showSpeedToggle">
                            <span data-i18n="page.accountSettings.options.showSpeed"></span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="showStationaryToggle">
                            <span data-i18n="page.accountSettings.options.showStationary"></span>
                        </label>
                    </div>
                </div>
            </div>
        </main>

        <aside class="side-panel right-panel" id="view-houses">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel-tab="houses-list" data-i18n="page.chart.tabs.houses"></button>
                <button class="panel-tab" data-panel-tab="configs-list" data-i18n="page.chart.tabs.configurations"></button>
                <button class="panel-tab" data-panel-tab="balances-list" data-i18n="page.chart.tabs.balances"></button>
            </div>
            <div class="panel-content">
                <div id="houses-list" class="panel-tab-content active">
                    <table class="data-table compact">
                        <thead>
                            <tr>
                                <th data-i18n="page.chart.table.houses.cusp"></th>
                                <th data-i18n="page.chart.table.houses.sign"></th>
                                <th data-i18n="page.chart.table.houses.ruler"></th>
                            </tr>
                        </thead>
                        <tbody id="housesTable"></tbody>
                    </table>

                    <div id="dignitiesContainer" class="dignities-section"></div>
                </div>
                <div id="configs-list" class="panel-tab-content">
                    <div id="configurationsContainer"></div>
                </div>
                <div id="balances-list" class="panel-tab-content">
                    <div id="balancesContainer"></div>
                </div>
            </div>
        </aside>
    </div>

    <nav class="mobile-nav">
        <button class="mobile-tab" data-view="planets">
            <span class="mobile-tab-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M4 5.5h12"/>
                    <path d="M4 10h12"/>
                    <path d="M4 14.5h12"/>
                </svg>
            </span>
            <span data-i18n="page.chart.tabs.planets"></span>
        </button>
        <button class="mobile-tab active" data-view="chart">
            <span class="mobile-tab-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
                    <circle cx="10" cy="10" r="6.5"/>
                    <circle cx="10" cy="10" r="2.6"/>
                </svg>
            </span>
            <span data-i18n="page.chart.mobile.chart"></span>
        </button>
        <button class="mobile-tab" data-view="houses">
            <span class="mobile-tab-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
                    <rect x="3.5" y="3.5" width="13" height="13" rx="1.8"/>
                    <path d="M10 3.5v13"/>
                    <path d="M3.5 10h13"/>
                </svg>
            </span>
            <span data-i18n="page.chart.tabs.houses"></span>
        </button>
    </nav>

    <div class="chart-dialog-backdrop hidden" id="synastryLauncherBackdrop"></div>
    <section class="chart-dialog hidden" id="synastryLauncherDialog" role="dialog" aria-modal="true" aria-labelledby="synastryLauncherTitle">
        <div class="chart-dialog-card chart-dialog-card--compact">
            <div class="chart-dialog-header">
                <div>
                    <p class="chart-dialog-kicker" data-i18n="page.chart.synastry.kicker"></p>
                    <h3 id="synastryLauncherTitle" class="chart-dialog-title chart-dialog-title--compact" data-i18n="page.chart.synastry.title"></h3>
                    <p class="chart-dialog-copy" data-i18n="page.chart.synastry.subtitle"></p>
                </div>
                <button type="button" class="chart-dialog-close" id="synastryLauncherClose" data-i18n-aria-label="common.close">×</button>
            </div>

            <div id="synastryLauncherError" class="error-message hidden"></div>
            <div class="related-person-list" id="synastryLauncherList"></div>
            <p id="synastryLauncherEmpty" class="chart-dialog-empty hidden" data-i18n="page.chart.synastry.empty"></p>

            <div class="chart-dialog-actions chart-dialog-actions--split">
                <button type="button" class="header-nav-btn" id="synastryLauncherCancel" data-i18n="common.cancel"></button>
                <div class="chart-dialog-inline-actions">
                    <button type="button" class="header-nav-btn" id="synastryLauncherLinkExisting" data-i18n="page.clientProfile.related.linkExisting"></button>
                    <button type="button" class="submit-btn chart-dialog-submit" id="synastryLauncherCreateRelated" data-i18n="page.clientProfile.related.add"></button>
                </div>
            </div>
        </div>
    </section>

    <div class="chart-dialog-backdrop hidden" id="chartRelatedPickerBackdrop"></div>
    <section class="chart-dialog hidden" id="chartRelatedPickerDialog" role="dialog" aria-modal="true" aria-labelledby="chartRelatedPickerTitle">
        <div class="chart-dialog-card chart-dialog-card--compact related-picker-card">
            <div class="chart-dialog-header">
                <div>
                    <p class="chart-dialog-kicker" data-i18n="page.clientProfile.related.linkKicker"></p>
                    <h3 id="chartRelatedPickerTitle" class="chart-dialog-title chart-dialog-title--compact" data-i18n="page.clientProfile.related.linkTitle"></h3>
                    <p class="chart-dialog-copy" data-i18n="page.clientProfile.related.linkSubtitle"></p>
                </div>
                <button type="button" class="chart-dialog-close" id="chartRelatedPickerClose" data-i18n-aria-label="common.close">×</button>
            </div>

            <div class="form-group">
                <label class="form-label" for="chartRelatedPickerSearch" data-i18n="page.clientProfile.related.searchLabel"></label>
                <input id="chartRelatedPickerSearch" type="search" data-i18n-placeholder="page.clientProfile.related.searchPlaceholder">
            </div>

            <div class="form-group">
                <label class="form-label" for="chartRelatedPickerRelationLabel" data-i18n="page.clientProfile.related.relationLabel"></label>
                <input id="chartRelatedPickerRelationLabel" type="text" data-i18n-placeholder="page.clientProfile.related.relationPlaceholder">
            </div>

            <div id="chartRelatedPickerError" class="error-message hidden"></div>
            <div class="related-picker-list" id="chartRelatedPickerList"></div>
            <p id="chartRelatedPickerEmpty" class="chart-dialog-empty hidden" data-i18n="page.clientProfile.related.noCandidates"></p>

            <div class="chart-dialog-actions">
                <button type="button" class="header-nav-btn" id="chartRelatedPickerCancel" data-i18n="common.cancel"></button>
                <button type="button" class="submit-btn chart-dialog-submit" id="chartRelatedPickerSubmit">
                    <span class="btn-text" data-i18n="page.clientProfile.related.linkSubmit"></span>
                    <span class="btn-loader hidden" data-i18n="common.loading"></span>
                </button>
            </div>
        </div>
    </section>

    <div class="chart-dialog-backdrop hidden" id="editClientBackdrop"></div>
    <section class="chart-dialog hidden" id="editClientDialog" role="dialog" aria-modal="true" aria-labelledby="editClientTitle">
        <form class="chart-dialog-card" id="editClientForm">
            <div class="chart-dialog-header">
                <div>
                    <p class="chart-dialog-kicker" id="editClientKicker" data-i18n="page.chart.edit.kicker"></p>
                    <h3 id="editClientTitle" class="chart-dialog-title" data-i18n="page.chart.edit.title"></h3>
                    <p class="chart-dialog-copy" id="editClientCopy" data-i18n="page.chart.edit.subtitle"></p>
                </div>
                <button type="button" class="chart-dialog-close" id="editClientClose" data-i18n-aria-label="common.close">×</button>
            </div>

            <div class="chart-dialog-grid">
                <div class="form-group">
                    <label class="form-label" for="editFirstName" data-i18n="page.index.form.fullName.label"></label>
                    <div class="name-inputs">
                        <input type="text" id="editFirstName" data-i18n-placeholder="page.index.form.fullName.firstNamePlaceholder" required>
                        <input type="text" id="editLastName" data-i18n-placeholder="page.index.form.fullName.lastNamePlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthDate.label"></label>
                    <div class="date-inputs">
                        <input type="number" id="editBirthDay" min="1" max="31" data-i18n-placeholder="page.index.form.birthDate.dayPlaceholder" required>
                        <select id="editBirthMonth" required>
                            <option value="" data-i18n="page.index.form.birthDate.monthPlaceholder"></option>
                            <option value="01" data-i18n="common.month.long.january"></option>
                            <option value="02" data-i18n="common.month.long.february"></option>
                            <option value="03" data-i18n="common.month.long.march"></option>
                            <option value="04" data-i18n="common.month.long.april"></option>
                            <option value="05" data-i18n="common.month.long.may"></option>
                            <option value="06" data-i18n="common.month.long.june"></option>
                            <option value="07" data-i18n="common.month.long.july"></option>
                            <option value="08" data-i18n="common.month.long.august"></option>
                            <option value="09" data-i18n="common.month.long.september"></option>
                            <option value="10" data-i18n="common.month.long.october"></option>
                            <option value="11" data-i18n="common.month.long.november"></option>
                            <option value="12" data-i18n="common.month.long.december"></option>
                        </select>
                        <input type="number" id="editBirthYear" min="1800" max="2100" data-i18n-placeholder="page.index.form.birthDate.yearPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="page.index.form.birthTime.label"></label>
                    <div class="time-inputs">
                        <input type="number" id="editBirthHour" min="0" max="23" data-i18n-placeholder="page.index.form.birthTime.hoursPlaceholder" required>
                        <span class="time-separator">:</span>
                        <input type="number" id="editBirthMinute" min="0" max="59" data-i18n-placeholder="page.index.form.birthTime.minutesPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editBirthPlace" data-i18n="page.index.form.birthPlace.label"></label>
                    <div class="place-autocomplete-wrapper">
                        <input type="text" id="editBirthPlace" class="place-input" data-i18n-placeholder="page.index.form.birthPlace.placeholder" autocomplete="off" required>
                        <div id="editBirthPlaceSuggestions" class="place-suggestions"></div>
                    </div>
                    <span class="hint" id="editPlaceHint" data-i18n="page.chart.edit.placeHint"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="editTimezone" data-i18n="page.index.form.timezone.label"></label>
                    <select id="editTimezone" required>
                        <option value="" data-i18n="page.index.form.timezone.placeholder"></option>
                    </select>
                    <span class="hint" id="editTimezoneHint"></span>
                </div>

                <div class="form-group hidden" id="editRelationGroup">
                    <label class="form-label" for="editRelationLabel" data-i18n="page.clientProfile.related.relationLabel"></label>
                    <input type="text" id="editRelationLabel" data-i18n-placeholder="page.clientProfile.related.relationPlaceholder">
                </div>
            </div>

            <div id="editClientError" class="error-message hidden"></div>

            <div class="chart-dialog-actions">
                <button type="button" class="header-nav-btn" id="editClientCancel" data-i18n="common.cancel"></button>
                <button type="submit" class="submit-btn chart-dialog-submit" id="editClientSubmit">
                    <span class="btn-text" data-i18n="page.chart.edit.submit"></span>
                    <span class="btn-loader hidden" data-i18n="page.chart.edit.submitting"></span>
                </button>
            </div>
        </form>
    </section>

    <div id="chartToast" class="toast"></div>

    <script type="module" src="js/bundles/chart.bundle.js?v=20260501-121207"></script>
    <script src="js/locale-switcher.js?v=20260501-121207"></script>
</body>
</html>

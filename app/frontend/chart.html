<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page.chart.title"></title>
    <link rel="stylesheet" href="bundles/chart.bundle.css?v=1">
    <link rel="stylesheet" href="css/locale-switcher.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>window.__APP_BUILD_ID__ = '2026-02-19-1';</script>
</head>
<body class="chart-page">
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="page.chart.loading"></div>
    </div>

    <header class="chart-header-compact">
        <a href="/" class="back-btn-compact" data-i18n-aria-label="common.back" data-i18n-title="common.back">←</a>
        <div class="birth-info-compact">
            <h2 id="birthDate" data-i18n="page.chart.header.defaultTitle"></h2>
            <p id="birthPlace"></p>
        </div>
        <div class="header-nav-buttons">
            <a href="natal-full.html" class="header-nav-btn">📊 <span data-i18n="page.chart.nav.tables"></span></a>
            <a href="forecast.html" class="header-nav-btn">🔮 <span data-i18n="page.chart.nav.forecast"></span></a>
        </div>
    </header>

    <div class="chart-layout">
        <aside class="side-panel left-panel" id="view-planets">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel-tab="planets-list" data-i18n="page.chart.tabs.planets"></button>
                <button class="panel-tab" data-panel-tab="aspects-list" data-i18n="page.chart.tabs.aspects"></button>
                <button class="panel-tab" data-panel-tab="grid-list" data-i18n="page.chart.tabs.grid"></button>
            </div>
            <div class="panel-content">
                <div id="planets-list" class="panel-tab-content active">
                    <table class="data-table compact">
                        <thead>
                            <tr>
                                <th data-i18n="page.chart.table.planets.symbol"></th>
                                <th data-i18n="page.chart.table.planets.position"></th>
                                <th data-i18n="page.chart.table.planets.house"></th>
                            </tr>
                        </thead>
                        <tbody id="planetsTable"></tbody>
                    </table>
                </div>
                <div id="aspects-list" class="panel-tab-content">
                    <div class="aspects-header">
                        <button class="aspects-settings-btn" id="aspectsSettingsBtn" data-i18n-title="page.chart.aspects.settings.title">⚙</button>
                    </div>
                    <div class="aspects-settings-panel hidden" id="aspectsSettingsPanel">
                        <div class="aspects-settings-title" data-i18n="page.chart.aspects.settings.showWith"></div>
                        <div class="aspects-filter-buttons">
                            <button class="aspects-filter-btn" id="aspectsResetBtn" data-i18n="common.reset"></button>
                            <button class="aspects-filter-btn" id="aspectsMajorBtn" data-i18n="common.major"></button>
                            <button class="aspects-filter-btn" id="aspectsMinorBtn" data-i18n="common.minor"></button>
                        </div>
                        <div class="aspects-planet-toggles" id="aspectsPlanetToggles"></div>
                    </div>
                    <table class="data-table compact">
                        <thead>
                            <tr>
                                <th colspan="2" data-i18n="page.chart.table.aspects.aspect"></th>
                                <th data-i18n="page.chart.table.aspects.type"></th>
                                <th data-i18n="page.chart.table.aspects.orb"></th>
                            </tr>
                        </thead>
                        <tbody id="aspectsTable"></tbody>
                    </table>
                </div>
                <div id="grid-list" class="panel-tab-content">
                    <h4 class="subsection-title" data-i18n="page.chart.grid.title"></h4>
                    <div id="aspectGridContainer"></div>
                </div>
            </div>
        </aside>

        <main class="chart-center" id="view-chart">
            <div class="chart-wheel-wrapper" id="chartWheelWrapper">
                <svg id="chartWheel" viewBox="0 0 500 500"></svg>
            </div>
            <div class="zoom-controls-float">
                <button class="zoom-btn" id="zoomIn" data-i18n-title="common.zoomIn">+</button>
                <button class="zoom-btn" id="zoomOut" data-i18n-title="common.zoomOut">−</button>
                <button class="zoom-btn" id="zoomReset" data-i18n-title="common.resetView">⟲</button>
                <button class="zoom-btn" id="settingsToggle" data-i18n-title="common.settings">⚙</button>
            </div>

            <div class="aspect-lines-legend">
                <span class="legend-item clickable active" data-filter="all" id="filterAll">
                    <span class="line-sample solid"></span>
                    <span data-i18n="common.all"></span>
                </span>
                <span class="legend-item clickable" data-filter="major" id="filterMajor">
                    <span class="line-sample solid"></span>
                    <span data-i18n="common.major"></span>
                </span>
                <span class="legend-item clickable" data-filter="minor" id="filterMinor">
                    <span class="line-sample dashed"></span>
                    <span data-i18n="common.minor"></span>
                </span>
                <span class="legend-sep">|</span>
                <span class="legend-color" style="color:#ef4444">● <span data-i18n="page.chart.legend.tense"></span></span>
                <span class="legend-color" style="color:#3b82f6">● <span data-i18n="page.chart.legend.harmonious"></span></span>
                <span class="legend-color" style="color:#f59e0b">● <span data-i18n="page.chart.legend.neutral"></span></span>
            </div>

            <div id="tooltip" class="chart-tooltip"></div>

            <div id="settingsPanel" class="settings-panel hidden">
                <h4 data-i18n="common.displaySettings"></h4>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.orientation.label"></label>
                    <select id="orientationSelect" class="settings-select">
                        <option value="aries" selected data-i18n="page.chart.settings.orientation.aries"></option>
                        <option value="asc" data-i18n="page.chart.settings.orientation.asc"></option>
                    </select>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.houseSystem.label"></label>
                    <select id="houseSystemSelect" class="settings-select">
                        <option value="P" selected data-i18n="astro.houseSystem.placidus"></option>
                        <option value="K" data-i18n="astro.houseSystem.koch"></option>
                        <option value="W" data-i18n="astro.houseSystem.wholeSign"></option>
                        <option value="E" data-i18n="astro.houseSystem.equal"></option>
                        <option value="C" data-i18n="astro.houseSystem.campanus"></option>
                        <option value="R" data-i18n="astro.houseSystem.regiomontanus"></option>
                    </select>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.planetSize"></label>
                    <div class="settings-size-control">
                        <input type="range" id="planetScaleRange" min="80" max="170" step="5" value="120">
                        <span id="planetScaleValue">120%</span>
                    </div>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.pointSize"></label>
                    <div class="settings-size-control">
                        <input type="range" id="pointScaleRange" min="80" max="170" step="5" value="100">
                        <span id="pointScaleValue">100%</span>
                    </div>
                </div>

                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.planetsAndPoints"></label>
                    <div class="planet-toggles" id="planetToggles"></div>
                </div>
            </div>
        </main>

        <aside class="side-panel right-panel" id="view-houses">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel-tab="houses-list" data-i18n="page.chart.tabs.houses"></button>
                <button class="panel-tab" data-panel-tab="configs-list" data-i18n="page.chart.tabs.configurations"></button>
                <button class="panel-tab" data-panel-tab="balances-list" data-i18n="page.chart.tabs.balances"></button>
            </div>
            <div class="panel-content">
                <div id="houses-list" class="panel-tab-content active">
                    <table class="data-table compact">
                        <thead>
                            <tr>
                                <th data-i18n="page.chart.table.houses.cusp"></th>
                                <th data-i18n="page.chart.table.houses.sign"></th>
                            </tr>
                        </thead>
                        <tbody id="housesTable"></tbody>
                    </table>

                    <div id="dignitiesContainer" class="dignities-section"></div>
                </div>
                <div id="configs-list" class="panel-tab-content">
                    <div id="configurationsContainer"></div>
                </div>
                <div id="balances-list" class="panel-tab-content">
                    <div id="balancesContainer"></div>
                </div>
            </div>
        </aside>
    </div>

    <nav class="mobile-nav">
        <button class="mobile-tab" data-view="planets">
            <span class="mobile-tab-icon">☰</span>
            <span data-i18n="page.chart.tabs.planets"></span>
        </button>
        <button class="mobile-tab active" data-view="chart">
            <span class="mobile-tab-icon">◉</span>
            <span data-i18n="page.chart.mobile.chart"></span>
        </button>
        <button class="mobile-tab" data-view="houses">
            <span class="mobile-tab-icon">☖</span>
            <span data-i18n="page.chart.tabs.houses"></span>
        </button>
    </nav>

    <div class="chatkit-wrapper minimized" id="chatkitWrapper">
        <div class="chatkit-header">
            <span class="chatkit-title" data-i18n="page.chart.chat.title"></span>
            <button class="chatkit-minimize" id="chatkitMinimize" data-i18n-title="common.minimize">−</button>
        </div>
        <div class="chatkit-body" id="chatkit-container"></div>
    </div>

    <button class="chatkit-toggle" id="chatkitToggle" data-i18n-title="common.openChat">
        💬
    </button>

    <script type="module" src="js/bundles/chart.bundle.js?v=2"></script>
    <script src="js/locale-switcher.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Натальная карта — AstroBot</title>
    <link rel="stylesheet" href="css/styles.css?v=2">
    <link rel="stylesheet" href="css/chart-layout.css?v=2">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="chart-page">
    <!-- Header -->
    <header class="chart-header-compact">
        <a href="/" class="back-btn-compact">←</a>
        <div class="birth-info-compact">
            <h2 id="birthDate">Натальная карта</h2>
            <p id="birthPlace"></p>
        </div>
        <div class="header-nav-buttons">
            <a href="natal-full.html" class="header-nav-btn">📊 Таблицы</a>
            <a href="interpretations.html" class="header-nav-btn">🧠 Интерпретация</a>
        </div>
    </header>

    <!-- Main 3-column layout -->
    <div class="chart-layout">
        <!-- Left panel: Planets & Aspects -->
        <aside class="side-panel left-panel" id="view-planets">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel-tab="planets-list">Планеты</button>
                <button class="panel-tab" data-panel-tab="aspects-list">Аспекты</button>
                <button class="panel-tab" data-panel-tab="grid-list">Сетка</button>
            </div>
            <div class="panel-content">
                <div id="planets-list" class="panel-tab-content active">
                    <table class="data-table compact">
                        <thead>
                            <tr><th>Симв.</th><th>Позиция</th><th>Дом</th></tr>
                        </thead>
                        <tbody id="planetsTable"></tbody>
                    </table>
                </div>
                <div id="aspects-list" class="panel-tab-content">
                    <div class="aspects-header">
                        <button class="aspects-settings-btn" id="aspectsSettingsBtn" title="Настройки отображения">⚙</button>
                    </div>
                    <div class="aspects-settings-panel hidden" id="aspectsSettingsPanel">
                        <div class="aspects-settings-title">Показывать аспекты с:</div>
                        <div class="aspects-filter-buttons">
                            <button class="aspects-filter-btn" id="aspectsResetBtn">Сбросить</button>
                            <button class="aspects-filter-btn" id="aspectsMajorBtn">Мажорные</button>
                            <button class="aspects-filter-btn" id="aspectsMinorBtn">Минорные</button>
                        </div>
                        <div class="aspects-planet-toggles" id="aspectsPlanetToggles"></div>
                    </div>
                    <table class="data-table compact">
                        <thead>
                            <tr><th colspan="2">Аспект</th><th>Тип</th><th>Орбис</th></tr>
                        </thead>
                        <tbody id="aspectsTable"></tbody>
                    </table>
                </div>
                <div id="grid-list" class="panel-tab-content">
                    <h4 class="subsection-title">Сетка аспектов</h4>
                    <div id="aspectGridContainer"></div>
                </div>
            </div>
        </aside>

        <!-- Center: Chart wheel -->
        <main class="chart-center" id="view-chart">
            <div class="chart-wheel-wrapper" id="chartWheelWrapper">
                <svg id="chartWheel" viewBox="0 0 500 500"></svg>
            </div>
            <div class="zoom-controls-float">
                <button class="zoom-btn" id="zoomIn" title="Приблизить">+</button>
                <button class="zoom-btn" id="zoomOut" title="Отдалить">−</button>
                <button class="zoom-btn" id="zoomReset" title="Сбросить">⟲</button>
                <button class="zoom-btn" id="settingsToggle" title="Настройки">⚙</button>
            </div>

            <!-- Легенда линий аспектов -->
            <div class="aspect-lines-legend">
                <span class="legend-item clickable active" data-filter="all" id="filterAll">
                    <span class="line-sample solid"></span> Все
                </span>
                <span class="legend-item clickable" data-filter="major" id="filterMajor">
                    <span class="line-sample solid"></span> Мажорные
                </span>
                <span class="legend-item clickable" data-filter="minor" id="filterMinor">
                    <span class="line-sample dashed"></span> Минорные
                </span>
                <span class="legend-sep">|</span>
                <span class="legend-color" style="color:#ef4444">● Напряж.</span>
                <span class="legend-color" style="color:#3b82f6">● Гармон.</span>
                <span class="legend-color" style="color:#f59e0b">● Нейтр.</span>
            </div>

            <div id="tooltip" class="chart-tooltip"></div>

            <!-- Settings Panel -->
            <div id="settingsPanel" class="settings-panel hidden">
                <h4>Настройки отображения</h4>

                <div class="settings-section">
                    <label class="settings-label">Система домов</label>
                    <select id="houseSystemSelect" class="settings-select">
                        <option value="Placidus" selected>Placidus</option>
                        <option value="Koch">Koch</option>
                        <option value="Whole_Sign">Whole Sign</option>
                        <option value="Equal">Equal</option>
                        <option value="Campanus">Campanus</option>
                        <option value="Regiomontanus">Regiomontanus</option>
                    </select>
                </div>

                <div class="settings-section">
                    <label class="settings-label">Планеты и точки</label>
                    <div class="planet-toggles" id="planetToggles">
                        <!-- Filled dynamically -->
                    </div>
                </div>

                <button class="btn-apply" id="applySettings">Применить</button>
            </div>
        </main>

        <!-- Right panel: Houses & Analytics -->
        <aside class="side-panel right-panel" id="view-houses">
            <div class="panel-tabs">
                <button class="panel-tab active" data-panel-tab="houses-list">Дома</button>
                <button class="panel-tab" data-panel-tab="configs-list">Конфигурации</button>
                <button class="panel-tab" data-panel-tab="balances-list">Балансы</button>
            </div>
            <div class="panel-content">
                <div id="houses-list" class="panel-tab-content active">
                    <table class="data-table compact">
                        <thead>
                            <tr><th>Куспид</th><th>Знак</th></tr>
                        </thead>
                        <tbody id="housesTable"></tbody>
                    </table>

                    <!-- Эссенциальные достоинства -->
                    <div id="dignitiesContainer" class="dignities-section"></div>
                </div>
                <div id="configs-list" class="panel-tab-content">
                    <div id="configurationsContainer"></div>
                </div>
                <div id="balances-list" class="panel-tab-content">
                    <div id="balancesContainer"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Mobile bottom tabs -->
    <nav class="mobile-nav">
        <button class="mobile-tab" data-view="planets">
            <span class="mobile-tab-icon">☰</span>
            <span>Планеты</span>
        </button>
        <button class="mobile-tab active" data-view="chart">
            <span class="mobile-tab-icon">◉</span>
            <span>Карта</span>
        </button>
        <button class="mobile-tab" data-view="houses">
            <span class="mobile-tab-icon">☖</span>
            <span>Дома</span>
        </button>
    </nav>

    <!-- ChatKit Widget Container -->
    <div id="chatkit-container" class="chatkit-wrapper"></div>

    <!-- ChatKit.js Script -->
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"></script>

    <script src="js/api.js"></script>
    <script src="js/symbols.js"></script>
    <script src="js/chart-wheel.js"></script>
    <script src="js/chart-data.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/chart-layout.js"></script>
    <script src="js/chatkit-init.js"></script>
</body>
</html>

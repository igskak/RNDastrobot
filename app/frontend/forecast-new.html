<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогностика New</title>
    <link rel="stylesheet" href="/bundles/forecast-new.bundle.css?v=20260430-211101">
    <script>window.__APP_BUILD_ID__ = '20260430-211101';</script>
</head>
<body class="forecast-new-page">
    <div class="page-loader forecast-new-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text">Загружаем прогностику</div>
    </div>

    <header class="chart-header-compact forecast-new-header">
        <a href="/" class="back-btn-compact" id="forecastNewBackBtn" aria-label="Назад" title="Назад">←</a>
        <div class="birth-info-compact forecast-new-client">
            <h2 id="forecastNewTitle">Прогностика New</h2>
            <p id="forecastNewSubtitle"></p>
        </div>
        <div class="forecast-new-layer-toggles" aria-label="Слои прогностики">
            <label class="forecast-new-layer-toggle forecast-new-layer-toggle--transit">
                <input type="checkbox" data-layer-toggle="transit" checked>
                <span>Транзиты</span>
            </label>
            <label class="forecast-new-layer-toggle forecast-new-layer-toggle--progression">
                <input type="checkbox" data-layer-toggle="progression">
                <span>Прогрессии</span>
            </label>
            <label class="forecast-new-layer-toggle forecast-new-layer-toggle--direction">
                <input type="checkbox" data-layer-toggle="direction">
                <span>Дирекции</span>
            </label>
        </div>
        <div class="header-nav-buttons forecast-new-header-actions">
            <button type="button" class="header-nav-btn" id="openNatalBtn" data-i18n="page.natalFull.nav.wheel"></button>
            <button type="button" class="header-nav-btn" id="openNatalTablesBtn" data-i18n="page.chart.nav.tables"></button>
            <button type="button" class="header-nav-btn" id="openSynastryBtn" data-i18n="page.chart.nav.synastry"></button>
            <a href="/account-settings.html" class="header-nav-btn">Settings</a>
        </div>
    </header>

    <div class="profile-error hidden" id="forecastNewError">
        <p id="forecastNewErrorMsg"></p>
        <a href="/" class="btn-logout">К списку клиентов</a>
    </div>

    <main class="forecast-new-layout hidden" id="forecastNewLayout">
        <aside class="side-panel left-panel forecast-new-side-panel" id="forecastNewNatalPanel">
            <div class="forecast-new-side-head">
                <h3>Натал</h3>
                <p id="natalPanelMeta"></p>
            </div>
            <div class="panel-tabs forecast-new-tabs">
                <button class="panel-tab active" data-panel-target="natalPlanetsView">Планеты и дома</button>
                <button class="panel-tab" data-panel-target="natalAspectsView">Аспекты</button>
                <button class="panel-tab" data-panel-target="natalGridView">Сетка</button>
                <button class="panel-tab" data-panel-target="natalConfigsView">Конфигурации</button>
                <button class="panel-tab" data-panel-target="natalBalancesView">Балансы</button>
            </div>
            <div class="panel-content forecast-new-panel-content">
                <div id="natalPlanetsView" class="panel-tab-content active">
                    <table class="data-table compact forecast-new-planets-table">
                        <colgroup>
                            <col class="forecast-new-symbol-column">
                            <col class="forecast-new-position-column">
                            <col class="forecast-new-speed-column">
                            <col class="forecast-new-house-column">
                            <col class="forecast-new-matrix-column">
                            <col class="forecast-new-matrix-column">
                        </colgroup>
                        <thead><tr><th>Симв.</th><th>Позиция</th><th class="planet-speed-col">Скор.</th><th>Дом</th><th class="forecast-new-matrix-col" title="Показ">П</th><th class="forecast-new-matrix-col" title="Аспектация">А</th></tr></thead>
                        <tbody id="natalPlanetsTable"></tbody>
                    </table>
                    <div class="subsection-title forecast-new-houses-title">Дома</div>
                    <table class="data-table compact forecast-new-houses-table">
                        <colgroup>
                            <col class="forecast-new-house-cusp-column">
                            <col class="forecast-new-house-sign-column">
                            <col class="forecast-new-house-ruler-column">
                        </colgroup>
                        <thead><tr><th>Куспид</th><th>Знак</th><th>Упр.</th></tr></thead>
                        <tbody id="natalHousesTable"></tbody>
                    </table>
                </div>
                <div id="natalAspectsView" class="panel-tab-content">
                    <table class="data-table compact">
                        <thead><tr><th colspan="2" class="sortable" data-sort="planet">Аспект</th><th class="sortable" data-sort="type">Тип</th><th class="sortable" data-sort="orb">Орб</th></tr></thead>
                        <tbody id="natalAspectsTable"></tbody>
                    </table>
                </div>
                <div id="natalGridView" class="panel-tab-content"><div id="natalAspectGridContainer"></div></div>
                <div id="natalConfigsView" class="panel-tab-content"><div id="natalConfigurationsContainer"></div><div id="natalDignitiesContainer"></div></div>
                <div id="natalBalancesView" class="panel-tab-content"><div id="natalBalancesContainer"></div></div>
            </div>
        </aside>

        <section class="chart-center forecast-new-center">
            <div class="forecast-new-wheel-shell" id="forecastNewWheelShell">
                <svg id="forecastNewWheel" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <div class="forecast-new-zoom-controls zoom-controls-float">
                <button class="zoom-btn" id="forecastNewZoomIn" title="Zoom in">+</button>
                <button class="zoom-btn" id="forecastNewZoomOut" title="Zoom out">−</button>
                <button class="zoom-btn" id="forecastNewZoomReset" title="Reset">⟲</button>
                <button class="zoom-btn forecast-new-settings-btn" id="forecastNewSettingsToggle" title="Settings" aria-label="Settings">
                    <span class="forecast-new-settings-icon" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>
            </div>
            <div id="forecastNewSettingsPanel" class="settings-panel forecast-new-settings-panel hidden">
                <h4>Настройки карты</h4>
                <div class="settings-section">
                    <label class="settings-label">Ориентация</label>
                    <select id="orientationSelect" class="settings-select">
                        <option value="aries">Овен слева</option>
                        <option value="asc">ASC слева</option>
                    </select>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Система домов</label>
                    <select id="houseSystemSelect" class="settings-select">
                        <option value="P">Плацидус</option>
                        <option value="K">Кох</option>
                        <option value="W">Целые знаки</option>
                        <option value="E">Равнодомная</option>
                        <option value="C">Кампанус</option>
                        <option value="R">Региомонтан</option>
                    </select>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Размер иконок</label>
                    <div class="settings-size-control">
                        <input type="range" id="iconScaleRange" min="80" max="170" step="5" value="120">
                        <span id="iconScaleValue">120%</span>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Фильтр аспектов</label>
                    <select id="aspectScopeSelect" class="settings-select">
                        <option value="all">Все</option>
                        <option value="major">Мажорные</option>
                        <option value="minor">Минорные</option>
                    </select>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Планеты и точки</label>
                    <div class="natal-matrix-editor" id="forecastNewSettingsMatrixEditor"></div>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Типы аспектов</label>
                    <div class="settings-check-grid settings-check-grid--compact" id="aspectTypeToggles"></div>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Параметры аспектов</label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="aspectPhaseApplyingToggle">
                            <span>Сходящиеся</span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="aspectPhaseSeparatingToggle">
                            <span>Расходящиеся</span>
                        </label>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Подписи домов</label>
                    <select id="houseNumberStyleSelect" class="settings-select">
                        <option value="arabic">Арабские</option>
                        <option value="roman">Римские</option>
                    </select>
                    <label class="settings-check-option">
                        <input type="checkbox" id="houseLabelsOutsideToggle">
                        <span data-i18n="page.chart.settings.houseLabels.outside"></span>
                    </label>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Подписи на колесе</label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="showWheelStationaryToggle">
                            <span>Показывать стационарность</span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="showWheelDegreeToggle">
                            <span>Показывать градус</span>
                        </label>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label">Таблицы</label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="showSpeedToggle">
                            <span>Показывать скорость</span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="showStationaryToggle">
                            <span>Показывать стационарность</span>
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <aside class="side-panel right-panel forecast-new-side-panel" id="forecastNewProgPanel">
            <div class="forecast-new-side-head">
                <button type="button" class="forecast-new-moment-toggle" id="prognosticMomentToggle" aria-expanded="false" aria-controls="forecastNewMomentCard">
                    <span class="forecast-new-moment-toggle-title" id="prognosticPanelTitle">Транзиты</span>
                    <span class="forecast-new-moment-toggle-meta" id="prognosticPanelMeta"></span>
                </button>
            </div>
            <div class="forecast-new-time-stepper" id="forecastNewTimeStepper" aria-label="Управление временем транзитов"></div>
            <div class="forecast-new-moment-card hidden" id="forecastNewMomentCard">
                <label>Дата / время</label>
                <strong id="targetDatetimeLabel"></strong>
                <div class="forecast-new-native-datetime">
                    <input type="date" id="targetDateInput">
                    <input type="time" id="targetTimeInput" step="1">
                </div>
                <div class="forecast-new-location-grid">
                    <select id="timezoneInput">
                        <option value="">Timezone</option>
                    </select>
                    <div class="place-autocomplete-wrapper forecast-new-location-autocomplete">
                        <input type="text" id="locationInput" placeholder="Локация" autocomplete="off">
                        <div id="locationSuggestions" class="place-suggestions"></div>
                    </div>
                    <input type="number" id="latitudeInput" step="0.0001" placeholder="Lat">
                    <input type="number" id="longitudeInput" step="0.0001" placeholder="Lon">
                </div>
            </div>
            <div class="forecast-new-right-layer-tabs" id="rightLayerTabs"></div>
            <div class="panel-tabs forecast-new-tabs">
                <button class="panel-tab active" data-panel-target="progPlanetsView">Планеты и дома</button>
                <button class="panel-tab" data-panel-target="progAspectsView">Аспекты</button>
                <button class="panel-tab" data-panel-target="progGridView">Сетка</button>
                <button class="panel-tab" data-panel-target="progConfigsView">Конфигурации</button>
                <button class="panel-tab" data-panel-target="progBalancesView">Балансы</button>
            </div>
            <div class="panel-content forecast-new-panel-content">
                <div id="progPlanetsView" class="panel-tab-content active">
                    <table class="data-table compact">
                        <thead><tr><th>Симв.</th><th>Позиция</th><th class="planet-speed-col">Скор.</th><th>Дом</th></tr></thead>
                        <tbody id="progPlanetsTable"></tbody>
                    </table>
                    <div class="subsection-title forecast-new-houses-title">Дома</div>
                    <table class="data-table compact">
                        <thead><tr><th>Куспид</th><th>Знак</th><th>Упр.</th></tr></thead>
                        <tbody id="progHousesTable"></tbody>
                    </table>
                </div>
                <div id="progAspectsView" class="panel-tab-content">
                    <table class="data-table compact">
                        <thead><tr><th colspan="2" class="sortable" data-sort="planet">Аспект</th><th class="sortable" data-sort="type">Тип</th><th class="sortable" data-sort="orb">Орб</th></tr></thead>
                        <tbody id="progAspectsTable"></tbody>
                    </table>
                </div>
                <div id="progGridView" class="panel-tab-content"><div id="progAspectGridContainer"></div></div>
                <div id="progConfigsView" class="panel-tab-content"><div id="progConfigurationsContainer"></div><div id="progDignitiesContainer"></div></div>
                <div id="progBalancesView" class="panel-tab-content"><div id="progBalancesContainer"></div></div>
            </div>
        </aside>
    </main>

    <script type="module" src="/js/bundles/forecast-new.bundle.js?v=20260430-211101"></script>
</body>
</html>

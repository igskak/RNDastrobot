    <!-- C2 (Фаза 3): символьные глифы (знаки/аспекты) появляются на колесе сразу;
         font-display:block делает их невидимыми до загрузки шрифта, поэтому прелоадим
         woff2-сабсеты (десятки КБ вместо 1.2 МБ ttf). crossorigin обязателен для шрифтов. -->
    <link rel="preload" href="/fonts/NotoSansSymbols.subset.woff2" as="font" type="font/woff2" crossorigin>

    <script>window.__APP_BUILD_ID__ = 'eb5cdceb20d7';</script>
    <!-- A3 (Фаза 1): каталог локали грузится i18n.js в рантайме и это первый await
         bootstrap. Прогреваем HTTP-кэш нужной локали сразу из <head> (immutable-кэш в
         проде → i18n.js переиспользует ответ). Локаль резолвим тем же приоритетом, что
         и i18n.js: ?locale/?lang → localStorage → cookie → navigator.languages → 'en'. -->
    <script>
        (function () {
            try {
                var SUPPORTED = ['en', 'uk', 'ru'];
                function norm(value) {
                    if (!value || typeof value !== 'string') return null;
                    var base = value.trim().toLowerCase().replace(/_/g, '-').split('-', 1)[0];
                    return SUPPORTED.indexOf(base) >= 0 ? base : null;
                }
                var qs = new URLSearchParams(location.search);
                var loc = norm(qs.get('locale')) || norm(qs.get('lang'));
                if (!loc) { try { loc = norm(localStorage.getItem('astrobot_locale')); } catch (e) {} }
                if (!loc) {
                    var m = (document.cookie || '').match(/(?:^|;\s*)astrobot_locale=([^;]+)/);
                    if (m) { try { loc = norm(decodeURIComponent(m[1])); } catch (e) { loc = norm(m[1]); } }
                }
                if (!loc) {
                    var langs = navigator.languages || [navigator.language];
                    for (var i = 0; i < langs.length; i += 1) { var n = norm(langs[i]); if (n) { loc = n; break; } }
                }
                if (!loc) loc = 'en';
                var v = window.__APP_BUILD_ID__ || 'i18n-v1';
                fetch('/locales/' + loc + '.json?v=' + encodeURIComponent(v), {
                    headers: { 'Accept': 'application/json' },
                }).catch(function () { /* прогрев кэша — не критично при ошибке */ });
            } catch (e) { /* прогрев не должен ломать загрузку */ }
        })();
    </script>
    <!-- C4 (Фаза 1): статические чанки entry-бандла. Без modulepreload браузер узнаёт о

         генерируется build-скриптом из esbuild metafile; править вручную не нужно. -->

                        <thead><tr><th data-i18n="page.chart.table.houses.cusp">House cusp</th><th data-i18n="page.chart.table.houses.sign">Sign</th><th data-i18n="page.chart.table.houses.ruler">Ruler</th></tr></thead>
                        <tbody id="progHousesTable"></tbody>
                    </table>
                </div>
                <div id="progAspectsView" class="panel-tab-content">
                    <table class="data-table compact aspect-list-table">
                        <thead><tr><th class="sortable" data-sort="planet" data-i18n="page.chart.table.aspects.aspect">Aspect</th><th class="sortable" data-sort="type" data-i18n="page.chart.table.aspects.type">Phase</th><th class="sortable" data-sort="orb" data-i18n="page.chart.table.aspects.orb">Orb</th></tr></thead>
                        <tbody id="progAspectsTable"></tbody>
                    </table>
                </div>
                <div id="progGridView" class="panel-tab-content"><div id="progAspectGridContainer"></div></div>
                <div id="progConfigsView" class="panel-tab-content"><div id="progConfigurationsContainer"></div></div>
                <div id="progBalancesView" class="panel-tab-content"><div id="progBalancesContainer"></div></div>
                <div id="progJonesView" class="panel-tab-content"><div id="progJonesContainer"></div></div>
                <div id="progDispositorsView" class="panel-tab-content"><div id="progDispositorsContainer"></div></div>

    <!-- Save-chart modal is injected by SaveChartModal module (save-chart-modal.js) -->

    <!-- Astrologer assistant chat (corner dock) -->
    <button type="button" id="chatToggle" class="chat-toggle" data-chat-lazy data-i18n-aria-label="page.chart.chat.toggle">
        <span aria-hidden="true">✦</span>
    </button>
    <button type="button" id="chatVoiceCommand" class="chat-voice-command" data-chat-lazy aria-pressed="false" data-i18n-aria-label="page.chart.chat.voiceCommand">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"/>
            <path d="M19 11a7 7 0 0 1-14 0"/>
            <path d="M12 18v3"/>
            <path d="M9 21h6"/>
        </svg>
    </button>
    <button type="button" id="chatVoiceMiniStatus" class="chat-voice-mini" data-chat-lazy hidden data-i18n-aria-label="page.chart.chat.openVoiceResult"></button>
    <section id="chatWidget" class="chat-widget" data-chat-lazy aria-labelledby="chatTitle">
        <button type="button" id="chatResizeHandle" class="chat-resize-handle"
                data-i18n-aria-label="page.chart.chat.resize"></button>
        <header class="chat-widget-header">
            <button type="button" id="chatHistoryToggle" class="chat-widget-icon"
                    data-i18n-aria-label="page.chart.chat.history" aria-expanded="false">
                <span aria-hidden="true">≡</span>
            </button>
            <h2 id="chatTitle" class="chat-widget-title" data-i18n="page.chart.chat.title"></h2>
            <button type="button" id="chatNewThread" class="chat-widget-icon"
                    data-i18n-aria-label="page.chart.chat.newThread">
                <span aria-hidden="true">＋</span>
            </button>
            <button type="button" id="chatClose" class="chat-widget-close" data-i18n-aria-label="page.chart.chat.close">
                <span aria-hidden="true">×</span>
            </button>
        </header>
        <div class="chat-view-tabs" role="tablist" data-i18n-aria-label="page.clientNotes.dockTabs">
            <button type="button" id="chatAssistantTab" class="chat-view-tab active" role="tab" aria-selected="true" data-chat-view="assistant" data-i18n="page.chart.chat.title"></button>
            <button type="button" id="chatNotesTab" class="chat-view-tab" role="tab" aria-selected="false" data-chat-view="notes" data-i18n="page.clientNotes.title"></button>
        </div>
        <div id="chatHistory" class="chat-history" hidden>
            <p class="chat-history-title" data-i18n="page.chart.chat.historyTitle"></p>
            <ul id="chatHistoryList" class="chat-history-list"></ul>
        </div>
        <div id="chatMessages" class="chat-messages" role="log" aria-live="polite">
            <p class="chat-empty" data-i18n="page.chart.chat.empty"></p>
        </div>
        <div id="chatVoiceStatus" class="chat-voice-status" role="status" aria-live="polite" hidden></div>
        <div id="chatInputRow" class="chat-input-row">
            <textarea id="chatInput" class="chat-input" rows="1"
                      data-i18n-placeholder="page.chart.chat.placeholder"></textarea>
            <button type="button" id="chatMic" class="chat-mic" aria-pressed="false"
                    data-i18n-aria-label="page.chart.chat.mic">
                <span aria-hidden="true">●</span>
            </button>
            <button type="button" id="chatSend" class="chat-send" data-i18n-aria-label="page.chart.chat.send">
                <span aria-hidden="true">↑</span>
            </button>
        </div>
        <div id="chatNotesView" class="chat-notes-view" hidden>
            <div class="chat-notes-source-tabs" role="tablist" data-i18n-aria-label="page.clientNotes.sourceTabs">
                <button type="button" class="chat-notes-source active" data-notes-source="astrologer" data-i18n="page.clientNotes.tabs.notes"></button>
                <button type="button" class="chat-notes-source" data-notes-source="ai" data-i18n="page.clientNotes.tabs.consultations"></button>
            </div>
            <form id="chatNoteForm" class="chat-note-form">
                <textarea id="chatNoteInput" class="chat-note-input" rows="2" data-i18n-placeholder="page.clientNotes.placeholder"></textarea>
                <button type="submit" id="chatNoteSubmit" class="chat-note-submit" data-i18n="page.clientNotes.add"></button>
            </form>
            <p id="chatNotesStatus" class="chat-notes-status" role="status" aria-live="polite" hidden></p>
            <div id="chatNotesList" class="chat-notes-list"></div>
            <p id="chatNotesEmpty" class="chat-notes-empty" hidden></p>
        </div>
    </section>

    <!-- A5 (Фаза 1): defer снимает парс-блокировку. defer сохраняет порядок документа,
         поэтому window.__RUNTIME_CONFIG__ (runtime-config.js) готов до analytics.js и до
         модуля приложения. -->
    <script defer src="/runtime-config.js"></script>
    <script defer src="/js/analytics.js?v=eb5cdceb20d7"></script>

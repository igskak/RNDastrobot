<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.forecastNew.pageTitle">Forecast</title>
    <link rel="stylesheet" href="/bundles/forecast-new.bundle.css?v=d95fdb474ee6">
    <script>window.__APP_BUILD_ID__ = 'd95fdb474ee6';</script>
</head>
<body class="forecast-new-page">
    <div class="page-loader forecast-new-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="page.forecastNew.loader">Loading forecast</div>
    </div>

    <header class="chart-header-compact forecast-new-header">
        <a href="/" class="back-btn-compact" id="forecastNewBackBtn" data-i18n-aria-label="common.back" data-i18n-title="common.back" aria-label="Back" title="Back">←</a>
        <div class="birth-info-compact forecast-new-client">
            <h2 id="forecastNewTitle" data-i18n="page.forecastNew.pageTitle">Forecast</h2>
            <p id="forecastNewSubtitle"></p>
        </div>
        <div class="forecast-new-layer-toggles" data-i18n-aria-label="page.forecastNew.layersAria" aria-label="Forecast layers">
            <label class="forecast-new-layer-chip forecast-new-layer-chip--transit">
                <input type="checkbox" data-layer-toggle="transit" checked>
                <span data-i18n="common.method.transit">Транзиты</span>
            </label>
            <label class="forecast-new-layer-chip forecast-new-layer-chip--progression">
                <input type="checkbox" data-layer-toggle="progression">
                <span data-i18n="common.method.progression">Прогрессии</span>
            </label>
            <div class="forecast-new-layer-pop" data-layer-pop="direction">
                <label class="forecast-new-layer-chip forecast-new-layer-chip--direction">
                    <input type="checkbox" data-layer-toggle="direction">
                    <span data-i18n="common.method.direction">Дирекции</span>
                </label>
                <div class="forecast-new-layer-popover hidden" data-layer-popover="direction" role="dialog" data-i18n-aria-label="page.forecastNew.direction.popoverAria" aria-label="Direction options">
                    <label class="forecast-new-pop-label" data-i18n="page.forecastNew.direction.typeLabel">Direction type</label>
                    <select id="forecastNewDirectionTypeSelect" class="forecast-new-pop-select" data-i18n-aria-label="page.forecastNew.direction.typeLabel" aria-label="Direction type">
                        <option value="zodiacal" data-i18n="page.forecastNew.direction.zodiacal">Zodiacal</option>
                        <option value="solar_arc" data-i18n="page.forecastNew.direction.solarArc">Solar arc</option>
                        <option value="equatorial" data-i18n="page.forecastNew.direction.naibod">Naibod</option>
                    </select>
                </div>
            </div>
            <div class="forecast-new-layer-pop" data-layer-pop="solar_return">
                <label class="forecast-new-layer-chip forecast-new-layer-chip--solar">
                    <input type="checkbox" data-layer-toggle="solar_return">
                    <span data-i18n="common.method.solar">Соляр</span>
                </label>
                <div class="forecast-new-layer-popover hidden" data-layer-popover="solar_return" role="dialog" data-i18n-aria-label="page.forecastNew.solar.popoverAria" aria-label="Solar return options">
                    <label class="forecast-new-pop-label" data-i18n="page.forecastNew.solar.yearLabel">Solar return year</label>
                    <input type="number" id="forecastNewSolarYearInput" class="forecast-new-pop-input" min="1900" max="2100" data-i18n-aria-label="page.forecastNew.solar.yearLabel" aria-label="Solar return year">
                    <label class="forecast-new-pop-label" data-i18n="page.forecastNew.solar.placeLabel">Solar return place</label>
                    <div class="place-autocomplete-wrapper forecast-new-solar-location-wrap">
                        <input type="text" id="forecastNewSolarLocationInput" class="forecast-new-pop-input forecast-new-solar-location-input" placeholder="Solar return place…" data-i18n-placeholder="page.forecastNew.solar.placePlaceholder" autocomplete="off" data-i18n-aria-label="page.forecastNew.solar.placeLabel" aria-label="Solar return place">
                        <div id="forecastNewSolarLocationSuggestions" class="place-suggestions"></div>
                    </div>
                    <input type="hidden" id="forecastNewSolarLat">
                    <input type="hidden" id="forecastNewSolarLon">
                </div>
            </div>
            <div class="forecast-new-layer-pop" data-layer-pop="synastry_partner">
                <label class="forecast-new-layer-chip forecast-new-layer-chip--synastry">
                    <input type="checkbox" data-layer-toggle="synastry_partner">
                    <span data-i18n="page.chart.nav.synastry">Синастрия</span>
                </label>
                <div class="forecast-new-layer-popover hidden" data-layer-popover="synastry_partner" role="dialog" data-i18n-aria-label="page.forecastNew.synastry.popoverAria" aria-label="Synastry partner">
                    <div class="forecast-new-synastry-mode" role="tablist" data-i18n-aria-label="page.forecastNew.synastry.sourceAria" aria-label="Partner source">
                        <button type="button" class="forecast-new-synastry-mode-btn is-active" data-synastry-mode="db" role="tab" aria-selected="true" data-i18n="page.forecastNew.synastry.fromDb">From database</button>
                        <button type="button" class="forecast-new-synastry-mode-btn" data-synastry-mode="manual" role="tab" aria-selected="false" data-i18n="page.forecastNew.synastry.manual">Manual</button>
                    </div>
                    <div class="forecast-new-synastry-pane" data-synastry-pane="db">
                        <select id="forecastNewSynastryPartnerSelect" class="forecast-new-pop-select" data-i18n-aria-label="page.forecastNew.synastry.popoverAria" aria-label="Synastry partner">
                            <option value="" data-i18n="page.forecastNew.synastry.partnerOption">— partner —</option>
                        </select>
                        <button type="button" class="forecast-new-synastry-apply" id="forecastNewSynastryPickerBtn" data-i18n="page.chartPicker.title">Выбор карты</button>
                    </div>
                    <div class="forecast-new-synastry-pane hidden" data-synastry-pane="manual">
                        <input type="text" id="forecastNewSynastryManualName" class="forecast-new-pop-input" placeholder="Partner name" data-i18n-placeholder="page.forecastNew.synastry.namePlaceholder" autocomplete="off">
                        <div class="forecast-new-synastry-manual-grid">
                            <input type="date" id="forecastNewSynastryManualDate" class="forecast-new-pop-input" data-i18n-aria-label="page.forecastNew.synastry.dateAria" aria-label="Partner birth date">
                            <input type="time" id="forecastNewSynastryManualTime" class="forecast-new-pop-input" step="1" data-i18n-aria-label="page.forecastNew.synastry.timeAria" aria-label="Partner birth time">
                        </div>
                        <select id="forecastNewSynastryManualTimezone" class="forecast-new-pop-select" data-i18n-aria-label="page.forecastNew.synastry.timezoneAria" aria-label="Partner timezone">
                            <option value="" data-i18n="page.forecastNew.synastry.timezoneOption">Timezone</option>
                        </select>
                        <div class="place-autocomplete-wrapper">
                            <input type="text" id="forecastNewSynastryManualLocation" class="forecast-new-pop-input" placeholder="Birth place" data-i18n-placeholder="page.forecastNew.synastry.locationPlaceholder" autocomplete="off" data-i18n-aria-label="page.forecastNew.synastry.locationAria" aria-label="Partner birth place">
                            <div id="forecastNewSynastryManualSuggestions" class="place-suggestions"></div>
                        </div>
                        <input type="hidden" id="forecastNewSynastryManualLat">
                        <input type="hidden" id="forecastNewSynastryManualLon">
                        <button type="button" class="forecast-new-synastry-apply" id="forecastNewSynastryManualApply" data-i18n="page.forecastNew.synastry.apply">Apply</button>
                        <p class="forecast-new-synastry-manual-error hidden" id="forecastNewSynastryManualError"></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-nav-buttons forecast-new-header-actions">
            <div class="forecast-view-tabs">
                <a href="forecast-new.html" class="forecast-view-tab" aria-current="page" data-i18n="page.chart.nav.forecast"><i class="forecast-view-tab-icon" aria-hidden="true">◯</i></a>
                <a href="forecast-tables.html" class="forecast-view-tab forecast-view-tab--multi-only" data-i18n="page.forecast.tabs.table"></a>
                <a href="forecast-timeline.html" class="forecast-view-tab forecast-view-tab--multi-only" data-i18n="page.forecast.tabs.timeline"></a>
            </div>
            <div class="header-action-menu">
                <button type="button" class="header-nav-btn header-nav-btn--icon" id="forecastNewActionsToggle" aria-haspopup="true" aria-expanded="false" data-i18n-aria-label="page.chart.actions.openMenu">
                    <svg class="nav-btn-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                        <circle cx="7" cy="2.5" r="1"/>
                        <circle cx="7" cy="7" r="1"/>
                        <circle cx="7" cy="11.5" r="1"/>
                    </svg>
                    <span data-i18n="page.chart.actions.label"></span>
                </button>
                <div class="chart-actions-menu hidden" id="forecastNewActionsMenu" role="menu">
                    <a href="/" class="chart-action-item chart-action-item--link" role="menuitem" data-i18n="page.chart.nav.home"></a>
                    <button type="button" class="chart-action-item" id="openNatalBtn" role="menuitem" data-i18n="page.natalFull.nav.wheel"></button>
                    <a href="solar.html" class="chart-action-item chart-action-item--link" role="menuitem" data-i18n="page.chart.nav.solar"></a>
                    <button type="button" class="chart-action-item" id="openNatalTablesBtn" role="menuitem" data-i18n="page.chart.nav.tables"></button>
                    <button type="button" class="chart-action-item" id="openSynastryBtn" role="menuitem" data-i18n="page.chart.nav.synastry"></button>
                    <button type="button" class="chart-action-item" id="openClientProfileBtn" role="menuitem" data-i18n="page.clientProfile.viewProfile"></button>
                    <a href="/account-settings.html" class="chart-action-item chart-action-item--link" role="menuitem" data-i18n="page.accountSettings.title"></a>
                </div>
            </div>
        </div>
    </header>

    <div class="profile-error hidden" id="forecastNewError">
        <p id="forecastNewErrorMsg"></p>
        <a href="/" class="btn-logout" data-i18n="page.forecastNew.backToClients">Back to clients</a>
    </div>

    <main class="forecast-new-layout hidden" id="forecastNewLayout">
        <aside class="side-panel left-panel forecast-new-side-panel" id="forecastNewNatalPanel">
            <div class="forecast-new-side-head">
                <button type="button" class="forecast-new-moment-toggle" id="natalMomentToggle" aria-expanded="false" aria-controls="forecastNewNatalCard">
                    <span class="forecast-new-moment-toggle-title" data-i18n="page.forecastNew.natalPanelTitle">Natal</span>
                    <span class="forecast-new-moment-toggle-meta" id="natalPanelMeta"></span>
                </button>
            </div>
            <div class="forecast-new-time-stepper" id="forecastNewNatalTimeStepper" data-i18n-aria-label="page.forecastNew.natalStepperAria" aria-label="Birth date control"></div>
            <div class="forecast-new-moment-card hidden" id="forecastNewNatalCard">
                <label data-i18n="page.forecastNew.birthDateTimeLabel">Birth date / time</label>
                <strong id="natalDatetimeLabel"></strong>
                <div class="forecast-new-native-datetime">
                    <input type="date" id="natalDateInput">
                    <input type="time" id="natalTimeInput" step="1">
                </div>
                <div class="forecast-new-location-grid">
                    <select id="natalTimezoneInput">
                        <option value="" data-i18n="page.forecastNew.timezonePlaceholder">Timezone</option>
                    </select>
                    <div class="place-autocomplete-wrapper forecast-new-location-autocomplete">
                        <input type="text" id="natalLocationInput" placeholder="Birth place" data-i18n-placeholder="page.forecastNew.locationPlaceholder" autocomplete="off">
                        <div id="natalLocationSuggestions" class="place-suggestions"></div>
                    </div>
                    <input type="number" id="natalLatitudeInput" step="0.0001" placeholder="Lat">
                    <input type="number" id="natalLongitudeInput" step="0.0001" placeholder="Lon">
                </div>
            </div>
            <div class="panel-tabs forecast-new-tabs">
                <button class="panel-tab active" data-panel-target="natalPlanetsView" data-i18n="page.chart.tabs.planets">Планеты</button>
                <button class="panel-tab" data-panel-target="natalHousesView" data-i18n="page.chart.tabs.houses">Дома</button>
                <button class="panel-tab" data-panel-target="natalAspectsView" data-i18n="page.chart.tabs.aspects">Аспекты</button>
                <div class="forecast-new-tabs-overflow" data-tabs-overflow>
                    <button
                        type="button"
                        class="panel-tab forecast-new-tabs-overflow-toggle"
                        data-tabs-overflow-toggle
                        data-i18n-aria-label="page.forecastNew.tabsOverflowAria"
                        aria-label="More tabs"
                        aria-haspopup="true"
                        aria-expanded="false"
                    >▸</button>
                    <div class="forecast-new-tabs-overflow-menu" data-tabs-overflow-menu>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="natalGridView" data-i18n="page.forecastNew.tabs.grid">Aspect grid</button>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="natalConfigsView" data-i18n="page.forecastNew.tabs.configs">Configurations</button>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="natalBalancesView" data-i18n="page.forecastNew.tabs.balances">Balances</button>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="natalRulersView" data-i18n="page.chart.tabs.rulers"></button>
                    </div>
                </div>
            </div>
            <div class="panel-content forecast-new-panel-content">
                <div id="natalPlanetsView" class="panel-tab-content active">
                    <table class="data-table compact forecast-new-planets-table">
                        <colgroup>
                            <col class="forecast-new-symbol-column">
                            <col class="forecast-new-position-column">
                            <col class="forecast-new-speed-column">
                            <col class="forecast-new-matrix-column">
                            <col class="forecast-new-matrix-column">
                        </colgroup>
                        <thead><tr><th data-i18n="page.chart.table.planets.symbol">Symbol</th><th data-i18n="page.chart.table.planets.position">Position</th><th data-i18n="page.chart.table.planets.speed">Speed</th><th class="forecast-new-matrix-col" data-i18n="page.forecastNew.matrix.displayShort" data-i18n-title="page.accountSettings.matrix.columns.display" title="Display">D</th><th class="forecast-new-matrix-col" data-i18n="page.forecastNew.matrix.aspectingShort" data-i18n-title="page.accountSettings.matrix.columns.aspecting" title="Aspecting">A</th></tr></thead>
                        <tbody id="natalPlanetsTable"></tbody>
                    </table>
                </div>
                <div id="natalHousesView" class="panel-tab-content">
                    <table class="data-table compact forecast-new-houses-table">
                        <colgroup>
                            <col class="forecast-new-house-cusp-column">
                            <col class="forecast-new-house-sign-column">
                            <col class="forecast-new-house-ruler-column">
                        </colgroup>
                        <thead><tr><th data-i18n="page.chart.table.houses.cusp">House cusp</th><th data-i18n="page.chart.table.houses.sign">Sign</th><th data-i18n="page.chart.table.houses.ruler">Ruler</th></tr></thead>
                        <tbody id="natalHousesTable"></tbody>
                    </table>
                </div>
                <div id="natalAspectsView" class="panel-tab-content">
                    <table class="data-table compact aspect-list-table">
                        <thead><tr><th class="sortable" data-sort="planet" data-i18n="page.chart.table.aspects.aspect">Aspect</th><th class="sortable" data-sort="type" data-i18n="page.chart.table.aspects.type">Phase</th><th class="sortable" data-sort="orb" data-i18n="page.chart.table.aspects.orb">Orb</th></tr></thead>
                        <tbody id="natalAspectsTable"></tbody>
                    </table>
                </div>
                <div id="natalGridView" class="panel-tab-content"><div id="natalAspectGridContainer"></div></div>
                <div id="natalConfigsView" class="panel-tab-content"><div id="natalConfigurationsContainer"></div></div>
                <div id="natalBalancesView" class="panel-tab-content"><div id="natalBalancesContainer"></div></div>
                <div id="natalRulersView" class="panel-tab-content"><div id="natalRulersContainer"></div></div>
            </div>
        </aside>

        <section class="chart-center forecast-new-center">
            <div class="forecast-new-wheel-shell" id="forecastNewWheelShell">
                <svg id="forecastNewWheel" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
            <div class="forecast-new-zoom-controls zoom-controls-float">
                <button class="zoom-btn forecast-new-view-btn" id="forecastNewViewSingle" data-i18n-title="page.forecastNew.view.single" data-i18n-aria-label="page.forecastNew.view.single" title="Single wheel" aria-label="Single wheel">◯</button>
                <button class="zoom-btn forecast-new-view-btn is-active" id="forecastNewViewMulti" data-i18n-title="page.forecastNew.view.multi" data-i18n-aria-label="page.forecastNew.view.multi" title="Multi-wheel" aria-label="Multi-wheel">◎</button>
                <button class="zoom-btn forecast-new-panel-edit-btn" id="forecastNewPanelEditToggle" data-i18n-title="page.forecastNew.panelEditor.toggle" data-i18n-aria-label="page.forecastNew.panelEditor.toggle" title="Настроить панели" aria-label="Настроить панели" aria-pressed="false">▦</button>
                <button class="zoom-btn" id="forecastNewZoomIn" title="Zoom in">+</button>
                <button class="zoom-btn" id="forecastNewZoomOut" title="Zoom out">−</button>
                <button class="zoom-btn" id="forecastNewZoomReset" title="Reset">⟲</button>
                <button class="zoom-btn forecast-new-settings-btn" id="forecastNewSettingsToggle" title="Settings" aria-label="Settings">
                    <span class="forecast-new-settings-icon" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>
            </div>

                <h4 data-i18n="common.displaySettings">Display settings</h4>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.iconSize">Icon size</label>
                    <div class="settings-size-control">
                        <input type="range" id="iconScaleRange" min="80" max="170" step="5" value="120">
                        <span id="iconScaleValue">120%</span>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.aspectScope.label">Aspect scope</label>
                    <select id="aspectScopeSelect" class="settings-select">
                        <option value="all" data-i18n="common.all">All</option>
                        <option value="major" data-i18n="common.major">Major</option>
                        <option value="minor" data-i18n="common.minor">Minor</option>
                    </select>
                </div>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.planetsAndPoints">Planets and points</label>
                    <div class="natal-matrix-editor" id="forecastNewSettingsMatrixEditor"></div>
                </div>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.accountSettings.fields.aspectTypes">Aspect types</label>
                    <div class="settings-check-grid settings-check-grid--compact" id="aspectTypeToggles"></div>
                </div>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.aspectOptions">Aspect options</label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="aspectPhaseApplyingToggle">
                            <span data-i18n="page.chart.settings.aspectPhase.applying">Applying</span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="aspectPhaseSeparatingToggle">
                            <span data-i18n="page.chart.settings.aspectPhase.separating">Separating</span>
                        </label>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.forecastNew.settings.cuspCircles">Cusp circles</label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="showTransitCuspsToggle" checked>
                            <span data-i18n="common.method.transit">Transits</span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="showProgressionCuspsToggle" checked>
                            <span data-i18n="common.method.progression">Progressions</span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="showDirectionCuspsToggle" checked>
                            <span data-i18n="common.method.direction">Directions</span>
                        </label>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.wheelOptions">Wheel labels</label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="showWheelStationaryToggle">
                            <span data-i18n="page.chart.settings.showPlanetStationary">Show stationary</span>
                        </label>
                        <label class="settings-check-option">
                            <input type="checkbox" id="showWheelDegreeToggle">
                            <span data-i18n="page.chart.settings.showPlanetDegree">Show degree</span>
                        </label>
                    </div>
                </div>
                <div class="settings-section">
                    <label class="settings-label" data-i18n="page.chart.settings.tableOptions">Table options</label>
                    <div class="settings-check-stack">
                        <label class="settings-check-option">
                            <input type="checkbox" id="showStationaryToggle">
                            <span data-i18n="page.accountSettings.options.showStationary">Show stationary</span>

                    </div>
                </div>
                <div class="settings-section forecast-new-settings-reset-section">
                    <button type="button" class="forecast-new-settings-reset-btn" id="forecastNewResetLocalBtn" data-i18n="page.forecastNew.settings.resetLocalSettings">Reset local settings</button>
                </div>
            </div>
        </section>

        <aside class="side-panel right-panel forecast-new-side-panel" id="forecastNewProgPanel">
            <div class="forecast-new-side-head">
                <div class="forecast-new-side-title-row">
                    <button type="button" class="forecast-new-moment-toggle" id="prognosticMomentToggle" aria-expanded="false" aria-controls="forecastNewMomentCard">
                        <span class="forecast-new-moment-toggle-title" id="prognosticPanelTitle">Transits</span>
                        <span class="forecast-new-moment-toggle-meta" id="prognosticPanelMeta"></span>
                    </button>
                    <div class="forecast-new-chart-library-actions">
                        <button type="button" class="panel-quick-open-btn" id="forecastSavedChartsBtn" data-i18n-aria-label="page.clientProfile.quickOpen.savedCharts" data-i18n-title="page.clientProfile.quickOpen.savedCharts">
                            <svg class="panel-quick-open-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.45" aria-hidden="true">
                                <path d="M2.5 4.25h4l1.25 1.5h5.75v6.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-8z"/>
                                <path d="M5 8.5h6M8 6v5M6.25 9.25 8 11l1.75-1.75"/>
                            </svg>
                        </button>
                        <button type="button" class="panel-quick-open-btn forecast-new-save-chart-btn" id="saveSourceChartBtn" data-i18n-aria-label="page.chart.actions.saveSourceChart" data-i18n-title="page.chart.actions.saveSourceChart" aria-label="Save chart" title="Save chart">
                            <svg class="panel-quick-open-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.45" aria-hidden="true">
                                <path d="M3 2.75h8l2 2v8.5H3V2.75z"/>
                                <path d="M5 2.75v3.5h5v-3.5M5 13.25V9h6v4.25"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="forecast-new-time-stepper" id="forecastNewTimeStepper" data-i18n-aria-label="page.forecastNew.transitStepperAria" aria-label="Transit time control"></div>
            <div class="forecast-new-moment-card hidden" id="forecastNewMomentCard">
                <label data-i18n="page.forecastNew.dateTimeLabel">Date / time</label>
                <strong id="targetDatetimeLabel"></strong>
                <div class="forecast-new-native-datetime">
                    <input type="date" id="targetDateInput">
                    <input type="time" id="targetTimeInput" step="1">
                </div>
                <div class="forecast-new-location-grid">
                    <select id="timezoneInput">
                        <option value="" data-i18n="page.forecastNew.timezonePlaceholder">Timezone</option>
                    </select>
                    <div class="place-autocomplete-wrapper forecast-new-location-autocomplete">
                        <input type="text" id="locationInput" placeholder="Location" data-i18n-placeholder="page.forecastNew.prognosticLocationPlaceholder" autocomplete="off">
                        <div id="locationSuggestions" class="place-suggestions"></div>
                    </div>
                    <input type="number" id="latitudeInput" step="0.0001" placeholder="Lat">
                    <input type="number" id="longitudeInput" step="0.0001" placeholder="Lon">
                </div>
            </div>
            <div class="forecast-new-right-layer-tabs" id="rightLayerTabs"></div>
            <div class="panel-tabs forecast-new-tabs">
                <button class="panel-tab active" data-panel-target="progPlanetsView" data-i18n="page.chart.tabs.planets">Планеты</button>
                <button class="panel-tab" data-panel-target="progHousesView" data-i18n="page.chart.tabs.houses">Дома</button>
                <button class="panel-tab" data-panel-target="progAspectsView" data-i18n="page.chart.tabs.aspects">Аспекты</button>
                <div class="forecast-new-tabs-overflow" data-tabs-overflow>
                    <button
                        type="button"
                        class="panel-tab forecast-new-tabs-overflow-toggle"
                        data-tabs-overflow-toggle
                        data-i18n-aria-label="page.forecastNew.tabsOverflowAria"
                        aria-label="More tabs"
                        aria-haspopup="true"
                        aria-expanded="false"
                    >▸</button>
                    <div class="forecast-new-tabs-overflow-menu" data-tabs-overflow-menu>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="progGridView" data-i18n="page.forecastNew.tabs.grid">Aspect grid</button>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="progConfigsView" data-i18n="page.forecastNew.tabs.configs">Configurations</button>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="progBalancesView" data-i18n="page.forecastNew.tabs.balances">Balances</button>
                        <button class="panel-tab forecast-new-tabs-overflow-item" data-panel-target="progRulersView" data-i18n="page.chart.tabs.rulers"></button>
                    </div>
                </div>
            </div>
            <div class="panel-content forecast-new-panel-content">
                <div id="progPlanetsView" class="panel-tab-content active">
                    <table class="data-table compact forecast-new-planets-table">
                        <colgroup>
                            <col class="forecast-new-symbol-column">
                            <col class="forecast-new-position-column">
                            <col class="forecast-new-speed-column">
                            <col class="forecast-new-matrix-column">
                            <col class="forecast-new-matrix-column">
                        </colgroup>
                        <thead><tr><th data-i18n="page.chart.table.planets.symbol">Symbol</th><th data-i18n="page.chart.table.planets.position">Position</th><th data-i18n="page.chart.table.planets.speed">Speed</th><th class="forecast-new-matrix-col" data-i18n="page.forecastNew.matrix.displayShort" data-i18n-title="page.accountSettings.matrix.columns.display" title="Display">D</th><th class="forecast-new-matrix-col" data-i18n="page.forecastNew.matrix.aspectingShort" data-i18n-title="page.accountSettings.matrix.columns.aspecting" title="Aspecting">A</th></tr></thead>
                        <tbody id="progPlanetsTable"></tbody>
                    </table>
                </div>
                <div id="progHousesView" class="panel-tab-content">
                    <table class="data-table compact forecast-new-houses-table">
                        <colgroup>
                            <col class="forecast-new-house-cusp-column">
                            <col class="forecast-new-house-sign-column">
                            <col class="forecast-new-house-ruler-column">
                        </colgroup>
                        <thead><tr><th data-i18n="page.chart.table.houses.cusp">House cusp</th><th data-i18n="page.chart.table.houses.sign">Sign</th><th data-i18n="page.chart.table.houses.ruler">Ruler</th></tr></thead>
                        <tbody id="progHousesTable"></tbody>
                    </table>
                </div>
                <div id="progAspectsView" class="panel-tab-content">
                    <table class="data-table compact aspect-list-table">
                        <thead><tr><th class="sortable" data-sort="planet" data-i18n="page.chart.table.aspects.aspect">Aspect</th><th class="sortable" data-sort="type" data-i18n="page.chart.table.aspects.type">Phase</th><th class="sortable" data-sort="orb" data-i18n="page.chart.table.aspects.orb">Orb</th></tr></thead>
                        <tbody id="progAspectsTable"></tbody>
                    </table>
                </div>
                <div id="progGridView" class="panel-tab-content"><div id="progAspectGridContainer"></div></div>
                <div id="progConfigsView" class="panel-tab-content"><div id="progConfigurationsContainer"></div></div>
                <div id="progBalancesView" class="panel-tab-content"><div id="progBalancesContainer"></div></div>
                <div id="progRulersView" class="panel-tab-content"><div id="progRulersContainer"></div></div>
            </div>
        </aside>
    </main>

    <!-- Save-chart modal is injected by SaveChartModal module (save-chart-modal.js) -->

    <script type="module" src="/js/bundles/forecast-new.bundle.js?v=d95fdb474ee6"></script>
</body>
</html>

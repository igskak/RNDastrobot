<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.accountSettings.title"></title>
    <link rel="stylesheet" href="bundles/account-settings.bundle.css?v=578556f55dc7">
    <link rel="stylesheet" href="css/app-nav.css?v=578556f55dc7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>window.__APP_BUILD_ID__ = '578556f55dc7';</script>

<body class="account-settings-page workspace-compact" data-defer-loader>
    <div class="page-loader" id="pageLoader">
        <div class="pl-spinner"></div>
        <div class="pl-text" data-i18n="page.accountSettings.loading"></div>
    </div>

    <div class="account-settings-shell">
        <!-- Kept (hidden) so the shared burger nav (js/app-nav.js) can read the
             account email from it if a future build populates it. -->
        <span id="welcomeLabel" class="header-account-value" hidden style="display:none"></span>
        <header class="account-settings-header">
            <span class="app-nav-slot" data-app-nav-slot></span>
            <a href="/" class="account-settings-back ui-btn ui-btn--ghost ui-btn--sm" data-i18n-title="common.back" data-i18n-aria-label="common.back">←</a>
            <div class="account-settings-headline">
                <h1 class="account-settings-title" data-i18n="page.accountSettings.heading"></h1>
                <span class="account-settings-badge" data-i18n="page.accountSettings.badge"></span>
            </div>
            <span class="account-settings-saved-indicator" id="accountSettingsSavedIndicator" hidden data-i18n="page.accountSettings.savebar.saved"></span>
        </header>

        <nav class="account-settings-tabs" role="tablist" data-i18n-aria-label="page.accountSettings.tabs.ariaLabel">
            <button type="button" class="account-settings-tab is-active" id="accountSettingsTabChart" data-settings-tab="chart" role="tab" aria-selected="true" aria-controls="accountSettingsPanelChart" tabindex="0" data-i18n="page.accountSettings.tabs.chart"></button>
            <button type="button" class="account-settings-tab" id="accountSettingsTabFormats" data-settings-tab="formats" role="tab" aria-selected="false" aria-controls="accountSettingsPanelFormats" tabindex="-1" data-i18n="page.accountSettings.tabs.formats"></button>
            <button type="button" class="account-settings-tab" id="accountSettingsTabBilling" data-settings-tab="billing" role="tab" aria-selected="false" aria-controls="accountSettingsPanelBilling" tabindex="-1" data-i18n="page.accountSettings.tabs.billing" hidden></button>
            <button type="button" class="account-settings-tab" id="accountSettingsTabAccount" data-settings-tab="account" role="tab" aria-selected="false" aria-controls="accountSettingsPanelAccount" tabindex="-1" data-i18n="page.accountSettings.tabs.account"></button>
        </nav>

        <div class="account-settings-status hidden" id="methodologyJobStatus" role="status" aria-live="polite"></div>

        <main class="account-settings-content">
            <!-- ============ Tab 1 · Настройки карты ============ -->
            <section class="account-settings-panel" id="accountSettingsPanelChart" data-settings-panel="chart" role="tabpanel" aria-labelledby="accountSettingsTabChart">
                <section class="account-settings-card">
                    <div class="account-settings-card-head account-settings-card-head--compact">
                        <h2 class="account-settings-section-title" data-i18n="page.accountSettings.groups.display"></h2>
                    </div>
                    <div class="account-settings-rows">
                        <div class="ui-settings-row">
                            <label class="ui-settings-row__label" for="accountHouseSystemSelect" data-i18n="page.accountSettings.creation.houseSystem"></label>
                            <select id="accountHouseSystemSelect" class="account-settings-select account-settings-select--compact">
                                <option value="P" data-i18n="astro.houseSystem.placidus"></option>
                                <option value="K" data-i18n="astro.houseSystem.koch"></option>
                                <option value="W" data-i18n="astro.houseSystem.wholeSign"></option>
                                <option value="E" data-i18n="astro.houseSystem.equal"></option>
                                <option value="R" data-i18n="astro.houseSystem.regiomontanus"></option>
                                <option value="C" data-i18n="astro.houseSystem.campanus"></option>
                            </select>
                        </div>
                        <div class="ui-settings-row">
                            <label class="ui-settings-row__label" for="accountOrientationSelect" data-i18n="page.accountSettings.fields.orientation"></label>
                            <select id="accountOrientationSelect" class="account-settings-select account-settings-select--compact">
                                <option value="aries" data-i18n="page.accountSettings.options.orientationAries"></option>
                                <option value="asc" data-i18n="page.accountSettings.options.orientationAsc"></option>
                            </select>
                        </div>
                        <div class="ui-settings-row">
                            <label class="ui-settings-row__label" for="accountAspectScopeSelect" data-i18n="page.accountSettings.fields.aspectScope"></label>
                            <select id="accountAspectScopeSelect" class="account-settings-select account-settings-select--compact">
                                <option value="all" data-i18n="common.all"></option>
                                <option value="major" data-i18n="common.major"></option>
                                <option value="minor" data-i18n="common.minor"></option>
                            </select>
                        </div>
                        <div class="ui-settings-row">
                            <label class="ui-settings-row__label" for="accountHouseNumberStyleSelect" data-i18n="page.chart.settings.houseLabels.label"></label>
                            <select id="accountHouseNumberStyleSelect" class="account-settings-select account-settings-select--compact">
                                <option value="arabic" data-i18n="page.chart.settings.houseLabels.arabic"></option>
                                <option value="roman" data-i18n="page.chart.settings.houseLabels.roman"></option>
                            </select>
                        </div>
                        <div class="ui-settings-row">
                            <label class="ui-settings-row__label" for="accountHouseLabelsOutsideToggle" data-i18n="page.chart.settings.houseLabels.outside"></label>
                            <input type="checkbox" id="accountHouseLabelsOutsideToggle" class="account-settings-switch">
                        </div>
                        <div class="ui-settings-row">
                            <label class="ui-settings-row__label" for="accountAngularCuspsBoldToggle" data-i18n="page.chart.settings.boldAngularCusps"></label>
                            <input type="checkbox" id="accountAngularCuspsBoldToggle" class="account-settings-switch">
                        </div>
                    </div>
                </section>

                <section class="account-settings-card">
                    <div class="account-settings-card-head account-settings-card-head--compact">
                        <h2 class="account-settings-section-title" data-i18n="page.accountSettings.tables.defaults.title"></h2>
                    </div>
                    <div class="account-settings-table-wrap">
                        <table class="account-settings-table account-settings-table--settings">
                            <thead>
                                <tr>
                                    <th data-i18n="page.accountSettings.tables.columns.setting"></th>
                                    <th data-i18n="page.accountSettings.tables.columns.single"></th>
                                    <th data-i18n="page.accountSettings.tables.columns.double"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th scope="row">
                                        <span class="account-settings-row-title" data-i18n="page.accountSettings.options.showApplyingSeparating"></span>
                                    </th>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="singleShowApplyingSeparating">
                                        </label>
                                    </td>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="doubleShowApplyingSeparating">
                                        </label>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="row">
                                        <span class="account-settings-row-title" data-i18n="page.accountSettings.options.showSpeed"></span>
                                    </th>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="singleShowSpeed">
                                        </label>
                                    </td>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="doubleShowSpeed">
                                        </label>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="row">
                                        <span class="account-settings-row-title" data-i18n="page.accountSettings.options.showStationary"></span>
                                    </th>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="singleShowStationary">
                                        </label>
                                    </td>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="doubleShowStationary">
                                        </label>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="row">
                                        <span class="account-settings-row-title" data-i18n="page.accountSettings.options.showAspectText"></span>
                                    </th>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="singleShowAspectText">
                                        </label>
                                    </td>
                                    <td>
                                        <label class="account-settings-inline-toggle">
                                            <input type="checkbox" id="doubleShowAspectText">
                                        </label>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="account-settings-card">
                    <div class="account-settings-card-head account-settings-card-head--compact">
                        <h2 class="account-settings-section-title" data-i18n="page.accountSettings.tables.aspects.title"></h2>
                    </div>
                    <div class="account-settings-table-wrap">
                        <table class="account-settings-table account-settings-table--aspect-types">
                            <thead>
                                <tr>
                                    <th data-i18n="page.accountSettings.tables.columns.aspect"></th>
                                    <th data-i18n="page.accountSettings.tables.columns.single"></th>
                                    <th data-i18n="page.accountSettings.tables.columns.double"></th>
                                </tr>
                            </thead>
                            <tbody id="accountAspectTypesMatrixBody"></tbody>
                        </table>
                    </div>
                </section>

                <details class="account-settings-card account-settings-card--details">
                    <summary class="account-settings-card-summary">
                        <span>
                            <h2 class="account-settings-section-title" data-i18n="page.accountSettings.tables.bodies.title"></h2>
                        </span>
                        <span class="account-settings-disclosure-indicator" aria-hidden="true"></span>
                    </summary>
                    <div class="account-settings-table-wrap account-settings-table-wrap--tight">
                        <table class="account-settings-table account-settings-table--bodies">
                            <thead>
                                <tr>
                                    <th rowspan="2" data-i18n-aria-label="page.accountSettings.matrix.columns.bodyAria"></th>
                                    <th colspan="2" data-i18n="page.accountSettings.tables.columns.single"></th>
                                    <th colspan="2" data-i18n="page.accountSettings.tables.columns.double"></th>
                                </tr>
                                <tr>
                                    <th data-i18n="page.accountSettings.matrix.columns.display"></th>
                                    <th data-i18n="page.accountSettings.matrix.columns.aspecting"></th>
                                    <th data-i18n="page.accountSettings.matrix.columns.display"></th>
                                    <th data-i18n="page.accountSettings.matrix.columns.aspecting"></th>
                                </tr>
                            </thead>
                            <tbody id="accountBodiesMatrixBody"></tbody>
                        </table>
                    </div>
                </details>

                <details class="account-settings-card account-settings-card--details">
                    <summary class="account-settings-card-summary">
                        <span>
                            <h2 class="account-settings-section-title" data-i18n="page.accountSettings.orbs.title"></h2>
                            <p class="account-settings-section-copy" data-i18n="page.accountSettings.orbs.copy"></p>
                        </span>
                        <span class="account-settings-disclosure-indicator" aria-hidden="true"></span>
                    </summary>
                    <div class="account-settings-details-body">
                        <div class="account-settings-orb-toolbar">
                            <div class="account-settings-orb-strategy">
                                <label
                                    class="account-settings-label"
                                    for="accountOrbPairStrategySelect"
                                    data-i18n="page.accountSettings.orbs.pairStrategy.label"
                                ></label>
                                <select
                                    id="accountOrbPairStrategySelect"
                                    class="account-settings-select account-settings-select--compact"
                                >
                                    <option value="larger" data-i18n="page.accountSettings.orbs.pairStrategy.larger"></option>
                                    <option value="smaller" data-i18n="page.accountSettings.orbs.pairStrategy.smaller"></option>
                                    <option value="average" data-i18n="page.accountSettings.orbs.pairStrategy.average"></option>
                                </select>
                                <p class="account-settings-section-copy account-settings-section-copy--subtle" data-i18n="page.accountSettings.orbs.pairStrategy.hint"></p>
                            </div>
                            <div
                                class="account-settings-profile-tabs"
                                role="tablist"
                                data-i18n-aria-label="page.accountSettings.orbs.tabs.ariaLabel"
                            >
                                <button
                                    type="button"
                                    class="account-settings-profile-tab is-active"
                                    id="accountOrbTabNatal"
                                    role="tab"
                                    aria-selected="true"
                                    aria-controls="accountOrbMatrixPanel"
                                    data-orb-profile-tab="natal"
                                    data-i18n="page.accountSettings.orbs.tabs.natal"
                                ></button>
                                <button
                                    type="button"
                                    class="account-settings-profile-tab"
                                    id="accountOrbTabPrognostic"
                                    role="tab"
                                    aria-selected="false"
                                    aria-controls="accountOrbMatrixPanel"
                                    data-orb-profile-tab="prognostic"
                                    data-i18n="page.accountSettings.orbs.tabs.prognostic"
                                ></button>
                                <button
                                    type="button"
                                    class="account-settings-profile-tab"
                                    id="accountOrbTabSynastry"
                                    role="tab"
                                    aria-selected="false"
                                    aria-controls="accountOrbMatrixPanel"
                                    data-orb-profile-tab="synastry"
                                    data-i18n="page.accountSettings.orbs.tabs.synastry"
                                ></button>
                            </div>
                            <div
                                class="account-settings-profile-tabs"
                                role="tablist"
                                data-i18n-aria-label="page.accountSettings.orbs.viewMode.ariaLabel"
                            >
                                <button
                                    type="button"
                                    class="account-settings-profile-tab is-active"
                                    id="accountOrbViewModeDefault"
                                    role="tab"
                                    aria-selected="true"
                                    data-orb-view-mode="default"
                                    data-i18n="page.accountSettings.orbs.viewMode.default"
                                ></button>
                                <button
                                    type="button"
                                    class="account-settings-profile-tab"
                                    id="accountOrbViewModeCompact"
                                    role="tab"
                                    aria-selected="false"
                                    data-orb-view-mode="compact"
                                    data-i18n="page.accountSettings.orbs.viewMode.compact"
                                ></button>
                            </div>
                            <button
                                type="button"
                                class="account-settings-secondary-action hidden"
                                id="accountApplyNatalOrbsBtn"
                                data-i18n="page.accountSettings.orbs.actions.applyNatal"
                            ></button>
                        </div>
                        <div
                            class="account-settings-table-wrap account-settings-table-wrap--tight account-settings-orb-matrix-wrap"
                            id="accountOrbMatrixPanel"
                            role="tabpanel"
                            aria-labelledby="accountOrbTabNatal"
                        >
                            <table class="account-settings-table account-settings-table--methodology" id="accountOrbsTable">
                                <thead>
                                    <tr id="accountOrbsHeaderRow">
                                        <th
                                            class="account-settings-orb-corner"
                                            data-i18n-title="page.accountSettings.orbs.matrix.cornerTitle"
                                            data-i18n-aria-label="page.accountSettings.orbs.matrix.cornerTitle"
                                        ></th>
                                    </tr>
                                </thead>
                                <tbody id="accountOrbsMatrixBody"></tbody>
                            </table>
                        </div>
                    </div>
                </details>

                <details class="account-settings-card account-settings-card--details">
                    <summary class="account-settings-card-summary">
                        <span>
                            <h2 class="account-settings-section-title" data-i18n="page.accountSettings.dignities.title"></h2>
                        </span>
                        <span class="account-settings-disclosure-indicator" aria-hidden="true"></span>
                    </summary>
                    <div class="account-settings-details-body">
                        <p
                            class="account-settings-section-copy account-settings-section-copy--subtle"
                            data-i18n="page.accountSettings.dignities.hint"
                        ></p>
                        <div class="account-settings-table-wrap account-settings-table-wrap--tight account-settings-dignities-wrap">
                            <table class="account-settings-table account-settings-table--dignities">
                                <thead>
                                    <tr>
                                        <th data-i18n="page.accountSettings.dignities.columns.planet"></th>
                                        <th data-i18n="astro.dignity.domicile"></th>
                                        <th data-i18n="astro.dignity.detriment"></th>
                                        <th data-i18n="astro.dignity.exaltation"></th>
                                        <th data-i18n="astro.dignity.fall"></th>
                                    </tr>
                                </thead>
                                <tbody id="accountDignitiesMatrixBody"></tbody>
                            </table>
                        </div>
                    </div>
                </details>

                <section class="account-settings-card">
                    <div class="account-settings-card-head account-settings-card-head--compact">
                        <h2 class="account-settings-section-title" data-i18n="page.accountSettings.stationary.title"></h2>
                    </div>
                    <div class="account-settings-grid account-settings-grid--two">
                        <div>
                            <label
                                class="account-settings-label"
                                for="accountStationaryThresholdPercent"
                                data-i18n="page.accountSettings.stationary.threshold.label"
                            ></label>
                            <input
                                id="accountStationaryThresholdPercent"
                                type="number"
                                min="0"
                                max="100"
                                step="0.5"
                                inputmode="decimal"
                                class="account-settings-number-input account-settings-stationary-input"
                            >
                            <p
                                class="account-settings-section-copy account-settings-section-copy--subtle"
                                data-i18n="page.accountSettings.stationary.threshold.hint"
                            ></p>
                        </div>
                    </div>
                </section>

                    <section class="account-settings-card">
                        <div class="account-settings-card-head account-settings-card-head--compact">
                            <div>
                                <h2 class="account-settings-section-title" data-i18n="page.accountSettings.methodology.balances.title"></h2>

                        </div>

                                <p class="account-settings-mini-title" data-i18n="page.accountSettings.methodology.balances.planetWeights"></p>
                                <div class="account-settings-table-wrap account-settings-table-wrap--compact-panel">
                                    <table class="account-settings-table account-settings-table--compact account-settings-table--balance-weights account-settings-table--balance-planets">
                                        <thead>
                                            <tr>
                                                <th data-i18n="page.accountSettings.methodology.balances.columns.planet"></th>
                                                <th data-i18n="page.accountSettings.methodology.balances.columns.weight"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="accountBalancePlanetWeightsBody"></tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="account-settings-table-panel">
                                <p class="account-settings-mini-title" data-i18n="page.accountSettings.methodology.balances.specialPoints"></p>
                                <div class="account-settings-table-wrap account-settings-table-wrap--compact-panel">
                                    <table class="account-settings-table account-settings-table--compact account-settings-table--balance-weights account-settings-table--balance-special">
                                        <thead>
                                            <tr>
                                                <th data-i18n="page.accountSettings.methodology.balances.columns.point"></th>
                                                <th data-i18n="page.accountSettings.methodology.balances.columns.weight"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="accountBalanceSpecialWeightsBody"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="account-settings-card">
                        <div class="account-settings-card-head account-settings-card-head--compact">
                            <h2 class="account-settings-section-title" data-i18n="page.accountSettings.visual.title"></h2>
                        </div>
                        <div

                        >

                                class="account-settings-profile-tab is-active"

                                role="tab"
                                aria-selected="true"

                            <button

                                class="account-settings-profile-tab"

                                data-i18n="page.accountSettings.visual.panels.houses"

                        <div class="account-settings-visual-panels">

                                            <tr>
                                                <th data-i18n="page.accountSettings.visual.columns.planet"></th>

                            </div>
                            <div class="account-settings-table-panel hidden" data-visual-panel="houses" role="tabpanel">
                                <p class="account-settings-mini-title" data-i18n="page.accountSettings.visual.panels.houses"></p>
                                <div class="account-settings-table-wrap account-settings-table-wrap--compact-panel">
                                    <table class="account-settings-table account-settings-table--compact account-settings-table--visual-palette">
                                        <thead>
                                            <tr>
                                                <th data-i18n="page.accountSettings.visual.columns.housePoint"></th>
                                                <th data-i18n="page.accountSettings.visual.columns.override"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="accountHouseOverrideColorsBody"></tbody>
                                    </table>
                                </div>
                                <label class="account-settings-option-toggle account-settings-option-toggle--compact">
                                    <span class="account-settings-row-title" data-i18n="page.accountSettings.visual.angularCuspsBlack.label"></span>
                                    <input type="checkbox" id="accountAngularCuspsBlackToggle">
                                </label>
                            </div>
                        </div>
                    </section>
                </div>
            </section>

            <!-- ============ Tab 2 · Форматы ============ -->
            <section class="account-settings-panel hidden" id="accountSettingsPanelFormats" data-settings-panel="formats" role="tabpanel" aria-labelledby="accountSettingsTabFormats" hidden>
                <section class="account-settings-card">
                    <div class="account-settings-card-head account-settings-card-head--compact">
                        <div>
                            <h2 class="account-settings-section-title" data-i18n="page.accountSettings.tabs.formats"></h2>
                            <p class="account-settings-section-copy" data-i18n="page.accountSettings.creation.title"></p>
                        </div>
                    </div>
                    <div class="account-settings-rows">
                        <div class="ui-settings-row">
                            <div class="account-settings-srow-text">
                                <label class="ui-settings-row__label" for="accountTimezoneLabelFormatSelect" data-i18n="page.accountSettings.creation.timezoneLabelFormat"></label>
                                <p class="ui-settings-row__hint" data-i18n="page.accountSettings.creation.timezoneLabelFormatCopy"></p>
                            </div>
                            <select id="accountTimezoneLabelFormatSelect" class="account-settings-select account-settings-select--compact">
                                <option value="UTC" data-i18n="page.accountSettings.creation.timezoneLabelFormatOptions.utc"></option>
                                <option value="GMT" data-i18n="page.accountSettings.creation.timezoneLabelFormatOptions.gmt"></option>
                            </select>
                        </div>
                        <div class="ui-settings-row">
                            <div class="account-settings-srow-text">
                                <label class="ui-settings-row__label" for="accountDateFormatSelect" data-i18n="page.accountSettings.creation.dateFormat"></label>
                                <p class="ui-settings-row__hint" data-i18n="page.accountSettings.creation.dateFormatCopy"></p>
                            </div>
                            <select id="accountDateFormatSelect" class="account-settings-select account-settings-select--compact">
                                <option value="DD_MM_YYYY" data-i18n="page.accountSettings.creation.dateFormatOptions.ddmmyyyy"></option>
                                <option value="MM_DD_YYYY" data-i18n="page.accountSettings.creation.dateFormatOptions.mmddyyyy"></option>
                                <option value="YYYY_MM_DD" data-i18n="page.accountSettings.creation.dateFormatOptions.yyyymmdd"></option>
                                <option value="LOCALE" data-i18n="page.accountSettings.creation.dateFormatOptions.locale"></option>
                            </select>
                        </div>
                        <div class="ui-settings-row">
                            <div class="account-settings-srow-text">
                                <label class="ui-settings-row__label" for="accountDegreeFormatSelect" data-i18n="page.accountSettings.creation.degreeFormat"></label>
                                <p class="ui-settings-row__hint" data-i18n="page.accountSettings.creation.degreeFormatCopy"></p>
                            </div>
                            <select id="accountDegreeFormatSelect" class="account-settings-select account-settings-select--compact">
                                <option value="DEGREES_ONLY" data-i18n="page.accountSettings.creation.degreeFormatOptions.degreesOnly"></option>
                                <option value="DEGREES_MINUTES" data-i18n="page.accountSettings.creation.degreeFormatOptions.degreesMinutes"></option>
                                <option value="DEGREES_MINUTES_SECONDS" data-i18n="page.accountSettings.creation.degreeFormatOptions.degreesMinutesSeconds"></option>
                            </select>
                        </div>
                    </div>
                </section>
            </section>

            <!-- ============ Tab 3 · Оплата и план ============ -->
            <section class="account-settings-panel hidden" id="accountSettingsPanelBilling" data-settings-panel="billing" role="tabpanel" aria-labelledby="accountSettingsTabBilling" hidden>
                <section class="account-plan-card" id="accountPlanCard" aria-labelledby="accountPlanTitle">
                    <div class="account-plan-row">
                        <h2 class="account-plan-title" id="accountPlanTitle"></h2>
                        <span class="account-plan-pill" id="accountPlanUsage"></span>
                    </div>
                    <p class="account-plan-copy" id="accountPlanCopy"></p>
                    <p class="account-plan-billing" id="accountPlanBillingStatus"></p>
                    <button type="button" class="ui-btn ui-btn--secondary hidden" id="accountPlanPortalBtn" data-i18n="page.accountSettings.plan.portal"></button>
                </section>
            </section>

            <!-- ============ Tab 4 · Аккаунт ============ -->
            <section class="account-settings-panel hidden" id="accountSettingsPanelAccount" data-settings-panel="account" role="tabpanel" aria-labelledby="accountSettingsTabAccount" hidden>
                <section class="account-settings-card">
                    <div class="account-settings-card-head account-settings-card-head--compact">
                        <div>
                            <h2 class="account-settings-section-title" data-i18n="page.accountSettings.tabs.account"></h2>
                            <p class="account-settings-section-copy" id="accountSettingsSubtitle" data-i18n="page.accountSettings.subtitle"></p>
                        </div>
                    </div>
                    <div id="onboardingResetSetting" class="onboarding-hidden account-settings-account-block">
                        <p class="account-settings-section-copy" data-i18n="page.onboarding.settings.text"></p>
                        <button id="onboardingResetBtn" type="button" class="ui-btn ui-btn--secondary ui-btn--sm" data-i18n="page.onboarding.settings.reset"></button>
                    </div>
                    <div class="account-settings-account-block account-settings-account-block--danger">
                        <div class="account-settings-account-block-text">
                            <p class="account-settings-mini-title" data-i18n="page.accountSettings.confirmReset.title"></p>
                            <p class="account-settings-section-copy account-settings-section-copy--subtle" data-i18n="page.accountSettings.confirmReset.copy"></p>
                        </div>
                        <button type="button" class="ui-btn ui-btn--danger ui-btn--sm" id="restoreStandardDefaultsBtn" data-i18n="page.accountSettings.actions.restore"></button>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <div class="account-settings-savebar hidden" id="accountSettingsSaveBar" role="region" data-i18n-aria-label="page.accountSettings.savebar.unsaved">
        <span class="account-settings-savebar__status" data-i18n="page.accountSettings.savebar.unsaved"></span>
        <div class="account-settings-savebar__actions">
            <button type="button" class="ui-btn ui-btn--ghost" id="accountSettingsDiscardBtn" data-i18n="page.accountSettings.actions.discard"></button>
            <button type="button" class="ui-btn ui-btn--primary" id="saveAccountSettingsBtn" data-i18n="page.accountSettings.actions.saveShort"></button>
        </div>
    </div>

    <div id="accountSettingsResetConfirmBackdrop" class="account-settings-confirm-backdrop hidden" aria-hidden="true"></div>
    <div
        id="accountSettingsResetConfirmDialog"
        class="account-settings-confirm-dialog hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="accountSettingsResetConfirmTitle"
        aria-describedby="accountSettingsResetConfirmCopy"
    >
        <div class="account-settings-confirm-card">
            <div class="account-settings-confirm-head">
                <div>
                    <h2 class="account-settings-confirm-title" id="accountSettingsResetConfirmTitle" data-i18n="page.accountSettings.confirmReset.title"></h2>
                    <p class="account-settings-confirm-copy" id="accountSettingsResetConfirmCopy" data-i18n="page.accountSettings.confirmReset.copy"></p>
                </div>
                <button
                    type="button"
                    class="account-settings-confirm-close"
                    id="accountSettingsResetConfirmClose"
                    data-i18n-aria-label="common.close"
                >×</button>
            </div>
            <div class="account-settings-confirm-actions">
                <button type="button" class="ui-btn ui-btn--ghost" id="accountSettingsResetConfirmCancel" data-i18n="common.cancel"></button>
                <button type="button" class="ui-btn ui-btn--danger" id="accountSettingsResetConfirmSubmit" data-i18n="page.accountSettings.confirmReset.confirm"></button>
            </div>
        </div>
    </div>

    <div id="accountSettingsToast" class="toast"></div>

    <script type="module" src="js/bundles/account-settings.bundle.js?v=578556f55dc7"></script>
    <script src="/runtime-config.js"></script>
    <script src="js/analytics.js?v=578556f55dc7"></script>
    <script src="js/app-nav.js?v=578556f55dc7"></script>
</body>
